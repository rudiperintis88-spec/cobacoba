<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Hasil Kapal</title>
<style>
:root{--y:#ffff00;--ink:#111;--bg:#fff;--mut:#666}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 Cambria,"Times New Roman",Times,serif}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding:14px 20px;border-bottom:1px solid #ccc;background:#f6f6f6}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:bold}
.bar select,.bar button{font:inherit;padding:6px 10px;border:1px solid #888;border-radius:4px;background:#fff;color:var(--ink)}
.bar button{cursor:pointer;font-weight:bold}
.bar #cetak{background:var(--y);border-color:var(--ink)}
.bar select:focus-visible,.bar button:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;row-gap:22px;padding:20px;max-width:1100px;margin:0 auto}
table{width:100%;border-collapse:collapse}
td{padding:3px 6px;vertical-align:middle}
td:nth-child(2){width:84px;white-space:nowrap}
td:nth-child(3){width:120px;white-space:nowrap}
.n{text-align:right}
.h td{background:var(--y);font-weight:bold}
.t td{background:var(--y);font-weight:bold;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.b td{font-weight:bold}
.ln td{border-top:1px solid var(--ink)}
.g td{border:1px solid var(--ink)}
.g td:nth-child(2){text-align:right}
.note{max-width:1100px;margin:0 auto;padding:0 20px 24px;color:var(--mut);font-size:12.5px}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .a1{order:1}.a2{order:2}.b1{order:3}.b2{order:4}
  td:nth-child(2){width:76px}
  td:nth-child(3){width:108px}
}
@media print{
  @page{size:A4 landscape;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{display:none}
  body{font-size:11px}
  .grid{padding:0;max-width:none;column-gap:28px;row-gap:16px}
  .note{padding:8px 0 0}
}

[hidden]{display:none!important}
.center{max-width:480px;margin:20vh auto 0;padding:0 20px;display:flex;flex-direction:column;gap:14px;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.center .hint{margin:0 0 6px;text-align:center;color:#111;font:bold 28px/1.2 Georgia,"Times New Roman",serif}
.center input{height:56px;border:1px solid #dde3ef;border-radius:16px;background:#e8f0fe;text-align:center;font-size:20px;color:#111;width:100%;padding:0 56px}
.center input:focus{border:3px solid #111;padding:0 54px}
.pw{position:relative}
.mata{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:#6b7280;cursor:pointer;display:grid;place-items:center;padding:0}
.center input::placeholder{color:#8a94a6}
.center input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.btn-soft{height:54px;border:0;border-radius:14px;background:#2a4bd7;font-size:20px;font-weight:bold;color:#fff;cursor:pointer}
.btn-soft:hover{background:#2140c0}
.err{min-height:22px;margin:0;text-align:center;color:#b42318;font-size:15px}
.link{align-self:center;background:none;border:0;color:#2563eb;font:inherit;font-size:15px;cursor:pointer;text-decoration:underline}
.kode{font:bold 30px/1.2 ui-monospace,Menlo,Consolas,monospace;text-align:center;letter-spacing:2px;padding:18px;background:#e8f0fe;border-radius:18px}
.center p{margin:0;text-align:center;color:#444;font-size:16px;line-height:1.5}
.center textarea{width:100%;min-height:90px;border:2px solid #111;border-radius:14px;padding:10px;font:13px ui-monospace,Menlo,Consolas,monospace}
.status{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 20px;color:#8a94a6;font:15px system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.status b{color:#1f2937}
.ico{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;border-radius:9px;background:#2563eb;color:#fff;vertical-align:middle}
.aksi{display:flex;gap:10px;align-items:center}
.refresh{display:inline-flex;align-items:center;gap:10px;padding:9px 22px;border:1px solid #e1e6f0;border-radius:16px;background:#eef1f8;color:#1f2937;font:bold 17px system-ui,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
.refresh .ico{width:30px;height:30px;margin:0}
.keluar{border:0;background:none;color:#6b7280;font:15px system-ui,Arial,sans-serif;cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:6px;padding:0 20px;border-bottom:1px solid #dde2ec;overflow-x:auto}
.tabs button{padding:11px 16px;border:0;border-bottom:3px solid transparent;background:none;color:#6b7280;font:600 15px system-ui,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:#1f2937;border-bottom-color:#2563eb}
.ctl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;padding:16px 20px 0;max-width:1100px;margin:0 auto}
.ctl label{display:flex;flex-direction:column;gap:3px;font:bold 13px system-ui,Arial,sans-serif}
.ctl select,.ctl button{font:inherit;padding:7px 10px;border:1px solid #888;border-radius:6px;background:#fff;color:#111}
.ctl #pdf{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.grid[data-tab=a],.grid[data-tab=b]{grid-template-columns:1fr;max-width:640px}
.grid[data-tab=a] .b1,.grid[data-tab=a] .b2,.grid[data-tab=b] .a1,.grid[data-tab=b] .a2{display:none}
@media print{.status,.tabs,.ctl{display:none}}
</style>
</head>
<body>
<section id="login" class="center">
  <p class="hint">Laporan</p>
  <input id="nama" type="text" placeholder="Nama" autocomplete="username" aria-label="Nama">
  <div class="pw"><input id="sandi" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button type="button" id="mata" class="mata" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button type="button" id="masuk" class="btn-soft">Masuk</button>
  <p id="galat" class="err" role="alert"></p>
</section>

<div id="app" hidden>
  <div class="status">
    <div id="stat" role="status"></div>
    <div class="aksi">
      <button type="button" id="muat" class="refresh"></button>
      <button type="button" id="keluar" class="keluar">Keluar</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Laporan">
    <button type="button" role="tab" data-t="semua">Semua</button>
    <button type="button" role="tab" data-t="a">KM Bintang Laut</button>
    <button type="button" role="tab" data-t="b">KM Serba Jaya</button>
  </nav>
  <div class="ctl">
    <label id="wa">KM Bintang Laut<select id="sa"></select></label>
    <label id="wb">KM Serba Jaya<select id="sb"></select></label>
    <button type="button" id="pdf">Export PDF</button>
  </div>
  <main class="grid" id="grid" data-tab="semua">
    <div class="a1" id="a1"></div>
    <div class="b1" id="b1"></div>
    <div class="a2" id="a2"></div>
    <div class="b2" id="b2"></div>
  </main>
</div>
<script>
var SHEET_ID = '1c1ADp2Yc7xJ6GI6vRAYlZqauayF89lmVdH-LjE-IbNM';
var URL_DATA = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
  '/gviz/tq?tqx=out:json&sheet=Data&headers=0&range=A3:O1000';

// Kolom di sheet Data (mulai 0 = kolom A)
var K = [
  { id: 'a', nama: 'KM BINTANG LAUT', def: 'TRIP 76',
    c: { ket: 10, trip: 11, nom: 12, ut: 13, di: 14 },
    // data tersimpan 20 November 2026 (dipakai bila spreadsheet tidak bisa dibaca)
    items: ['Ikan Basah', 'Ikan Asin'],
    trips: {
      'TRIP 75': { nom: [10568000, 36672800], utang: 129760, diambil: 3100000 },
      'TRIP 76': { nom: [19369800, 33206850], utang: 0, diambil: 3950000 },
      'TRIP 77': { nom: [11764500, 0], utang: 0, diambil: 2000000 }
    } },
  { id: 'b', nama: 'KM SERBA JAYA', def: 'TRIP 14',
    c: { ket: 2, trip: 3, nom: 4, ut: 5, di: 6 },
    items: ['Ikan Basah', 'Ikan Basah Toke', 'Ikan Asin'],
    trips: {
      'TRIP 13': { nom: [3996250, 0, 9502500], utang: 335075, diambil: 1780000 },
      'TRIP 14': { nom: [15856850, 712500, 28545400], utang: 765200, diambil: 1680000 },
      'TRIP 15': { nom: [9994200, 435000, 0], utang: 0, diambil: 1430000 }
    } }
];

var TIER = [
  [0, 50000000, 0.10, 'Rp 0 - Rp 50.000.000'],
  [50000000, 75000000, 0.11, 'Rp 50.000.001 - Rp 75.000.000'],
  [75000000, 100000000, 0.12, 'Rp 75.000.001 - Rp 100.000.000'],
  [100000000, null, 0.13, 'Rp 100.000.001 - Max']
];

function el(id) { return document.getElementById(id); }
function dots(s) { return String(s).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function rp(n) { var r = Math.round(n); return (r < 0 ? '-' : '') + 'Rp' + dots(Math.abs(r)); }
function rp2(n) { var p = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '-' : '') + 'Rp' + dots(p[0]) + ',' + p[1]; }
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
function angka(t) { return parseInt(String(t).replace(/\D/g, ''), 10) || 0; }

/* ---------- Hitungan ---------- */
function hitung(k, trip) {
  var d = k.trips[trip];
  var total = sum(d.nom);
  var hasil = TIER.map(function (t) {
    var a = Math.max(0, t[1] === null ? total - t[0] : Math.min(total, t[1]) - t[0]);
    return { a: a, p: t[2], c: a * t[2], ket: t[3] };
  });
  var gaji = sum(hasil.map(function (h) { return h.c; }));
  var utang = -Math.abs(d.utang), diambil = -Math.abs(d.diambil);
  return { d: d, total: total, hasil: hasil, gaji: gaji, utang: utang, diambil: diambil, sisa: gaji + utang + diambil };
}

/* ---------- Tampilan ---------- */
function atas(k, trip, r) {
  var h = '<table><tr><td colspan="3"><b>LAPORAN HASIL KAPAL</b></td></tr>' +
    '<tr><td colspan="3"><b>' + k.nama + '</b></td></tr>' +
    '<tr><td colspan="3"><b>' + trip + '</b></td></tr>' +
    '<tr class="h"><td>Keterangan</td><td>Percent %</td><td class="n">Nominal</td></tr>';
  k.items.forEach(function (it, i) {
    h += '<tr><td>' + it + '</td><td></td><td class="n">' + rp(r.d.nom[i]) + '</td></tr>';
  });
  h += '<tr class="t"><td>Total</td><td></td><td class="n">' + rp(r.total) + '</td></tr>';
  r.hasil.forEach(function (x) {
    h += '<tr><td>Gaji Terima Sesuai Hasil (' + x.ket + ')</td><td>' + Math.round(x.p * 100) +
         ' %</td><td class="n">' + rp(x.c) + '</td></tr>';
  });
  h += '<tr class="b ln"><td>Gaji Total</td><td></td><td class="n">' + rp(r.gaji) + '</td></tr>' +
       '<tr class="b"><td>Sisa Utang</td><td></td><td class="n">' + rp(r.utang) + '</td></tr>' +
       '<tr class="b"><td>Gaji Sudah Diambil</td><td></td><td class="n">' + rp(r.diambil) + '</td></tr>' +
       '<tr class="b ln"><td>Sisa Gaji</td><td></td><td class="n">' + rp(r.sisa) + '</td></tr></table>';
  return h;
}

function bawah(r) {
  var h = '<table><tr class="h"><td>Hasil</td><td>Percent %</td><td class="n">Nominal</td></tr>';
  r.hasil.forEach(function (x) {
    h += '<tr class="g"><td class="n">' + rp2(x.a) + '</td><td>' + Math.round(x.p * 100) +
         '%</td><td class="n">' + rp(x.c) + '</td></tr>';
  });
  h += '<tr class="g b"><td class="n">' + rp2(r.total) + '</td><td></td><td class="n">' + rp(r.gaji) + '</td></tr></table>';
  return h;
}

function render() {
  K.forEach(function (k) {
    if (kapalBoleh && k.id !== kapalBoleh) { el(k.id + '1').innerHTML = ''; el(k.id + '2').innerHTML = ''; return; }
    var trip = el('s' + k.id).value;
    if (!trip || !k.trips[trip]) {
      el(k.id + '1').innerHTML = '<p><b>' + k.nama + '</b><br>Belum ada data trip.</p>';
      el(k.id + '2').innerHTML = '';
      return;
    }
    var r = hitung(k, trip);
    el(k.id + '1').innerHTML = atas(k, trip, r);
    el(k.id + '2').innerHTML = bawah(r);
  });
}

function isiPilihan() {
  K.forEach(function (k) {
    var s = el('s' + k.id);
    var cur = s.value || k.def;
    var names = Object.keys(k.trips).sort(function (a, b) { return angka(a) - angka(b); });
    if (!isMaster()) {
      names = names.filter(function (t) { return t === TRIP_TERBUKA[k.id]; });
      cur = TRIP_TERBUKA[k.id];
      s.disabled = true;
    } else { s.disabled = false; }
    s.innerHTML = '';
    names.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t; o.textContent = t;
      s.appendChild(o);
    });
    s.value = k.trips[cur] ? cur : (names.length ? names[names.length - 1] : '');
  });
}

/* ---------- Membaca spreadsheet (Google Visualization) ---------- */
function sel(row, i) { var c = row.c && row.c[i]; return c && c.v !== null && c.v !== undefined ? c.v : ''; }
function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
function normTrip(v) {
  var s = String(v).trim().replace(/\s+/g, ' ').toUpperCase();
  return /^\d+$/.test(s) ? 'TRIP ' + s : s;
}

function olah(rows) {
  K.forEach(function (k) {
    var items = [], trips = {};
    rows.forEach(function (row) {
      var ket = String(sel(row, k.c.ket)).trim();
      var trip = normTrip(sel(row, k.c.trip));
      if (!ket || !trip) return;
      if (items.indexOf(ket) < 0) items.push(ket);
      var t = trips[trip] || (trips[trip] = { nom: {}, utang: 0, diambil: 0, ada: false });
      var n = num(sel(row, k.c.nom)), u = num(sel(row, k.c.ut)), d = num(sel(row, k.c.di));
      t.nom[ket] = (t.nom[ket] || 0) + n;
      t.utang += u; t.diambil += d;
      if (n || u || d) t.ada = true;
    });
    var hasil = {};
    Object.keys(trips).forEach(function (name) {
      var t = trips[name];
      if (!t.ada) return;
      hasil[name] = { nom: items.map(function (it) { return t.nom[it] || 0; }), utang: t.utang, diambil: t.diambil };
    });
    k.items = items; k.trips = hasil;
  });
}


/* ---------- Akses: password dan izin perangkat ---------- */
var ITER = 100000;
/* Peran dan kapal yang boleh dilihat ditentukan oleh password. Nama bebas diisi (harus nama orang).
   kapal 'a' = KM Bintang Laut, 'b' = KM Serba Jaya. */
var AKUN = [
  { master: true,  kapal: null, s: 'b0c89b4e765af617448ae80d242ccf7b', h: '9d5a8ff26818bff861f0ba0dd2b396a412d94ba3f1ffd362193ad3d0e696453b' },
  { master: false, kapal: 'a', s: '8a3a3643e079a1dc15182651210bc653', h: '5b850e16b07816f8203c9551f69df14b1d2ca53d3528b72f165014a6517a1065' },
  { master: false, kapal: 'b', s: '15ae99f1779c9e7b339b1485e1173481', h: '7ad1c9aee5ea986d4973a39aad7ffbd127ee5a25a0d1a1384325492aa3cc9a05' }
];
/* Skrip Google (Apps Script) yang sama dengan dashboard cabang: mengurus persetujuan perangkat
   (email SETUJUI/TOLAK ke admin) dan mencatat login beserta lokasinya. */
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLl7p16a1CSTj2prCGzKjUDxeIEyJsWwaCG_Nu2EEIFV2eoDlB7onRJ0KvMyPnNaAljw/exec';
/* Trip yang dibuka untuk password biasa. Trip lain tidak tampil.
   Untuk membuka trip berikutnya, ganti nilainya (mis. 'TRIP 76' -> 'TRIP 77'),
   maka trip lama otomatis tertutup. Password master tetap melihat semua trip + Export. */
var TRIP_TERBUKA = { a: 'TRIP 76', b: 'TRIP 14' };
var peran = null, namaMasuk = '', kapalBoleh = null;
function isMaster() { return peran === 'master'; }
var BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var IKON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>';
var tab = 'semua', gagal = 0, kunciSampai = 0, timer = null;

function heks(b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
function dariHeks(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
function turunan(sandi, saltHex) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(sandi), 'PBKDF2', false, ['deriveBits'])
    .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: dariHeks(saltHex), iterations: ITER, hash: 'SHA-256' }, k, 256); })
    .then(heks);
}
function bacaGviz(txt) { return JSON.parse(txt.match(/setResponse\(([\s\S]*)\);?\s*$/)[1]); }
function idPerangkat() {
  try {
    var id = localStorage.getItem('pp_device_id');
    if (!id || id === 'undefined' || id === 'null') {
      id = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
      localStorage.setItem('pp_device_id', id);
    }
    return id;
  } catch (e) { return 'no-storage-' + Date.now() + '-' + Math.random().toString(36).slice(2); }
}
function namaKapal() { return kapalBoleh ? (kapalBoleh === 'a' ? 'KM Bintang Laut' : 'KM Serba Jaya') : 'Semua kapal (master)'; }
/* Tanya skrip: approved / pending / rejected. Perangkat baru otomatis didaftarkan dan emailnya terkirim ke admin. */
function cekSekali() {
  return new Promise(function (ok) {
    var cb = '_devcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6), selesai = false, sc = document.createElement('script'), t;
    function bersih() { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (sc.parentNode) sc.parentNode.removeChild(sc); }
    t = setTimeout(function () { if (!selesai) { selesai = true; bersih(); ok(null); } }, 9000);
    window[cb] = function (d) { if (selesai) return; selesai = true; bersih(); ok(d || null); };
    sc.onerror = function () { if (!selesai) { selesai = true; bersih(); ok(null); } };
    sc.src = APPS_SCRIPT_URL + '?action=cek&device=' + encodeURIComponent(idPerangkat()) + '&nama=' + encodeURIComponent(namaMasuk) +
             '&cabang=' + encodeURIComponent(namaKapal()) + '&callback=' + cb;
    document.body.appendChild(sc);
  });
}
function cekPerangkat() {
  return cekSekali().then(function (r) { return r || cekSekali(); }).then(function (r) { return r || cekSekali(); })
    .then(function (r) { return r || { status: 'error' }; });
}

function namaValid(n) {
  if (n.length < 3 || n.length > 60) return false;
  if (!/^[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ .'-]*$/.test(n)) return false;
  if (/^(tekong|admin|master|user|test|tes|nama|bos)$/i.test(n)) return false;
  return true;
}
function masuk() {
  var galat = el('galat');
  if (Date.now() < kunciSampai) { galat.textContent = 'Terlalu banyak percobaan. Coba lagi beberapa detik lagi.'; return; }
  if (!window.crypto || !crypto.subtle) { galat.textContent = 'Browser ini tidak mendukung login. Pakai Chrome, Edge, atau Safari terbaru.'; return; }
  var n = el('nama').value.trim().replace(/\s+/g, ' '), p = el('sandi').value;
  if (!namaValid(n)) { galat.textContent = 'Isi dengan nama orang (huruf saja, minimal 3 huruf).'; return; }
  galat.textContent = 'Memeriksa...';
  Promise.all(AKUN.map(function (a) { return turunan(p, a.s); })).then(function (hs) {
    var idx = -1;
    AKUN.forEach(function (a, i) { if (hs[i] === a.h) idx = i; });
    if (idx >= 0) {
      gagal = 0; galat.textContent = '';
      peran = AKUN[idx].master ? 'master' : 'biasa'; kapalBoleh = AKUN[idx].kapal; namaMasuk = n;
      lanjut();
    } else {
      gagal++;
      if (gagal >= 5) { kunciSampai = Date.now() + 30000; gagal = 0; }
      galat.textContent = 'Password salah.';
    }
  });
}

/* ---------- Lokasi login ----------
   HP/tablet: izin lokasi GPS wajib, alamat dicari dari koordinat. Laptop/PC: lokasi perkiraan dari IP. */
function infoPerangkat() {
  var ua = navigator.userAgent || '', os = 'Tidak diketahui', br = 'Tidak diketahui';
  if (/Windows/i.test(ua)) os = 'Windows'; else if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS'; else if (/Macintosh|Mac OS/i.test(ua)) os = 'Mac'; else if (/Linux/i.test(ua)) os = 'Linux';
  if (/Edg\//i.test(ua)) br = 'Edge'; else if (/OPR\//i.test(ua)) br = 'Opera';
  else if (/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) br = 'Chrome'; else if (/Firefox\//i.test(ua)) br = 'Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) br = 'Safari';
  return { os: os, br: br };
}
function perangkatSeluler() { return /Android|iPhone|iPad|iPod|Mobile|Windows Phone|BlackBerry|webOS/i.test(navigator.userAgent || ''); }
function mintaGPS() {
  return new Promise(function (ok, no) {
    if (!navigator.geolocation) { no('nogeo'); return; }
    navigator.geolocation.getCurrentPosition(function (p) { ok({ lat: p.coords.latitude, lng: p.coords.longitude }); }, no,
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}
function alamatDariKoordinat(lat, lng) {
  return fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1',
    { headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (d) { var a = d.address || {};
      return { alamat: d.display_name || '-', negara: a.country || '-', kota: a.city || a.town || a.village || a.county || a.regency || '-' }; })
    .catch(function () { return { alamat: '-', negara: '-', kota: '-' }; });
}
function lokasiDariIP() {
  return new Promise(function (ok) {
    var selesai = false, t = setTimeout(function () { if (!selesai) { selesai = true; ok({ sumber: 'IP' }); } }, 2500);
    fetch('https://ipapi.co/json/').then(function (r) { return r.json(); }).then(function (d) {
      if (selesai) return; selesai = true; clearTimeout(t);
      ok({ sumber: 'IP', ip: d.ip || '-', negara: d.country_name || '-', kota: d.city || '-',
           lat: d.latitude != null ? d.latitude : '', lng: d.longitude != null ? d.longitude : '', alamat: '-' });
    }).catch(function () { if (!selesai) { selesai = true; clearTimeout(t); ok({ sumber: 'IP' }); } });
  });
}
/* Catat login berhasil beserta perangkat dan lokasi ke skrip admin. Password tidak ikut dikirim. */
function catatLogin(loc) {
  var d = infoPerangkat();
  try {
    fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ nama: namaMasuk, status: 'Berhasil', password: '', cabang: namaKapal(), link: location.href,
        akses: isMaster() ? 'Bisa Export' : 'Hanya Lihat', perangkat: d.os, browser: d.br,
        ip: loc.ip || '-', negara: loc.negara || '-', kota: loc.kota || '-', lat: loc.lat == null ? '' : loc.lat, lng: loc.lng == null ? '' : loc.lng,
        alamat: loc.alamat || '-' }) });
  } catch (e) { /* gagal mencatat tidak boleh memblokir login */ }
}
function masukApp() {
  var galat = el('galat');
  function buka(loc) { catatLogin(loc); galat.textContent = ''; el('login').hidden = true; bukaApp(); }
  if (!perangkatSeluler()) { lokasiDariIP().then(buka); return; }
  galat.textContent = 'Meminta izin lokasi...';
  mintaGPS().then(function (g) {
    return alamatDariKoordinat(g.lat, g.lng).then(function (a) {
      buka({ lat: g.lat, lng: g.lng, alamat: a.alamat, kota: a.kota, negara: a.negara, sumber: 'GPS' });
    });
  }).catch(function () {
    peran = null; kapalBoleh = null;
    galat.textContent = 'Izin lokasi diperlukan untuk login. Mohon izinkan akses lokasi, lalu coba lagi.';
  });
}
function lanjut() {
  if (!peran) { keluar(); return; }
  var galat = el('galat');
  galat.textContent = 'Memeriksa perangkat...';
  cekPerangkat().then(function (dev) {
    if (dev.status === 'approved') { masukApp(); return; }
    peran = null; kapalBoleh = null;
    galat.textContent = dev.status === 'pending' ? 'Perangkat ini belum disetujui admin. Permintaan sudah dikirim, coba Masuk lagi setelah disetujui.'
      : dev.status === 'rejected' ? 'Perangkat ini ditolak admin.'
      : 'Tidak bisa menghubungi server. Coba lagi.';
  });
}
function bukaApp() {
  el('app').hidden = false;
  el('pdf').hidden = !isMaster();
  document.querySelector('.tabs').hidden = !!kapalBoleh;
  tab = kapalBoleh || 'semua';
  isiPilihan(); render();
  pilihTab(tab); muat();
  clearInterval(timer);
  timer = setInterval(function () {
    muat();
    cekPerangkat().then(function (dev) { if (dev.status === 'pending' || dev.status === 'rejected') { keluar(); el('galat').textContent = 'Perangkat ini tidak lagi disetujui admin.'; } });
  }, 120000);
}
function keluar() {
  peran = null; namaMasuk = ''; kapalBoleh = null;
  clearInterval(timer);
  el('app').hidden = true; el('login').hidden = false;
  el('nama').value = ''; el('sandi').value = ''; el('galat').textContent = '';
}
/* ---------- Status, tab, data ---------- */
function tgl(d) {
  d = d || new Date();
  return d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear() + ', ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function setStatus(ok, teks) {
  el('stat').innerHTML = '<span class="ico">' + IKON + '</span>' +
    (ok ? 'Live · tersinkron <b>' + tgl() + '</b> · otomatis tiap 2 menit' : teks);
}
function pilihTab(t) {
  tab = t;
  el('grid').setAttribute('data-tab', t);
  [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-t') === t); });
  el('wa').hidden = (t === 'b'); el('wb').hidden = (t === 'a');
}
function muat() {
  if (el('app').hidden) return;
  el('stat').innerHTML = '<span class="ico">' + IKON + '</span>Memuat data...';
  fetch(URL_DATA + '&t=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (txt) {
      var j = bacaGviz(txt);
      if (j.status !== 'ok') throw new Error('status');
      olah(j.table.rows); isiPilihan(); render();
      setStatus(true);
    })
    .catch(function () { setStatus(false, 'Offline · menampilkan data tersimpan 20 November 2026'); });
}

/* ---------- Export PDF langsung (tanpa dialog cetak) ---------- */
var LB = { r: { ' ': 250, '%': 833, ',': 250, '-': 333, '.': 250, 'R': 667, 'p': 500 },
           b: { ' ': 250, '%': 1000, ',': 250, '-': 333, '.': 250, 'R': 722, 'p': 556 } };
function lebar(t, b, u) {
  var m = LB[b ? 'b' : 'r'], w = 0;
  for (var i = 0; i < t.length; i++) { var c = t.charAt(i); w += (c >= '0' && c <= '9') ? 500 : (m[c] || 500); }
  return w * u / 1000;
}
function esc(t) { return t.replace(/[\\()]/g, '\\$&'); }
function f2(n) { return n.toFixed(2); }

function halaman(h) {
  var k = h.k, r = h.r, RH = 19, y = 841.89 - 50, s = '';
  function teks(t, x, b, u, rata) {
    if (!t) return;
    var xx = rata === 'r' ? x - lebar(t, b, u) : x;
    s += 'BT /' + (b ? 'F2' : 'F1') + ' ' + u + ' Tf ' + f2(xx) + ' ' + f2(y - 13.5) + ' Td (' + esc(t) + ') Tj ET\n';
  }
  function kuning() { s += '1 1 0 rg 40 ' + f2(y - RH) + ' 515 ' + RH + ' re f 0 g\n'; }
  function garis(yy) { s += '0.6 w 40 ' + f2(yy) + ' m 555 ' + f2(yy) + ' l S\n'; }
  function petak(x, w) { s += '0.6 w ' + x + ' ' + f2(y - RH) + ' ' + w + ' ' + RH + ' re S\n'; }
  function baris(a, b, c, g) {
    var tebal = /[bth]/.test(g);
    if (/[ht]/.test(g)) kuning();
    if (/t/.test(g)) { garis(y); garis(y - RH); }
    if (/l/.test(g)) garis(y);
    teks(a, 44, tebal, 10.5); teks(b, 375, tebal, 10.5); teks(c, 551, tebal, 10.5, 'r');
    y -= RH;
  }
  function petak3(a, b, c, tebal) {
    petak(40, 330); petak(370, 55); petak(425, 130);
    teks(a, 366, tebal, 10.5, 'r'); teks(b, 421, tebal, 10.5, 'r'); teks(c, 551, tebal, 10.5, 'r');
    y -= RH;
  }
  teks('LAPORAN HASIL KAPAL', 40, 1, 13); y -= 21;
  teks(k.nama, 40, 1, 13); y -= 21;
  teks(h.trip, 40, 1, 13); y -= 24;
  baris('Keterangan', 'Percent %', 'Nominal', 'h');
  k.items.forEach(function (it, i) { baris(it, '', rp(r.d.nom[i]), ''); });
  baris('Total', '', rp(r.total), 't');
  r.hasil.forEach(function (x) { baris('Gaji Terima Sesuai Hasil (' + x.ket + ')', Math.round(x.p * 100) + ' %', rp(x.c), ''); });
  baris('Gaji Total', '', rp(r.gaji), 'bl');
  baris('Sisa Utang', '', rp(r.utang), 'b');
  baris('Gaji Sudah Diambil', '', rp(r.diambil), 'b');
  baris('Sisa Gaji', '', rp(r.sisa), 'bl');
  y -= 24;
  kuning(); teks('Hasil', 44, 1, 10.5); teks('Percent %', 375, 1, 10.5); teks('Nominal', 551, 1, 10.5, 'r'); y -= RH;
  r.hasil.forEach(function (x) { petak3(rp2(x.a), Math.round(x.p * 100) + '%', rp(x.c), 0); });
  petak3(rp2(r.total), '', rp(r.gaji), 1);
  y = 58; teks('Dibuat ' + tgl() + ' dari data spreadsheet.', 40, 0, 8);
  return s;
}

function buatPdf(hal) {
  var o = [], kids = [];
  o[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  o[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>';
  o[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>';
  hal.map(halaman).forEach(function (c, i) {
    var p = 5 + i * 2, q = p + 1;
    kids.push(p + ' 0 R');
    o[p] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + q + ' 0 R >>';
    o[q] = '<< /Length ' + c.length + ' >>\nstream\n' + c + '\nendstream';
  });
  o[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + kids.length + ' >>';
  var out = '%PDF-1.4\n', off = [], i;
  for (i = 1; i < o.length; i++) { off[i] = out.length; out += i + ' 0 obj\n' + o[i] + '\nendobj\n'; }
  var xr = out.length;
  out += 'xref\n0 ' + o.length + '\n0000000000 65535 f \n';
  for (i = 1; i < o.length; i++) out += ('0000000000' + off[i]).slice(-10) + ' 00000 n \n';
  return out + 'trailer\n<< /Size ' + o.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
}

function ekspor() {
  if (!isMaster()) return;
  var hal = [];
  K.forEach(function (k) {
    if (tab !== 'semua' && tab !== k.id) return;
    var t = el('s' + k.id).value;
    if (t && k.trips[t]) hal.push({ k: k, trip: t, r: hitung(k, t) });
  });
  if (!hal.length) return;
  var nama = 'Laporan_' + hal.map(function (h) { return h.k.nama.replace(/\s+/g, '_') + '_' + h.trip.replace(/\s+/g, ''); }).join('_dan_') + '.pdf';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buatPdf(hal)], { type: 'application/pdf' }));
  a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}

/* ---------- Mulai ---------- */
el('muat').innerHTML = IKON.replace('<svg', '<span class="ico"><svg').replace('</svg>', '</svg></span>') + 'Refresh';
isiPilihan(); render();
K.forEach(function (k) { el('s' + k.id).addEventListener('change', render); });
[].forEach.call(document.querySelectorAll('.tabs button'), function (b) {
  b.addEventListener('click', function () { pilihTab(b.getAttribute('data-t')); });
});
el('masuk').addEventListener('click', masuk);
el('mata').addEventListener('click', function () { var i = el('sandi'); i.type = i.type === 'password' ? 'text' : 'password'; });
el('sandi').addEventListener('keydown', function (e) { if (e.key === 'Enter') masuk(); });
el('nama').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('sandi').focus(); });
el('muat').addEventListener('click', muat);
el('pdf').addEventListener('click', ekspor);
el('keluar').addEventListener('click', keluar);
document.addEventListener('visibilitychange', function () { if (!document.hidden) muat(); });
</script>
