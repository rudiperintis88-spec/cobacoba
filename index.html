<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Piutang — PT Perintis Perkasa</title>
<style>
  :root{ --bg:#f7f7f5; --panel:#fff; --border:#e2e2de; --ink:#1c1c1a; --muted:#6b6b66; --blue:#2a4bd6; --red:#c8394a; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',Inter,-apple-system,sans-serif;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:6px;padding:10px 16px 0;background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto;overflow-x:auto;}
  .topbar .brand{font-family:Georgia,serif;font-weight:600;font-size:15px;margin-right:14px;white-space:nowrap;}
  .maintab{font-family:inherit;font-size:14px;font-weight:600;padding:10px 20px;cursor:pointer;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg);color:var(--muted);white-space:nowrap;position:relative;top:1px;}
  .maintab.active{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--panel);box-shadow:inset 0 3px 0 var(--blue);}
  .frames{flex:1 1 auto;position:relative;min-height:0;}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none;}
  .frames iframe.active{display:block;}
  #gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
  #gate.hidden{display:none;}
  .gbox{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:320px;max-width:100%;box-shadow:0 4px 16px rgba(0,0,0,.08);text-align:center;}
  .gbox p.t{font-weight:700;font-size:18px;margin:0 0 4px;font-family:Georgia,serif;}
  .gbox p.s{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .gwrap{position:relative;margin-bottom:10px;}
  .gwrap input{width:100%;padding:10px 42px;border:1px solid var(--border);border-radius:10px;font-size:14px;text-align:center;background:var(--bg);color:var(--ink);}
  .gwrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;display:flex;}
  .gsubmit{width:100%;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:600;font-size:14px;cursor:pointer;}
  #gerr{color:var(--red);font-size:12.5px;margin-top:10px;display:none;}
</style>
</head>
<body>
<div id="gate">
  <div class="gbox">
    <p class="t">Perintis Group</p>
    <p class="s">Masukkan password untuk melanjutkan</p>
    <div class="gwrap">
      <input type="password" id="gpw" placeholder="Masukkan password" autofocus>
      <button type="button" id="geye" aria-label="Tampilkan password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="gsubmit" id="gsub">Masuk</button>
    <p id="gerr">Password salah, coba lagi.</p>
  </div>
</div>

<div class="topbar" id="topbar">
  <span class="brand">PT Perintis Perkasa</span>
  <button class="maintab active" data-t="unit">Piutang Unit</button>
  <button class="maintab" data-t="grbp">Piutang GR &amp; BP</button>
  <button class="maintab" id="logout" style="margin-left:auto;top:0;border-radius:8px;border-bottom:1px solid var(--border);margin-bottom:8px;padding:6px 14px;font-weight:500;">Keluar</button>
</div>
<div class="frames">
  <iframe id="f-unit" class="active" title="Piutang Unit"></iframe>
  <iframe id="f-grbp" title="Piutang GR & BP"></iframe>
</div>

<script>
var PAGES = { unit: "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dashboard Piutang \u2014 PT Perintis Perkasa<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --bg: #FFFFFF;\n    --bg-2: #F4F6F8;\n    --panel: #FFFFFF;\n    --panel-2: #F3F5F7;\n    --panel-3: #ECEEF2;\n    --line: #E1E5EA;\n    --line-soft: #EBEDF1;\n    --ink: #171B21;\n    --ink-dim: #5B6472;\n    --ink-faint: #8A93A1;\n\n    --gatsu: #1D4ED8;\n    --gatsu-dim: #1D4ED81A;\n    --flamboyan: #C2410C;\n    --flamboyan-dim: #C2410C1A;\n    --gagak: #0F766E;\n    --gagak-dim: #0F766E1A;\n\n    --b1: #16A34A;\n    --b2: #B45309;\n    --b3: #C2410C;\n    --b4: #DC2626;\n    --b4-bg: #FEF2F2;\n    --accent2: #6D28D9;\n\n    --radius: 10px;\n    --serif: 'Fraunces', serif;\n    --sans: 'Inter', sans-serif;\n    --mono: 'IBM Plex Mono', monospace;\n\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); }\n  * { box-sizing: border-box; }\n  body {\n    margin: 0;\n    background: var(--bg);\n    background-image:\n      radial-gradient(ellipse 900px 500px at 15% -10%, #1D4ED80D, transparent),\n      radial-gradient(ellipse 900px 500px at 100% 0%, #C2410C0A, transparent);\n    color: var(--ink);\n    font-family: var(--sans);\n    font-size: 15px;\n    line-height: 1.5;\n    -webkit-font-smoothing: antialiased;\n  }\n  button, textarea, input, select { font-family: var(--sans); }\n  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 28px 90px; }\n\n  /* ---------- header ---------- */\n  .masthead {\n    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;\n    padding-bottom: 26px; border-bottom: 1px solid var(--line); margin-bottom: 34px;\n  }\n  .masthead .co { font-size: 13px; color: var(--ink-dim); letter-spacing: .01em; margin-bottom: 6px; }\n  .masthead h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }\n  .masthead .meta { text-align: right; font-size: 13px; color: var(--ink-dim); }\n  .masthead .meta b { color: var(--ink); font-weight: 600; }\n\n  /* ---------- hero ---------- */\n  .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; margin-bottom: 30px; }\n  @media (max-width: 780px) { .hero { grid-template-columns: 1fr; } }\n  .hero-total { background: linear-gradient(155deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.05); padding: 28px 30px; position: relative; overflow: hidden; }\n  .hero-total .label { font-size: 13px; color: var(--ink-dim); margin-bottom: 10px; }\n  .hero-total .num { font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 5vw, 46px); letter-spacing: -0.01em; margin: 0 0 4px; }\n  .hero-total .sub { font-size: 13.5px; color: var(--ink-dim); }\n  .hero-total .sub b { color: var(--ink); font-family: var(--mono); font-weight: 500; }\n  .hero-buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n  .bchip { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.05); padding: 14px 16px; position: relative; }\n  .bchip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; }\n  .bchip .name { font-size: 12.5px; color: var(--ink-dim); }\n  .bchip .amt { font-family: var(--mono); font-size: 17px; font-weight: 600; margin-top: 6px; }\n  .bchip .cnt { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }\n  .bchip.crit { background: var(--b4-bg); border-color: #F0555A44; }\n  .bchip.crit .amt { color: var(--b4); }\n  .bchip { cursor: pointer; transition: box-shadow .12s, transform .12s; }\n  .bchip:hover { box-shadow: 0 3px 10px rgba(16,24,40,.09); }\n  .bchip.active { border-color: var(--accent2); box-shadow: 0 0 0 2px var(--accent2)33; }\n\n  .bucket-detail-panel { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.05); margin-top: 4px; overflow: hidden; }\n  .bucket-detail-panel.hidden { display: none; }\n  .bdp-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink); }\n  .bdp-head button { background: none; border: none; color: var(--ink-faint); font-size: 15px; cursor: pointer; padding: 2px 6px; }\n  .bdp-head button:hover { color: var(--ink); }\n  #bdpBody { max-height: 340px; overflow-y: auto; }\n  table.bdp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }\n  table.bdp-table th { text-align: left; font-weight: 500; color: var(--ink-faint); padding: 8px 18px; font-size: 10.5px; background: var(--panel-2); border-bottom: 1px solid var(--line); position: sticky; top: 0; }\n  table.bdp-table td { padding: 8px 18px; border-bottom: 1px solid var(--line-soft); }\n  table.bdp-table tr:last-child td { border-bottom: none; }\n  table.bdp-table tr:hover td { background: var(--panel-2); }\n  table.bdp-table td.bdp-num { text-align: right; font-family: var(--mono); }\n  .bdp-empty { padding: 24px 18px; color: var(--ink-faint); font-size: 13px; text-align: center; }\n  table.bdp-table th.bdp-sortable { cursor: pointer; user-select: none; }\n  table.bdp-table th.bdp-sortable:hover { color: var(--ink); }\n  table.bdp-table th .sort-arrow { font-size: 9px; margin-left: 3px; color: var(--accent2); }\n\n  /* ---------- section title ---------- */\n  .stitle { display: flex; align-items: baseline; justify-content: space-between; margin: 40px 0 16px; flex-wrap: wrap; gap: 8px; }\n  .stitle h2 { font-family: var(--serif); font-weight: 500; font-size: 21px; margin: 0; }\n  .stitle span { font-size: 12.5px; color: var(--ink-faint); font-family: var(--mono); }\n\n  /* ---------- branch cards ---------- */\n  .branches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n  @media (max-width: 900px) { .branches { grid-template-columns: 1fr; } }\n  .bcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.05); padding: 20px; border-top: 3px solid var(--accent); }\n  .bcard .bname { font-family: var(--serif); font-size: 18px; font-weight: 500; margin-bottom: 2px; }\n  .bcard .baddr { font-size: 12px; color: var(--ink-faint); margin-bottom: 16px; }\n  .bcard .btotal { font-family: var(--mono); font-size: 24px; font-weight: 600; }\n  .bcard .bcount { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 16px; }\n  .bcard .barrow { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-soft); margin-bottom: 10px; }\n  .bcard .barrow div { height: 100%; }\n  .bcard .blegend { display: flex; flex-direction: column; gap: 6px; }\n  .blegend .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); }\n  .blegend .row .k { display: flex; align-items: center; gap: 6px; }\n  .blegend .row .k .sq { width: 7px; height: 7px; border-radius: 2px; }\n  .blegend .row .v { font-family: var(--mono); color: var(--ink); }\n  .blegend .row.empty { opacity: .35; }\n\n  /* ---------- priority table ---------- */\n  .priowrap { background: var(--panel); border: 1px solid #F0555A3D; border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 3px rgba(16,24,40,.05); }\n\n  /* leasing table */\n  .leasingwrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.05); overflow: hidden; }\n  table.leasing-table { width: 100%; border-collapse: collapse; font-size: 13px; }\n  table.leasing-table thead th { text-align: left; font-weight: 500; color: var(--ink-faint); padding: 10px 16px; font-size: 11.5px; border-bottom: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }\n  table.leasing-table tbody td { padding: 11px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }\n  table.leasing-table tbody tr:last-child td { border-bottom: none; }\n  table.leasing-table tbody tr:hover { background: var(--panel-2); }\n  .leasing-name { font-weight: 600; }\n  .leasing-name .tag { font-size: 10.5px; font-weight: 500; color: var(--ink-faint); margin-left: 6px; }\n  .leasing-bar-cell { min-width: 140px; }\n  .leasing-bar { height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }\n  .leasing-bar div { height: 100%; background: var(--accent2); border-radius: 4px; }\n  table.leasing-table th.lcol.gatsu { color: var(--gatsu); }\n  table.leasing-table th.lcol.flamboyan { color: var(--flamboyan); }\n  table.leasing-table th.lcol.gagak { color: var(--gagak); }\n  table.leasing-table td.lcell { text-align: center; font-family: var(--mono); font-size: 12.5px; }\n  table.leasing-table td.lcell.zero { color: var(--ink-faint); }\n  table.leasing-table td.lcell .lcount { display: block; font-size: 10.5px; color: var(--ink-faint); font-family: var(--sans); margin-top: 1px; }\n  table.leasing-table tfoot td { padding: 11px 16px; font-weight: 700; border-top: 2px solid var(--line); background: var(--panel-2); }\n\n  /* tabs */\n  .tabbar { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }\n  .tabbtn { background: none; border: none; color: var(--ink-faint); font-size: 13.5px; font-weight: 600; padding: 9px 4px; margin-right: 18px; cursor: pointer; border-bottom: 2px solid transparent; font-family: var(--sans); }\n  .tabbtn:hover { color: var(--ink-dim); }\n  .tabbtn.active { color: var(--ink); border-bottom-color: var(--accent2); }\n  .tabpane.hidden { display: none; }\n  #priorityBlock.hidden { display: none; }\n  #generalTasksBlock.hidden { display: none; }\n\n  /* per-division detail tables */\n  .division-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n  @media (max-width: 900px) { .division-grid { grid-template-columns: 1fr; } }\n  .division-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.05); overflow: hidden; border-top: 3px solid var(--accent); }\n  .division-card .dhead { padding: 16px 18px 12px; }\n  .division-card .dname { font-family: var(--serif); font-size: 17px; font-weight: 500; }\n  .division-card .dtotal { font-family: var(--mono); font-size: 15px; font-weight: 600; margin-top: 2px; }\n  .division-card .dcount { font-size: 11.5px; color: var(--ink-faint); }\n  table.division-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }\n  table.division-table th { text-align: left; font-weight: 500; color: var(--ink-faint); padding: 8px 14px; font-size: 10.5px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel-2); }\n  table.division-table td { padding: 8px 14px; border-bottom: 1px solid var(--line-soft); }\n  table.division-table tr:last-child td { border-bottom: none; }\n  table.division-table tr.dtotal-row td { font-weight: 700; border-top: 1px solid var(--line); background: var(--panel-2); }\n  table.division-table td.dnum { text-align: right; font-family: var(--mono); }\n  table.division-table td.zero { color: var(--ink-faint); }\n  tr.dlrow.clickable { cursor: pointer; }\n  tr.dlrow.clickable:hover { background: var(--panel-2); }\n  tr.dlrow .dexp \">\u2b73 Export Excel<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"rincianWrap\"><\/div>\n  <\/div>\n\n  <div class=\"tabpane hidden\" id=\"tab-followup\">\n    <div class=\"fu-toolbar-head\">\n      <h2>Followup Penagihan ke Leasing<\/h2>\n      <span class=\"fu-hint\">klik header kolom untuk urutkan<\/span>\n    <\/div>\n    <div class=\"fu-toolbar\">\n      <input type=\"text\" id=\"fuSearch\" placeholder=\"Cari nama customer, faktur, atau salesman\u2026\">\n      <select id=\"fuLeasingFilter\"><option value=\"\">Semua leasing<\/option><\/select>\n      <select id=\"fuCabangFilter\"><option value=\"\">Semua cabang<\/option><\/select>\n      <div class=\"fu-status-tabs\" id=\"fuStatusTabs\">\n        <button class=\"active\" data-status=\"all\">Semua<\/button>\n        <button data-status=\"belum\">Belum tagih<\/button>\n        <button data-status=\"sudah\">Sudah tagih<\/button>\n      <\/div>\n      <div class=\"dp-export\">\n        <button id=\"fuExportPdf\" class=\"dp-export-btn\">\u2b73 Export PDF<\/button>\n        <button id=\"fuExportExcel\" class=\"dp-export-btn\">\u2b73 Export Excel<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"fu-table-wrap\">\n      <table class=\"fu-table\" id=\"fuTable\">\n        <thead>\n          <tr>\n            <th style=\"text-align:right\">No<\/th>\n            <th data-key=\"nama\">Nama Customer<\/th>\n            <th data-key=\"tglJto\">Tgl JTO<\/th>\n            <th data-key=\"leasing\">Leasing<\/th>\n            <th data-key=\"divisi\">Cabang<\/th>\n            <th data-key=\"jumlah\" style=\"text-align:right\">Jumlah<\/th>\n            <th data-key=\"tglBuatTagihan\">Tgl Buat Tagihan<\/th>\n            <th data-key=\"hari\" style=\"text-align:right\">Hari<\/th>\n            <th data-key=\"salesman\">Salesman<\/th>\n            <th data-key=\"supervisor\">Supervisor<\/th>\n            <th data-key=\"faktur\">Faktur No.<\/th>\n            <th data-key=\"tglBarcode\">Tgl Barcode<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"fuBody\"><\/tbody>\n      <\/table>\n    <\/div>\n    <div class=\"fu-count\" id=\"fuCount\"><\/div>\n  <\/div>\n\n  <!-- PRIORITY -->\n  <div id=\"priorityBlock\">\n    <div class=\"stitle\"><h2>Prioritas Penagihan<\/h2><span>faktur dengan umur &gt; 26 hari \u00b7 klik baris untuk catatan &amp; tugas<\/span><\/div>\n    <div class=\"priowrap\">\n      <div class=\"prio-head\">\n        <div class=\"t\"><span class=\"flag\"><\/span><h2 id=\"prioHeadCount\">4 faktur butuh tindak lanjut segera<\/h2><\/div>\n        <div class=\"sum\" id=\"prioHeadSum\">total tertunggak <b>Rp 1.870.500.000<\/b> &nbsp;\u00b7&nbsp; 2 debitur<\/div>\n    <\/div>\n    <table class=\"prio\">\n      <thead>\n        <tr>\n          <th><\/th><th>No<\/th><th>Debitur<\/th><th>No. Faktur<\/th><th>Cabang<\/th><th>Metode<\/th>\n          <th>Jumlah<\/th><th>Tgl. Jatuh Tempo<\/th><th>Umur<\/th><th>Sales PIC<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody id=\"prioBody\"><\/tbody>\n    <\/table>\n    <\/div>\n  <\/div>\n\n  <!-- GENERAL TASKS -->\n  <div id=\"generalTasksBlock\">\n    <div class=\"stitle\"><h2>Tugas Tim Penagihan<\/h2><span>tidak terikat faktur tertentu<\/span><\/div>\n    <div class=\"taskpanel\">\n      <div class=\"taskpanel-head\">\n        <div class=\"tp-filters\" id=\"tpFilters\">\n          <button data-f=\"all\" class=\"active\">Semua<\/button>\n          <button data-f=\"todo\">Belum selesai<\/button>\n          <button data-f=\"done\">Selesai<\/button>\n        <\/div>\n      <\/div>\n      <form class=\"gtask-form\" id=\"gtaskForm\">\n        <input class=\"gtitle\" type=\"text\" placeholder=\"Tugas baru\u2026 (mis. rekap ulang aging mingguan)\" required>\n        <input class=\"gassignee\" type=\"text\" placeholder=\"PIC (opsional)\">\n        <button type=\"submit\">+ Tambah<\/button>\n      <\/form>\n      <div class=\"gtask-list\" id=\"gtaskList\"><div class=\"task-empty\">Memuat tugas\u2026<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <footer>\n    <span>Dibuat dari \"PP Laporan Piutang Per Nama 2026.xlsx\" (Google Sheets) \u2014 tombol Refresh menarik data dari tab Sheet1 yang di-publish ke web; catatan &amp; tugas tersimpan di browser perangkat ini saja (tidak sinkron antar-perangkat/tim).<\/span>\n    <span>Gatsu \u00b7 Flamboyan \u00b7 Gagak Hitam<\/span>\n  <\/footer>\n<\/div>\n\n<script>\n(function(){\n  const fmtRp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');\n  const slug = s => String(s).replace(/[^A-Za-z0-9_\\-.~:@+]/g, '-').slice(0,150);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n  /* ---------------- static report data ---------------- */\n  const branches = [\n    { key:'gatsu', name:'Gatsu', addr:'Jl. Gatot Subroto', color:'var(--gatsu)', total:7566545234, count:26,\n      buckets:[ {label:'1\u20137 hari',count:15,sum:4087999674,color:'var(--b1)'}, {label:'8\u201314 hari',count:7,sum:2101559100,color:'var(--b2)'},\n                {label:'15\u201326 hari',count:2,sum:431086460,color:'var(--b3)'}, {label:'> 26 hari',count:2,sum:945900000,color:'var(--b4)'} ] },\n    { key:'flamboyan', name:'Flamboyan', addr:'Jl. Flamboyan Raya', color:'var(--flamboyan)', total:5615689997, count:18,\n      buckets:[ {label:'1\u20137 hari',count:10,sum:3281090000,color:'var(--b1)'}, {label:'8\u201314 hari',count:4,sum:1087799997,color:'var(--b2)'},\n                {label:'15\u201326 hari',count:2,sum:322200000,color:'var(--b3)'}, {label:'> 26 hari',count:2,sum:924600000,color:'var(--b4)'} ] },\n    { key:'gagak', name:'Gagak Hitam', addr:'Jl. Gagak Hitam', color:'var(--gagak)', total:9758658992, count:41,\n      buckets:[ {label:'1\u20137 hari',count:30,sum:7088408467,color:'var(--b1)'}, {label:'8\u201314 hari',count:10,sum:2413450525,color:'var(--b2)'},\n                {label:'15\u201326 hari',count:1,sum:256800000,color:'var(--b3)'}, {label:'> 26 hari',count:0,sum:0,color:'var(--b4)'} ] },\n  ];\n\n  const priority = [\n    { name:'PT.GO RENTAL', id:'A0010662GOR', faktur:'000007/FKT/PP/0826', cabang:'gatsu', cabangLabel:'Gatsu', metode:'Tunai', jumlah:472950000, jto:'03 Agu 2026', hari:54, sales:'SALINDO DOMINGGOS R.' },\n    { name:'PT.GO RENTAL', id:'A0010662GOR', faktur:'000026/FKT/PP/0826', cabang:'gatsu', cabangLabel:'Gatsu', metode:'Tunai', jumlah:472950000, jto:'06 Agu 2026', hari:51, sales:'SALINDO DOMINGGOS R.' },\n    { name:'PT SUTAN INDO ANEKA MOBIL', id:'F0007224SIA', faktur:'000055/FKT/PP/0826', cabang:'flamboyan', cabangLabel:'Flamboyan', metode:'Tunai', jumlah:446600000, jto:'11 Agu 2026', hari:46, sales:'SHINTIA PRIYANTI' },\n    { name:'PT SUTAN INDO ANEKA MOBIL', id:'F0007224SIA', faktur:'000075/FKT/PP/0826', cabang:'flamboyan', cabangLabel:'Flamboyan', metode:'Tunai', jumlah:478000000, jto:'13 Agu 2026', hari:44, sales:'SHINTIA PRIYANTI' },\n  ].sort((a,b) => b.hari - a.hari);\n\n  const leasingBreakdown = [\n    { name:'TAF', count:32, sum:6664074830, byBranch:{ gatsu:{count:11,sum:2053468900}, flamboyan:{count:3,sum:638340000}, gagak:{count:18,sum:3972265930} } },\n    { name:'ACC', count:26, sum:6634219997, byBranch:{ gatsu:{count:5,sum:1531830000}, flamboyan:{count:7,sum:1524749997}, gagak:{count:14,sum:3577640000} } },\n    { name:'Cash', count:9, sum:3221600000, byBranch:{ gatsu:{count:2,sum:945900000}, flamboyan:{count:6,sum:2032500000}, gagak:{count:1,sum:243200000} } },\n    { name:'KKB', count:7, sum:2609849636, byBranch:{ gatsu:{count:6,sum:2393725474}, gagak:{count:1,sum:216124162} } },\n    { name:'ADM', count:1, sum:1262600000, byBranch:{ flamboyan:{count:1,sum:1262600000} } },\n    { name:'MTF', count:4, sum:974359900, byBranch:{ gagak:{count:4,sum:974359900} } },\n    { name:'BUANA', count:2, sum:737339000, byBranch:{ gatsu:{count:1,sum:404599000}, gagak:{count:1,sum:332740000} } },\n    { name:'MUF', count:2, sum:442329000, byBranch:{ gagak:{count:2,sum:442329000} } },\n    { name:'BRIM', count:1, sum:237021860, byBranch:{ gatsu:{count:1,sum:237021860} } },\n    { name:'IMFS', count:1, sum:157500000, byBranch:{ flamboyan:{count:1,sum:157500000} } },\n  ].map(l => ({ ...l, pct: l.sum / 22940894223 })).sort((a,b) => b.sum - a.sum);\n\n  /* ---------------- dynamic aggregation engine (shared by initial render & refresh) ---------------- */\n  const BRANCH_META = {\n    'Gatsu': { key:'gatsu', addr:'Jl. Gatot Subroto', color:'var(--gatsu)' },\n    'Flamboyan': { key:'flamboyan', addr:'Jl. Flamboyan Raya', color:'var(--flamboyan)' },\n    'Gagak Hitam': { key:'gagak', addr:'Jl. Gagak Hitam', color:'var(--gagak)' },\n  };\n  const BRANCH_ORDER = ['Gatsu','Flamboyan','Gagak Hitam'];\n  const BUCKET_DEFS = [\n    { label:'1\u20137 hari', color:'var(--b1)', test: h => h<=7 },\n    { label:'8\u201314 hari', color:'var(--b2)', test: h => h>7 && h<=14 },\n    { label:'15\u201326 hari', color:'var(--b3)', test: h => h>14 && h<=26 },\n    { label:'> 26 hari', color:'var(--b4)', test: h => h>26 },\n  ];\n  const MONTHS_ID_LONG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];\n  const MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];\n  function fmtTglShort(d) { return `${String(d.getDate()).padStart(2,'0')} ${MONTHS_ID[d.getMonth()]} ${d.getFullYear()}`; }\n  function fmtTglLong(d) { return `${d.getDate()} ${MONTHS_ID_LONG[d.getMonth()]} ${d.getFullYear()}`; }\n  function fmtTimeShort(d) { return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }\n  function fmtShortRp(n) {\n    if (n >= 1e9) return 'Rp ' + (n/1e9).toFixed(2).replace('.', ',') + ' M';\n    if (n >= 1e6) return 'Rp ' + Math.round(n/1e6).toLocaleString('id-ID') + ' Jt';\n    return fmtRp(n);\n  }\n  function cleanSalesmanFull(s) {\n    if (!s) return '-';\n    const parts = String(s).split('=');\n    return parts.length > 1 ? parts[1].trim() : parts[0].trim();\n  }\n\n  function computeAggregates(rows) {\n    const branchesOut = BRANCH_ORDER.map(name => {\n      const meta = BRANCH_META[name] || { key: slug(name).toLowerCase(), addr:'', color:'var(--gatsu)' };\n      const sub = rows.filter(r => r.divisi === name);\n      const total = sub.reduce((s,r) => s + r.jumlah, 0);\n      const bks = BUCKET_DEFS.map(bd => {\n        const list = sub.filter(r => bd.test(r.hari));\n        return { label: bd.label, color: bd.color, count: list.length, sum: list.reduce((s,r) => s + r.jumlah, 0) };\n      });\n      return { key: meta.key, name, addr: meta.addr, color: meta.color, total, count: sub.length, buckets: bks };\n    });\n\n    const priorityOut = rows.filter(r => r.hari > 26).sort((a,b) => b.hari - a.hari).map(r => ({\n      name: r.nama, id: r.noCust, faktur: r.faktur,\n      cabang: (BRANCH_META[r.divisi] || {}).key || 'gatsu', cabangLabel: r.divisi || '-',\n      metode: r.cara, jumlah: r.jumlah, jto: r.tglJtoDisplay || '-', hari: r.hari,\n      sales: cleanSalesmanFull(r.salesman),\n    }));\n\n    const totalAll = rows.reduce((s,r) => s + r.jumlah, 0);\n    const overallBuckets = BUCKET_DEFS.map(bd => {\n      const list = rows.filter(r => bd.test(r.hari));\n      return { label: bd.label, count: list.length, sum: list.reduce((s,r) => s + r.jumlah, 0) };\n    });\n\n    const leasingMap = {};\n    rows.forEach(r => {\n      const key = (r.cara === 'Tunai' || !r.leasing) ? 'Cash' : r.leasing;\n      if (!leasingMap[key]) leasingMap[key] = { name: key, count: 0, sum: 0, byBranch: {} };\n      leasingMap[key].count += 1;\n      leasingMap[key].sum += r.jumlah;\n      const bkey = (BRANCH_META[r.divisi] || {}).key || 'gatsu';\n      if (!leasingMap[key].byBranch[bkey]) leasingMap[key].byBranch[bkey] = { count: 0, sum: 0, invoices: [] };\n      leasingMap[key].byBranch[bkey].count += 1;\n      leasingMap[key].byBranch[bkey].sum += r.jumlah;\n      leasingMap[key].byBranch[bkey].invoices.push({\n        faktur: r.faktur, nama: r.nama, jumlah: r.jumlah, hari: r.hari, jto: r.tglJtoDisplay || '-',\n      });\n    });\n    const leasingBreakdown = Object.values(leasingMap)\n      .map(l => ({ ...l, pct: totalAll ? (l.sum / totalAll) : 0 }))\n      .sort((a,b) => b.sum - a.sum);\n\n    return { branches: branchesOut, priority: priorityOut, totalAll, count: rows.length, overallBuckets, leasingBreakdown, allRows: rows };\n  }\n\n  /* ---------------- render branch cards ---------------- */\n  const grid = document.getElementById('branchGrid');\n  function renderBranchCards(list) {\n    grid.innerHTML = '';\n    list.forEach(b => {\n      const card = document.createElement('div');\n      card.className = 'bcard';\n      card.style.setProperty('--accent', b.color);\n      const barSegs = b.buckets.map(bk => { const pct = b.total ? (bk.sum/b.total*100) : 0; return pct>0 ? `<div style=\"width:${pct}%; background:${bk.color}\"><\/div>` : ''; }).join('');\n      const legend = b.buckets.map(bk => `<div class=\"row ${bk.count===0?'empty':''}\"><span class=\"k\"><span class=\"sq\" style=\"background:${bk.color}\"><\/span>${bk.label}<\/span><span class=\"v\">${bk.count} \u00b7 ${fmtRp(bk.sum)}<\/span><\/div>`).join('');\n      card.innerHTML = `<div class=\"bname\">${b.name}<\/div><div class=\"baddr\">${b.addr}<\/div><div class=\"btotal\">${fmtRp(b.total)}<\/div>\n        <div class=\"bcount\">${b.count} faktur tertunggak<\/div><div class=\"barrow\">${barSegs}<\/div><div class=\"blegend\">${legend}<\/div>`;\n      grid.appendChild(card);\n    });\n  }\n\n  /* ---------------- render leasing table (matrix: leasing x cabang) ---------------- */\n  const leasingBody = document.getElementById('leasingBody');\n  const leasingFoot = document.getElementById('leasingFoot');\n  const BRANCH_KEYS = ['gatsu', 'flamboyan', 'gagak'];\n\n  function renderLeasingTable(list) {\n    leasingBody.innerHTML = '';\n    list.forEach((l, li) => {\n      const tr = document.createElement('tr');\n      const isCash = l.name === 'Cash';\n      const branchCells = BRANCH_KEYS.map(bk => {\n        const b = l.byBranch[bk];\n        if (!b || !b.sum) return `<td class=\"lcell zero\">\u2013<\/td>`;\n        return `<td class=\"lcell\">${fmtRp(b.sum)}<span class=\"lcount\">${b.count} faktur<\/span><\/td>`;\n      }).join('');\n      const rid = `lr-${li}`;\n      tr.className = 'dlrow clickable';\n      tr.dataset.detail = rid;\n      tr.innerHTML = `\n        <td style=\"text-align:right\">${li + 1}<\/td>\n        <td><span class=\"dexp\">\u25b8<\/span><span class=\"leasing-name\">${isCash ? 'Cash (Tunai)' : esc(l.name)}<\/span><\/td>\n        ${branchCells}\n        <td style=\"text-align:center\">${l.count}<\/td>\n        <td class=\"jumlah-mono\">${fmtRp(l.sum)}<\/td>\n        <td>${(l.pct*100).toFixed(1)}%<\/td>`;\n      leasingBody.appendChild(tr);\n\n      const allInvoices = [];\n      BRANCH_KEYS.forEach(bk => {\n        const b = l.byBranch[bk];\n        if (b && b.invoices) b.invoices.forEach(inv => allInvoices.push({ ...inv, cabang: BRANCH_DISPLAY[bk].label }));\n      });\n      allInvoices.sort((a, b) => b.hari - a.hari);\n      const detailRows = allInvoices.map((inv, ii) => `\n        <tr>\n          <td style=\"text-align:right\">${ii + 1}<\/td>\n          <td>${esc(inv.cabang)}<\/td>\n          <td>${esc(inv.nama)}<\/td>\n          <td class=\"jumlah-mono\">${esc(inv.faktur)}<\/td>\n          <td class=\"dnum\">${fmtRp(inv.jumlah)}<\/td>\n          <td class=\"dnum\">${inv.hari} hr<\/td>\n        <\/tr>`).join('');\n      const detailTr = document.createElement('tr');\n      detailTr.className = 'ddetail hidden';\n      detailTr.dataset.detailrow = rid;\n      detailTr.innerHTML = `<td colspan=\"8\">\n        <table class=\"detail-sub-table\">\n          <thead><tr><th style=\"text-align:right\">No<\/th><th>Cabang<\/th><th>Debitur<\/th><th>Faktur<\/th><th style=\"text-align:right\">Nominal<\/th><th style=\"text-align:right\">Hari<\/th><\/tr><\/thead>\n          <tbody>${detailRows || '<tr><td colspan=\"6\" style=\"padding-left:14px;color:var(--ink-faint)\">Tidak ada faktur<\/td><\/tr>'}<\/tbody>\n        <\/table>\n      <\/td>`;\n      leasingBody.appendChild(detailTr);\n    });\n\n    leasingBody.querySelectorAll('tr.dlrow.clickable').forEach(tr => {\n      tr.addEventListener('click', () => {\n        const rid = tr.dataset.detail;\n        const detailTr = leasingBody.querySelector(`tr.ddetail[data-detailrow=\"${rid}\"]`);\n        const exp = tr.querySelector('.dexp');\n        const willOpen = detailTr.classList.contains('hidden');\n        detailTr.classList.toggle('hidden');\n        if (exp) exp.textContent = willOpen ? '\u25be' : '\u25b8';\n      });\n    });\n\n    // footer totals per column\n    const totals = { gatsu: {c:0,s:0}, flamboyan: {c:0,s:0}, gagak: {c:0,s:0} };\n    let totCount = 0, totSum = 0;\n    list.forEach(l => {\n      totCount += l.count; totSum += l.sum;\n      BRANCH_KEYS.forEach(bk => {\n        const b = l.byBranch[bk];\n        if (b) { totals[bk].c += b.count; totals[bk].s += b.sum; }\n      });\n    });\n    const footBranchCells = BRANCH_KEYS.map(bk => `<td style=\"text-align:center; font-family:var(--mono)\">${fmtRp(totals[bk].s)}<\/td>`).join('');\n    leasingFoot.innerHTML = `<tr>\n      <td><\/td>\n      <td>Total<\/td>\n      ${footBranchCells}\n      <td style=\"text-align:center\">${totCount}<\/td>\n      <td class=\"jumlah-mono\">${fmtRp(totSum)}<\/td>\n      <td>100.0%<\/td>\n    <\/tr>`;\n  }\n\n  /* ---------------- render \"Leasing per Divisi\" tab: 3 cards, one per branch ---------------- */\n  const divisionGrid = document.getElementById('divisionGrid');\n  const BRANCH_DISPLAY = {\n    gatsu: { label: 'Gatsu', color: 'var(--gatsu)' },\n    flamboyan: { label: 'Flamboyan', color: 'var(--flamboyan)' },\n    gagak: { label: 'Gagak Hitam', color: 'var(--gagak)' },\n  };\n\n  function renderDivisionCards(leasingList, branchTotals) {\n    divisionGrid.innerHTML = '';\n    BRANCH_KEYS.forEach((bk, bidx) => {\n      const meta = BRANCH_DISPLAY[bk];\n      const bt = branchTotals[bk] || { count: 0, sum: 0 };\n      const card = document.createElement('div');\n      card.className = 'division-card';\n      card.style.setProperty('--accent', meta.color);\n      card.dataset.no = bidx + 1;\n\n      const rowsHtml = leasingList.map((l, li) => {\n        const b = l.byBranch[bk];\n        const count = b ? b.count : 0;\n        const sum = b ? b.sum : 0;\n        const pct = bt.sum ? (sum / bt.sum * 100) : 0;\n        const rid = `${bk}-${li}`;\n        const invoices = (b && b.invoices) || [];\n        const detailRows = invoices.slice().sort((a,c) => c.hari - a.hari).map((inv, ii) => `\n          <tr>\n            <td style=\"text-align:right\">${ii + 1}<\/td>\n            <td>${esc(inv.nama)}<\/td>\n            <td class=\"jumlah-mono\">${esc(inv.faktur)}<\/td>\n            <td class=\"dnum\">${fmtRp(inv.jumlah)}<\/td>\n            <td class=\"dnum\">${inv.hari} hr<\/td>\n          <\/tr>`).join('');\n        const mainRow = `<tr class=\"dlrow ${count ? 'clickable' : ''}\" data-detail=\"${rid}\">\n          <td style=\"text-align:right\">${li + 1}<\/td>\n          <td>${count ? '<span class=\"dexp\">\u25b8<\/span>' : ''}${l.name === 'Cash' ? 'Cash (Tunai)' : esc(l.name)}<\/td>\n          <td class=\"dnum ${!count?'zero':''}\">${count || '\u2013'}<\/td>\n          <td class=\"dnum ${!sum?'zero':''}\">${sum ? fmtRp(sum) : '\u2013'}<\/td>\n          <td class=\"dnum ${!sum?'zero':''}\">${sum ? pct.toFixed(1)+'%' : '\u2013'}<\/td>\n        <\/tr>`;\n        const detailRow = count ? `<tr class=\"ddetail hidden\" data-detailrow=\"${rid}\">\n          <td colspan=\"5\">\n            <table class=\"detail-sub-table\">\n              <thead><tr><th style=\"text-align:right\">No<\/th><th>Debitur<\/th><th>Faktur<\/th><th style=\"text-align:right\">Nominal<\/th><th style=\"text-align:right\">Hari<\/th><\/tr><\/thead>\n              <tbody>${detailRows}<\/tbody>\n            <\/table>\n          <\/td>\n        <\/tr>` : '';\n        return mainRow + detailRow;\n      }).join('');\n\n      card.innerHTML = `\n        <div class=\"dhead\">\n          <div class=\"dname\">${meta.label}<\/div>\n          <div class=\"dtotal\">${fmtRp(bt.sum)}<\/div>\n          <div class=\"dcount\">${bt.count} faktur<\/div>\n        <\/div>\n        <table class=\"division-table\">\n          <thead><tr><th style=\"text-align:right\">No<\/th><th>Leasing<\/th><th style=\"text-align:right\">Faktur<\/th><th style=\"text-align:right\">Nilai<\/th><th style=\"text-align:right\">%<\/th><\/tr><\/thead>\n          <tbody>${rowsHtml}\n            <tr class=\"dtotal-row\"><td><\/td><td>Total<\/td><td class=\"dnum\">${bt.count}<\/td><td class=\"dnum\">${fmtRp(bt.sum)}<\/td><td class=\"dnum\">100.0%<\/td><\/tr>\n          <\/tbody>\n        <\/table>`;\n      card.querySelectorAll('tr.dlrow.clickable').forEach(tr => {\n        tr.addEventListener('click', () => {\n          const rid = tr.dataset.detail;\n          const detailTr = card.querySelector(`tr.ddetail[data-detailrow=\"${rid}\"]`);\n          const exp = tr.querySelector('.dexp');\n          const willOpen = detailTr.classList.contains('hidden');\n          detailTr.classList.toggle('hidden');\n          if (exp) exp.textContent = willOpen ? '\u25be' : '\u25b8';\n        });\n      });\n      divisionGrid.appendChild(card);\n    });\n  }\n\n  function computeBranchTotalsFromLeasing(leasingList) {\n    const totals = { gatsu: {count:0,sum:0}, flamboyan: {count:0,sum:0}, gagak: {count:0,sum:0} };\n    leasingList.forEach(l => {\n      BRANCH_KEYS.forEach(bk => {\n        const b = l.byBranch[bk];\n        if (b) { totals[bk].count += b.count; totals[bk].sum += b.sum; }\n      });\n    });\n    return totals;\n  }\n\n  /* ---------------- render \"Penjualan per Divisi\" tab (tahun berjalan, live dari sheet \"Data\") ---------------- */\n  let penjualanData = [\n    { key:'gatsu', name:'Gatsu', color:'var(--gatsu)', unit:1023 },\n    { key:'flamboyan', name:'Flamboyan', color:'var(--flamboyan)', unit:504 },\n    { key:'gagak', name:'Gagak Hitam', color:'var(--gagak)', unit:539 },\n  ];\n  let PENJUALAN_ASOF = 'Jan \u2013 Sep 2026 (tahun berjalan)';\n\n  let MONTH_LABELS = ['Jan 26','Feb 26','Mar 26','Apr 26','Mei 26','Jun 26','Jul 26','Agu 26','Sep 26'];\n\n  let monthlyByDivision = {\n    gatsu: [111,124,126,142,106,111,113,110,80],\n    flamboyan: [46,57,63,79,55,58,53,47,46],\n    gagak: [47,53,50,68,36,47,50,97,91],\n  };\n\n  let salesLeasingCurrentMonth = {\n    gatsu: [ {name:'TAF',unit:23},{name:'ACC',unit:19},{name:'Cash (Tunai)',unit:17},{name:'KKB',unit:10},{name:'BRIM',unit:4},{name:'BUANA',unit:4},{name:'MYIF',unit:2},{name:'MTF',unit:1} ],\n    flamboyan: [ {name:'ACC',unit:14},{name:'Cash (Tunai)',unit:13},{name:'TAF',unit:13},{name:'BRIM',unit:2},{name:'IMFS',unit:1},{name:'BSI',unit:1},{name:'BUANA',unit:1},{name:'ADM',unit:1} ],\n    gagak: [ {name:'TAF',unit:37},{name:'ACC',unit:27},{name:'Cash (Tunai)',unit:12},{name:'MTF',unit:6},{name:'MUF',unit:4},{name:'BUANA',unit:2},{name:'MYIF',unit:1},{name:'BCAF',unit:1},{name:'KKB',unit:1} ],\n  };\n  let LEASING_MONTH_LABEL = 'September 2026';\n\n  let salesInsuranceCurrentMonth = { gatsu: [], flamboyan: [], gagak: [] };\n  let salesSupervisorCurrentMonth = { gatsu: [], flamboyan: [], gagak: [] };\n  let monthWindow = [{ key: 'cur', shortLabel: 'Sep 26', longLabel: 'September 2026' }];\n  let monthlyCategoryData = {\n    leasing: { gatsu: { cur: [] }, flamboyan: { cur: [] }, gagak: { cur: [] } },\n    insurance: { gatsu: { cur: [] }, flamboyan: { cur: [] }, gagak: { cur: [] } },\n    supervisor: { gatsu: { cur: [] }, flamboyan: { cur: [] }, gagak: { cur: [] } },\n  };\n  let dpRange = 1;\n  let dpSelectedMonth = 'all';\n  let allSalesRows = [];\n\n  function renderPenjualanPerDivisi() {\n    const grid = document.getElementById('penjualanGrid');\n    const totalUnit = penjualanData.reduce((s,d) => s + d.unit, 0);\n    const maxUnit = Math.max(...penjualanData.map(d => d.unit), 1);\n    grid.innerHTML = penjualanData.map(d => {\n      const pct = totalUnit ? (d.unit / totalUnit * 100) : 0;\n      return `<div class=\"pj-card\" style=\"--accent:${d.color}\">\n        <div class=\"pj-name\">${esc(d.name)}<\/div>\n        <div class=\"pj-unit\">${d.unit.toLocaleString('id-ID')}<\/div>\n        <div class=\"pj-label\">unit terjual<\/div>\n        <div class=\"pj-bar\"><div style=\"width:${(d.unit/maxUnit*100)}%\"><\/div><\/div>\n        <div class=\"pj-pct\">${pct.toFixed(1)}% dari total<\/div>\n      <\/div>`;\n    }).join('') + `<div class=\"pj-total-row\"><span class=\"lbl\">Total unit terjual (3 cabang)<\/span><span class=\"val\">${totalUnit.toLocaleString('id-ID')} unit<\/span><\/div>`;\n    document.getElementById('penjualanNote').textContent = `Tahun berjalan \u00b7 ${PENJUALAN_ASOF} \u00b7 data historis, tidak terkait piutang berjalan`;\n    document.getElementById('leasingMonthLabel').textContent = LEASING_MONTH_LABEL;\n\n    renderMonthChartStack();\n    renderSalesLeasingGrid();\n  }\n\n  function renderMonthChartStack() {\n    const stack = document.getElementById('monthChartStack');\n    stack.innerHTML = penjualanData.map(d => {\n      const series = monthlyByDivision[d.key];\n      const maxUnit = Math.max(...series, 1);\n      const bars = series.map((u, i) => {\n        const isYearStart = MONTH_LABELS[i].startsWith('Jan');\n        const h = (u / maxUnit * 100);\n        return `<div class=\"month-bar ${isYearStart?'yearstart':''}\" title=\"${esc(MONTH_LABELS[i])}: ${u} unit\" style=\"--accent:${d.color}\">\n          <div class=\"mval\">${u}<\/div>\n          <div class=\"bar\" style=\"height:${h}%; background:${d.color}\"><\/div>\n          <div class=\"mlabel\">${esc(MONTH_LABELS[i])}<\/div>\n        <\/div>`;\n      }).join('');\n      return `<div class=\"mc-block\" style=\"--accent:${d.color}\">\n        <div class=\"mc-head\"><span class=\"mc-name\">${esc(d.name)}<\/span><span class=\"mc-total\">total ${d.unit.toLocaleString('id-ID')} unit<\/span><\/div>\n        <div class=\"month-chart\">${bars}<\/div>\n      <\/div>`;\n    }).join('');\n  }\n\n  function renderSalesLeasingGrid() {\n    const grid = document.getElementById('salesLeasingGrid');\n    grid.innerHTML = penjualanData.map(d => {\n      const list = salesLeasingCurrentMonth[d.key];\n      const total = list.reduce((s,l) => s + l.unit, 0);\n      const rows = list.map(l => `<tr><td>${esc(l.name)}<\/td><td class=\"slnum\">${l.unit}<\/td><\/tr>`).join('');\n      return `<div class=\"sl-card\" style=\"--accent:${d.color}\">\n        <div class=\"slhead\">\n          <div class=\"slname\">${esc(d.name)}<\/div>\n          <div class=\"sltotal\">${total} unit \u00b7 ${LEASING_MONTH_LABEL}<\/div>\n        <\/div>\n        <table class=\"sl-table\">\n          <thead><tr><th>Leasing / Metode<\/th><th style=\"text-align:right\">Unit<\/th><\/tr><\/thead>\n          <tbody>${rows}\n            <tr><td style=\"font-weight:700\">Total<\/td><td class=\"slnum\" style=\"font-weight:700\">${total}<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>`;\n    }).join('');\n  }\n\n  function renderGenericSalesGrid(containerId, categoryDataByBranchMonth, colLabel) {\n    const grid = document.getElementById(containerId);\n    if (!grid) return;\n    const visibleMonths = monthWindow.slice(-dpRange);\n    const monthsToShow = dpSelectedMonth === 'all' ? visibleMonths : visibleMonths.filter(mw => mw.key === dpSelectedMonth);\n    let cardsHtml = '';\n    penjualanData.forEach(d => {\n      monthsToShow.forEach(mw => {\n        const byMonth = categoryDataByBranchMonth[d.key] || {};\n        const list = byMonth[mw.key] || [];\n        const total = list.reduce((s,l) => s + l.unit, 0);\n        const rows = list.map((l, li) => `<tr><td style=\"text-align:right\">${li+1}<\/td><td>${esc(l.name)}<\/td><td class=\"slnum\">${l.unit}<\/td><\/tr>`).join('');\n        cardsHtml += `<div class=\"sl-card\" style=\"--accent:${d.color}\">\n          <div class=\"slhead\">\n            <div class=\"slname\">${esc(d.name)}<\/div>\n            <div class=\"sltotal\">${total} unit \u00b7 ${esc(mw.longLabel)}<\/div>\n          <\/div>\n          <table class=\"sl-table\">\n            <thead><tr><th style=\"text-align:right\">No<\/th><th>${esc(colLabel)}<\/th><th style=\"text-align:right\">Unit<\/th><\/tr><\/thead>\n            <tbody>${rows || `<tr><td colspan=\"3\" style=\"color:var(--ink-faint)\">Belum ada data<\/td><\/tr>`}\n              <tr><td><\/td><td style=\"font-weight:700\">Total<\/td><td class=\"slnum\" style=\"font-weight:700\">${total}<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>`;\n      });\n    });\n    grid.innerHTML = cardsHtml;\n  }\n\n  function renderDpControls() {\n    const visibleMonths = monthWindow.slice(-dpRange);\n    const pillsEl = document.getElementById('dpMonthPills');\n    const pills = [{ key: 'all', label: 'Semua' }, ...visibleMonths.map(mw => ({ key: mw.key, label: mw.shortLabel }))];\n    pillsEl.innerHTML = pills.map(p => `<button class=\"dp-pill ${dpSelectedMonth===p.key?'active':''}\" data-month=\"${esc(p.key)}\">${esc(p.label)}<\/button>`).join('');\n    pillsEl.querySelectorAll('.dp-pill').forEach(btn => {\n      btn.addEventListener('click', () => {\n        dpSelectedMonth = btn.dataset.month;\n        renderDetailPenjualan();\n      });\n    });\n    const first = visibleMonths[0], last = visibleMonths[visibleMonths.length - 1];\n    const rangeText = dpRange === 1 ? last.longLabel : `${first.shortLabel} \u2013 ${last.shortLabel}`;\n    ['dpLeasingLabel', 'dpInsuranceLabel', 'dpSupervisorLabel'].forEach(id => {\n      const el = document.getElementById(id);\n      if (el) el.textContent = dpSelectedMonth === 'all' ? rangeText : (visibleMonths.find(m => m.key === dpSelectedMonth) || last).longLabel;\n    });\n  }\n\n  function renderDetailPenjualan() {\n    renderDpControls();\n    renderGenericSalesGrid('dpLeasingGrid', monthlyCategoryData.leasing, 'Leasing / Metode');\n    renderGenericSalesGrid('dpInsuranceGrid', monthlyCategoryData.insurance, 'Insurance Company');\n    renderGenericSalesGrid('dpSupervisorGrid', monthlyCategoryData.supervisor, 'Supervisor');\n  }\n\n  /* ---------------- generic export: Excel (SheetJS) & PDF (jsPDF+autotable) ---------------- */\n  // Acuan format tanggal untuk SEMUA laporan yang di-export: DD/MM/YYYY (mis. 01/09/2026).\n  function fmtDateExport(d) {\n    const dd = String(d.getDate()).padStart(2, '0');\n    const mm = String(d.getMonth() + 1).padStart(2, '0');\n    return `${dd}/${mm}/${d.getFullYear()}`;\n  }\n  // Acuan format angka untuk SEMUA laporan yang di-export: pemisah ribuan pakai\n  // titik (mis. 1.000.000), tanpa \"Rp\" supaya tetap bisa dijumlah manual di Excel.\n  function fmtNumExport(n) {\n    return Math.round(n || 0).toLocaleString('id-ID');\n  }\n\n  // Mesin export bersama: tiap \"sheet\" berisi beberapa GRUP (mis. per Leasing:\n  // ACC, TAF, dst), opsional dikelompokkan lagi jadi SECTION (mis. per Divisi)\n  // di atasnya. Tiap grup mendapat baris judul sendiri + header kolom berulang\n  // + baris Total di bawahnya \u2014 supaya jelas terpisah, bukan satu tabel panjang.\n  function exportToExcel(filename, sheets) {\n    if (typeof XLSX === 'undefined') { alert('Library Excel belum termuat \u2014 pastikan koneksi internet aktif, lalu coba lagi.'); return; }\n    const wb = XLSX.utils.book_new();\n    sheets.forEach(s => {\n      const matrix = [];\n      const boldRows = []; // baris judul & Total dibuat bold\n      const emitGroup = (g) => {\n        if (g.title) { matrix.push([g.title]); boldRows.push(matrix.length - 1); }\n        matrix.push(g.headers);\n        g.rows.forEach(r => matrix.push(r));\n        if (g.totalRow) { matrix.push(g.totalRow); boldRows.push(matrix.length - 1); }\n        matrix.push([]);\n      };\n      if (s.sections) {\n        s.sections.forEach(sec => {\n          matrix.push([sec.title]); boldRows.push(matrix.length - 1);\n          matrix.push([]);\n          sec.groups.forEach(emitGroup);\n        });\n      } else {\n        s.groups.forEach(emitGroup);\n      }\n      const ws = XLSX.utils.aoa_to_sheet(matrix);\n      const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');\n      boldRows.forEach(r => {\n        for (let c = range.s.c; c <= range.e.c; c++) {\n          const ref = XLSX.utils.encode_cell({ r, c });\n          if (ws[ref]) ws[ref].s = { font: { bold: true } };\n        }\n      });\n      XLSX.utils.book_append_sheet(wb, ws, String(s.name).slice(0, 31));\n    });\n    XLSX.writeFile(wb, filename, { cellStyles: true });\n  }\n\n  function exportToPdf(filename, title, sheets) {\n    if (!window.jspdf) { alert('Library PDF belum termuat \u2014 pastikan koneksi internet aktif, lalu coba lagi.'); return; }\n    const { jsPDF } = window.jspdf;\n    const doc = new jsPDF({ orientation: 'landscape' });\n    const PAGE_H = doc.internal.pageSize.getHeight();\n    const BOTTOM_MARGIN = 15;\n    sheets.forEach((s, si) => {\n      if (si > 0) doc.addPage();\n      doc.setFontSize(13);\n      doc.text(String(s.name || title), 14, 15);\n      let y = 22;\n      const emitGroup = (g, extraHeight = 0, sectionTitle = null) => {\n        // Perkiraan tinggi seluruh grup (judul + header + baris + Total), supaya\n        // satu grup tidak kepotong jadi dua halaman \u2014 kalau tidak muat, pindah\n        // grup ini utuh ke halaman baru. extraHeight/sectionTitle = ruang & teks\n        // judul section yang harus ikut dihitung BERSAMAAN saat ini grup pertama\n        // di section-nya, supaya judul section tidak pernah nyangkut sendirian.\n        const estHeight = extraHeight + (g.title ? 6 : 0) + 7 + g.rows.length * 5 + (g.totalRow ? 5.5 : 0) + 8;\n        const cappedEst = Math.min(estHeight, PAGE_H - BOTTOM_MARGIN - 22 - extraHeight);\n        if (y + extraHeight + cappedEst > PAGE_H - BOTTOM_MARGIN) {\n          doc.addPage();\n          y = 15;\n        }\n        if (sectionTitle) {\n          doc.setFontSize(12.5);\n          doc.setFont(undefined, 'bold');\n          doc.text(sectionTitle, 14, y);\n          doc.setFont(undefined, 'normal');\n          y += 7;\n        }\n        if (g.title) {\n          doc.setFontSize(10.5);\n          doc.setFont(undefined, 'bold');\n          doc.text(g.title, 14, y);\n          doc.setFont(undefined, 'normal');\n          y += 4;\n        }\n        doc.autoTable({\n          head: [g.headers],\n          body: g.rows,\n          foot: g.totalRow ? [g.totalRow] : undefined,\n          footStyles: { fontStyle: 'bold', fillColor: [240, 242, 245], textColor: [20, 20, 20] },\n          showFoot: 'lastPage', // Total cuma tampil sekali di halaman terakhir tabel ini, tidak dobel tiap tabel terpotong halaman\n          startY: y,\n          styles: { fontSize: 7.5 },\n          rowPageBreak: 'avoid',\n        });\n        y = doc.lastAutoTable.finalY + 8;\n      };\n      if (s.sections) {\n        s.sections.forEach(sec => {\n          sec.groups.forEach((g, gi) => {\n            if (gi === 0) {\n              emitGroup(g, 15, sec.title);\n              return;\n            }\n            emitGroup(g);\n          });\n        });\n      } else {\n        s.groups.forEach(g => emitGroup(g));\n      }\n    });\n    doc.save(filename);\n  }\n\n  // gathers the exact rows currently visible in the Kartu Ringkasan Divisi cards\n  // (respects the active range/month filter), one export sheet per report.\n  function gatherKrdExportSheets() {\n    const visibleMonths = monthWindow.slice(-dpRange);\n    const monthsToShow = dpSelectedMonth === 'all' ? visibleMonths : visibleMonths.filter(mw => mw.key === dpSelectedMonth);\n    function buildSheet(name, dataByBranchMonth) {\n      const groups = [];\n      penjualanData.forEach(d => {\n        monthsToShow.forEach(mw => {\n          const list = (dataByBranchMonth[d.key] && dataByBranchMonth[d.key][mw.key]) || [];\n          const totalUnit = list.reduce((s, l) => s + l.unit, 0);\n          groups.push({\n            title: `${d.name} \u2014 ${mw.longLabel}`,\n            headers: ['No', name, 'Unit'],\n            rows: list.map((l, i) => [i + 1, l.name, l.unit]),\n            totalRow: ['', `TOTAL (${list.length} kategori)`, totalUnit],\n          });\n        });\n      });\n      return { name, groups };\n    }\n    return [\n      buildSheet('Leasing', monthlyCategoryData.leasing),\n      buildSheet('Insurance Company', monthlyCategoryData.insurance),\n      buildSheet('Supervisor', monthlyCategoryData.supervisor),\n    ];\n  }\n\n  /* ---------------- Detail Penjualan v2: search + group-by + collapsible ---------------- */\n  let dp2State = { search: '', divisi: 'all', monthKey: null, groupBy: 'leasing', collapsed: new Set() };\n  let dp2ExportOrder = 'az'; // 'az' atau 'top' (kategori terbanyak di atas) \u2014 khusus urutan kategori saat export\n\n  function dp2KeyFn(groupBy) {\n    if (groupBy === 'leasing') return r => (r.cara === 'Tunai' || !r.statusFnc) ? 'Cash (Tunai)' : r.statusFnc;\n    if (groupBy === 'insurance') return r => (!r.asuransi || r.asuransi === '-') ? 'Non Asuransi' : r.asuransi;\n    if (groupBy === 'supervisor') return r => r.supervisor || '\u2013';\n    return r => cleanSalesmanFull(r.salesman) || '\u2013';\n  }\n\n  function populateDp2Selectors() {\n    const divSel = document.getElementById('dp2DivisiSelect');\n    if (divSel.options.length <= 1) {\n      divSel.innerHTML = '<option value=\"all\">Semua Cabang<\/option>' + penjualanData.map(d => `<option value=\"${esc(d.name)}\">${esc(d.name)}<\/option>`).join('');\n    }\n    const monthSel = document.getElementById('dp2MonthSelect');\n    if (!monthSel.dataset.populated && monthWindow.length) {\n      monthSel.innerHTML = '<option value=\"all\">Semua Bulan<\/option>' + monthWindow.slice().reverse().map(mw => `<option value=\"${mw.key}\">${esc(mw.longLabel)}<\/option>`).join('');\n      monthSel.dataset.populated = '1';\n      if (!dp2State.monthKey) dp2State.monthKey = monthWindow[monthWindow.length - 1].key;\n      monthSel.value = dp2State.monthKey;\n    }\n  }\n\n  function getDp2FilteredRows() {\n    let rows = allSalesRows;\n    if (dp2State.divisi !== 'all') rows = rows.filter(r => r.divisi === dp2State.divisi);\n    if (dp2State.monthKey && dp2State.monthKey !== 'all') {\n      const mw = monthWindow.find(m => m.key === dp2State.monthKey);\n      if (mw) rows = rows.filter(r => r.tanggal.getFullYear() === mw.y && r.tanggal.getMonth() === mw.m);\n    }\n    const search = dp2State.search.trim().toLowerCase();\n    if (search) {\n      rows = rows.filter(r =>\n        (r.nama || '').toLowerCase().includes(search) ||\n        (r.type || '').toLowerCase().includes(search) ||\n        (r.faktur || '').toLowerCase().includes(search) ||\n        cleanSalesmanFull(r.salesman).toLowerCase().includes(search)\n      );\n    }\n    return rows;\n  }\n\n  // Acuan urutan default untuk data export/tampilan, mengikuti jenis laporan yang\n  // sedang ditarik (field yang dikelompokkan selalu jadi kunci urut pertama):\n  //   per Leasing     -> Leasing, Supervisor, Tgl Faktur, Divisi\n  //   per Insurance   -> Insurance Company, Supervisor, Tgl Faktur, Divisi\n  //   per Supervisor  -> Supervisor, Leasing, Tgl Faktur, Divisi\n  //   per Salesman    -> Salesman, Supervisor, Tgl Faktur, Divisi\n  const DP2_SORT_REFERENCE = {\n    leasing: ['leasing', 'supervisor', 'tanggal', 'divisi'],\n    insurance: ['insurance', 'supervisor', 'tanggal', 'divisi'],\n    supervisor: ['supervisor', 'leasing', 'tanggal', 'divisi'],\n    salesman: ['salesman', 'supervisor', 'tanggal', 'divisi'],\n  };\n\n  function dp2FieldValue(r, field) {\n    if (field === 'leasing') return (r.cara === 'Tunai' || !r.statusFnc) ? 'Cash (Tunai)' : r.statusFnc;\n    if (field === 'insurance') return (!r.asuransi || r.asuransi === '-') ? 'Non Asuransi' : r.asuransi;\n    if (field === 'supervisor') return r.supervisor || '\u2013';\n    if (field === 'salesman') return cleanSalesmanFull(r.salesman) || '\u2013';\n    if (field === 'tanggal') return r.tanggal;\n    if (field === 'divisi') return r.divisi;\n    if (field === 'nama') return r.nama;\n    if (field === 'type') return r.type;\n    if (field === 'faktur') return r.faktur;\n    return '';\n  }\n\n  function dp2ReferenceSort(rows, groupBy) {\n    const fields = DP2_SORT_REFERENCE[groupBy] || ['tanggal'];\n    return rows.slice().sort((a, b) => {\n      for (const f of fields) {\n        const va = dp2FieldValue(a, f), vb = dp2FieldValue(b, f);\n        if (f === 'tanggal') { const d = va - vb; if (d !== 0) return d; continue; }\n        const cmp = String(va || '').localeCompare(String(vb || ''));\n        if (cmp !== 0) return cmp;\n      }\n      return 0;\n    });\n  }\n\n  let dp2DetailSort = null; // null = pakai acuan urutan bawaan sesuai jenis laporan; diisi setelah user klik header kolom\n\n  function dp2SortRows(rows) {\n    if (!dp2DetailSort) return dp2ReferenceSort(rows, dp2State.groupBy);\n    const key = dp2DetailSort.key, dir = dp2DetailSort.dir === 'asc' ? 1 : -1;\n    return rows.slice().sort((a, b) => {\n      if (key === 'tanggal') return (a.tanggal - b.tanggal) * dir;\n      let va, vb;\n      if (key === 'nama') { va = a.nama; vb = b.nama; }\n      else if (key === 'type') { va = a.type; vb = b.type; }\n      else if (key === 'faktur') { va = a.faktur; vb = b.faktur; }\n      else if (key === 'divisi') { va = a.divisi; vb = b.divisi; }\n      else { va = cleanSalesmanFull(a.salesman); vb = cleanSalesmanFull(b.salesman); }\n      return String(va || '').localeCompare(String(vb || '')) * dir;\n    });\n  }\n\n  function renderDetailPenjualanV2() {\n    populateDp2Selectors();\n    const keyFn = dp2KeyFn(dp2State.groupBy);\n    const rows = getDp2FilteredRows();\n\n    const groups = {};\n    rows.forEach(r => { (groups[keyFn(r)] ||= []).push(r); });\n    const groupNames = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);\n\n    const divLabel = dp2State.divisi === 'all' ? '' : ` \u00b7 ${esc(dp2State.divisi)}`;\n    const mwEntry = monthWindow.find(m => m.key === dp2State.monthKey);\n    const mwLabel = (!dp2State.monthKey || dp2State.monthKey === 'all') ? 'Semua Bulan' : (mwEntry ? mwEntry.longLabel : '');\n    document.getElementById('dp2Meta').textContent = `${rows.length} unit${divLabel} \u00b7 ${mwLabel}`;\n\n    const container = document.getElementById('dp2Groups');\n    if (!groupNames.length) {\n      container.innerHTML = '<div class=\"task-empty\">Tidak ada data yang cocok.<\/div>';\n      return;\n    }\n    const dp2Cols = [\n      { key: 'nama', label: 'Nama Debitur' },\n      { key: 'type', label: 'Tipe Unit' },\n      { key: 'faktur', label: 'Faktur' },\n      { key: 'tanggal', label: 'Tanggal' },\n      { key: 'divisi', label: 'Cabang' },\n      { key: 'salesman', label: 'Salesman' },\n    ];\n    const dp2HeadHtml = dp2Cols.map(c => {\n      const arrow = (dp2DetailSort && dp2DetailSort.key === c.key) ? `<span class=\"sort-arrow\">${dp2DetailSort.dir === 'asc' ? '\u25b2' : '\u25bc'}<\/span>` : '';\n      return `<th class=\"bdp-sortable\" data-sort=\"${c.key}\">${c.label}${arrow}<\/th>`;\n    }).join('');\n    container.innerHTML = groupNames.map((gname, gi) => {\n      const list = groups[gname];\n      const isOpen = !dp2State.collapsed.has(gname);\n      const detailRows = dp2SortRows(list).map((r, i) => `\n        <tr>\n          <td style=\"text-align:right\">${i + 1}<\/td>\n          <td>${esc(r.nama)}<\/td>\n          <td>${esc(r.type)}<\/td>\n          <td class=\"jumlah-mono\">${esc(r.faktur)}<\/td>\n          <td>${r.tanggal.toLocaleDateString('id-ID')}<\/td>\n          <td>${esc(r.divisi)}<\/td>\n          <td>${esc(cleanSalesmanFull(r.salesman))}<\/td>\n        <\/tr>`).join('');\n      return `\n        <div class=\"dp2-group-bar ${isOpen ? 'open' : ''}\" data-groupidx=\"${gi}\"><span><span class=\"chevron\">\u25b8<\/span>${esc(gname)}<\/span><span>${list.length} unit<\/span><\/div>\n        <div class=\"dp2-group-detail ${isOpen ? '' : 'hidden'}\" data-groupdetailidx=\"${gi}\">\n          <table class=\"dp2-table\">\n            <thead><tr><th style=\"text-align:right\">No<\/th>${dp2HeadHtml}<\/tr><\/thead>\n            <tbody>${detailRows}\n              <tr class=\"dp2-total-row\"><td colspan=\"7\">Total <b>${list.length} unit<\/b><\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>`;\n    }).join('');\n\n    container.querySelectorAll('th.bdp-sortable').forEach(th => {\n      th.addEventListener('click', () => {\n        const k = th.dataset.sort;\n        if (dp2DetailSort && dp2DetailSort.key === k) dp2DetailSort.dir = dp2DetailSort.dir === 'asc' ? 'desc' : 'asc';\n        else { dp2DetailSort = { key: k, dir: 'asc' }; }\n        renderDetailPenjualanV2();\n      });\n    });\n\n    container.querySelectorAll('.dp2-group-bar').forEach((bar, gi) => {\n      bar.addEventListener('click', () => {\n        const gname = groupNames[gi];\n        const detail = container.querySelector(`[data-groupdetailidx=\"${gi}\"]`);\n        const willOpen = detail.classList.contains('hidden');\n        detail.classList.toggle('hidden');\n        bar.classList.toggle('open', willOpen);\n        if (willOpen) dp2State.collapsed.delete(gname); else dp2State.collapsed.add(gname);\n      });\n    });\n  }\n\n  function gatherDp2ExportSheet() {\n    const keyFn = dp2KeyFn(dp2State.groupBy);\n    const groupLabel = { leasing: 'Leasing', insurance: 'Insurance Company', supervisor: 'Supervisor', salesman: 'Salesman' }[dp2State.groupBy];\n    // Cabang tidak diulang sebagai kolom karena sudah jadi judul section (per divisi).\n    const colHeaders = ['No', 'Nama Debitur', 'Tipe Unit', 'Faktur', 'Tanggal', 'Salesman'];\n    const allRows = getDp2FilteredRows();\n    const sections = [];\n    BRANCH_ORDER.forEach(divName => {\n      const divRows = dp2ReferenceSort(allRows.filter(r => r.divisi === divName), dp2State.groupBy);\n      if (!divRows.length) return;\n      const catMap = {};\n      divRows.forEach(r => { const k = keyFn(r); (catMap[k] ||= []).push(r); });\n      // Urutan kategori bisa dipilih user: A-Z, atau kategori dengan unit terbanyak di atas.\n      let catKeys = Object.keys(catMap);\n      if (dp2ExportOrder === 'top') catKeys.sort((a, b) => catMap[b].length - catMap[a].length);\n      else catKeys.sort((a, b) => a.localeCompare(b));\n      const groups = catKeys.map(k => {\n        const glist = catMap[k];\n        const totalRow = new Array(colHeaders.length).fill('');\n        totalRow[1] = `TOTAL (${glist.length} unit)`;\n        return {\n          title: `${groupLabel}: ${k}`,\n          headers: colHeaders,\n          rows: glist.map((r, i) => [i + 1, r.nama, r.type, r.faktur, fmtDateExport(r.tanggal), cleanSalesmanFull(r.salesman)]),\n          totalRow,\n        };\n      });\n      sections.push({ title: `Divisi ${divName}`, groups });\n    });\n    return [{ name: 'Detail Penjualan', sections }];\n  }\n\n  function wireDetailPenjualanV2() {\n    document.getElementById('dp2Search').addEventListener('input', (e) => { dp2State.search = e.target.value; renderDetailPenjualanV2(); });\n    document.getElementById('dp2DivisiSelect').addEventListener('change', (e) => { dp2State.divisi = e.target.value; renderDetailPenjualanV2(); });\n    document.getElementById('dp2MonthSelect').addEventListener('change', (e) => { dp2State.monthKey = e.target.value; renderDetailPenjualanV2(); });\n    document.getElementById('dp2GroupSelect').addEventListener('change', (e) => { dp2State.groupBy = e.target.value; dp2State.collapsed.clear(); dp2DetailSort = null; renderDetailPenjualanV2(); });\n    document.getElementById('dp2MinAll').addEventListener('click', () => {\n      const keyFn = dp2KeyFn(dp2State.groupBy);\n      const rows = getDp2FilteredRows();\n      const names = new Set(rows.map(keyFn));\n      names.forEach(n => dp2State.collapsed.add(n));\n      renderDetailPenjualanV2();\n    });\n    document.getElementById('dp2OpenAll').addEventListener('click', () => { dp2State.collapsed.clear(); renderDetailPenjualanV2(); });\n    document.getElementById('dp2ExportOrderSelect').addEventListener('change', (e) => { dp2ExportOrder = e.target.value; });\n    document.getElementById('dp2ExportExcel').addEventListener('click', () => exportToExcel('Detail_Penjualan.xlsx', gatherDp2ExportSheet()));\n    document.getElementById('dp2ExportPdf').addEventListener('click', () => exportToPdf('Detail_Penjualan.pdf', 'Detail Penjualan', gatherDp2ExportSheet()));\n  }\n\n\n  /* ---------------- Sales Terbanyak tab ---------------- */\n  let stRange = 6;\n  let stSelectedMonth = 'all';\n  let stTopN = 10;\n\n  let stDetailSort = { key: 'nama', dir: 'asc' };\n  let stOpenCard = null; // {cardId, salesman}\n\n  function stTransactionsFor(divisiName, mw, salesmanName) {\n    return allSalesRows.filter(r => r.divisi === divisiName && r.tanggal.getFullYear() === mw.y && r.tanggal.getMonth() === mw.m && (cleanSalesmanFull(r.salesman) || '\u2013') === salesmanName);\n  }\n\n  function stSortRows(rows) {\n    const key = stDetailSort.key, dir = stDetailSort.dir === 'asc' ? 1 : -1;\n    const leasingOf = r => (r.cara === 'Tunai' || !r.statusFnc) ? 'Cash (Tunai)' : r.statusFnc;\n    return rows.slice().sort((a, b) => {\n      let va, vb;\n      if (key === 'nama') { va = a.nama; vb = b.nama; }\n      else if (key === 'type') { va = a.type; vb = b.type; }\n      else if (key === 'faktur') { va = a.faktur; vb = b.faktur; }\n      else if (key === 'leasing') { va = leasingOf(a); vb = leasingOf(b); }\n      else if (key === 'tanggal') { return (a.tanggal - b.tanggal) * dir; }\n      else { va = a.divisi; vb = b.divisi; }\n      return String(va || '').localeCompare(String(vb || '')) * dir;\n    });\n  }\n\n  function stRenderDetailTable(divisiName, mw, salesmanName) {\n    const leasingOf = r => (r.cara === 'Tunai' || !r.statusFnc) ? 'Cash (Tunai)' : r.statusFnc;\n    const rows = stSortRows(stTransactionsFor(divisiName, mw, salesmanName));\n    const cols = [\n      { key: 'nama', label: 'Nama Debitur' },\n      { key: 'type', label: 'Tipe Unit' },\n      { key: 'faktur', label: 'Faktur' },\n      { key: 'leasing', label: 'Leasing' },\n      { key: 'tanggal', label: 'Tanggal' },\n      { key: 'divisi', label: 'Cabang' },\n    ];\n    const headHtml = cols.map(c => {\n      const arrow = stDetailSort.key === c.key ? `<span class=\"sort-arrow\">${stDetailSort.dir === 'asc' ? '\u25b2' : '\u25bc'}<\/span>` : '';\n      return `<th class=\"bdp-sortable\" data-sort=\"${c.key}\">${c.label}${arrow}<\/th>`;\n    }).join('');\n    const bodyHtml = rows.map((r, i) => `<tr>\n      <td style=\"text-align:right\">${i + 1}<\/td>\n      <td>${esc(r.nama)}<\/td>\n      <td>${esc(r.type)}<\/td>\n      <td class=\"jumlah-mono\">${esc(r.faktur)}<\/td>\n      <td>${esc(leasingOf(r))}<\/td>\n      <td>${r.tanggal.toLocaleDateString('id-ID')}<\/td>\n      <td>${esc(r.divisi)}<\/td>\n    <\/tr>`).join('');\n    return `<table class=\"bdp-table\"><thead><tr><th style=\"text-align:right\">No<\/th>${headHtml}<\/tr><\/thead><tbody>${bodyHtml}<\/tbody><\/table>`;\n  }\n\n  function stWireDetailSort(container, divisiName, mw, salesmanName) {\n    container.querySelectorAll('th.bdp-sortable').forEach(th => {\n      th.addEventListener('click', () => {\n        const k = th.dataset.sort;\n        if (stDetailSort.key === k) stDetailSort.dir = stDetailSort.dir === 'asc' ? 'desc' : 'asc';\n        else { stDetailSort.key = k; stDetailSort.dir = 'asc'; }\n        container.innerHTML = stRenderDetailTable(divisiName, mw, salesmanName);\n        stWireDetailSort(container, divisiName, mw, salesmanName);\n      });\n    });\n  }\n\n  function renderSalesTerbanyak() {\n    const stTab = document.getElementById('stMonthPills');\n    if (!stTab) return;\n    const visibleMonths = monthWindow.slice(-stRange);\n    if (!visibleMonths.length) return;\n    const pillsEl = document.getElementById('stMonthPills');\n    const pills = [{ key: 'all', label: 'Semua' }, ...visibleMonths.map(mw => ({ key: mw.key, label: mw.shortLabel }))];\n    pillsEl.innerHTML = pills.map(p => `<button class=\"dp-pill ${stSelectedMonth===p.key?'active':''}\" data-month=\"${esc(p.key)}\">${esc(p.label)}<\/button>`).join('');\n    pillsEl.querySelectorAll('.dp-pill').forEach(btn => {\n      btn.addEventListener('click', () => { stSelectedMonth = btn.dataset.month; stOpenCard = null; renderSalesTerbanyak(); });\n    });\n\n    const topnEl = document.getElementById('stTopNPills');\n    const topnOptions = [{ key: '5', label: '5 Terbanyak' }, { key: '10', label: '10 Terbanyak' }, { key: 'all', label: 'Semua' }];\n    topnEl.innerHTML = topnOptions.map(o => `<button class=\"dp-pill ${String(stTopN)===o.key?'active':''}\" data-topn=\"${o.key}\">${esc(o.label)}<\/button>`).join('');\n    topnEl.querySelectorAll('.dp-pill').forEach(btn => {\n      btn.addEventListener('click', () => { stTopN = btn.dataset.topn === 'all' ? 'all' : Number(btn.dataset.topn); renderSalesTerbanyak(); });\n    });\n\n    const monthsToShow = stSelectedMonth === 'all' ? visibleMonths : visibleMonths.filter(m => m.key === stSelectedMonth);\n    const first = visibleMonths[0], last = visibleMonths[visibleMonths.length - 1];\n    const rangeLabel = `${MONTHS_ID[first.m]}\u2013${MONTHS_ID[last.m]} ${last.y}`;\n\n    const grid = document.getElementById('stGrid');\n    grid.innerHTML = penjualanData.map(d => {\n      const cardsHtml = monthsToShow.map((mw, mi) => {\n        const cardId = `${d.key}__${mw.key}`;\n        const sub = allSalesRows.filter(r => r.divisi === d.name && r.tanggal.getFullYear() === mw.y && r.tanggal.getMonth() === mw.m);\n        const map = {};\n        sub.forEach(r => { const k = cleanSalesmanFull(r.salesman) || '\u2013'; map[k] = (map[k] || 0) + 1; });\
