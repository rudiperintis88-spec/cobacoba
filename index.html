<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Hasil Kapal</title>
<style>
:root{--y:#ffff00;--ink:#111;--bg:#fff;--mut:#666}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 Cambria,"Times New Roman",Times,serif}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding:14px 20px;border-bottom:1px solid #ccc;background:#f6f6f6}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:bold}
.bar select,.bar button{font:inherit;padding:6px 10px;border:1px solid #888;border-radius:4px;background:#fff;color:var(--ink)}
.bar button{cursor:pointer;font-weight:bold}
.bar #cetak{background:var(--y);border-color:var(--ink)}
.bar select:focus-visible,.bar button:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;row-gap:22px;padding:20px;max-width:1100px;margin:0 auto}
table{width:100%;border-collapse:collapse}
td{padding:3px 6px;vertical-align:middle}
td:nth-child(2){width:84px;white-space:nowrap}
td:nth-child(3){width:120px;white-space:nowrap}
.n{text-align:right}
.h td{background:var(--y);font-weight:bold}
.t td{background:var(--y);font-weight:bold;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.b td{font-weight:bold}
.ln td{border-top:1px solid var(--ink)}
.g td{border:1px solid var(--ink)}
.g td:nth-child(2){text-align:right}
.note{max-width:1100px;margin:0 auto;padding:0 20px 24px;color:var(--mut);font-size:12.5px}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .a1{order:1}.a2{order:2}.b1{order:3}.b2{order:4}
  td:nth-child(2){width:76px}
  td:nth-child(3){width:108px}
}
@media print{
  @page{size:A4 landscape;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{display:none}
  body{font-size:11px}
  .grid{padding:0;max-width:none;column-gap:28px;row-gap:16px}
  .note{padding:8px 0 0}
}

[hidden]{display:none!important}
.center{max-width:480px;margin:20vh auto 0;padding:0 20px;display:flex;flex-direction:column;gap:14px;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.center .hint{margin:0 0 6px;text-align:center;color:#111;font:bold 28px/1.2 Georgia,"Times New Roman",serif}
.center input{height:56px;border:1px solid #dde3ef;border-radius:16px;background:#e8f0fe;text-align:center;font-size:20px;color:#111;width:100%;padding:0 56px}
.center input:focus{border:3px solid #111;padding:0 54px}
.pw{position:relative}
.mata{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:#6b7280;cursor:pointer;display:grid;place-items:center;padding:0}
.center input::placeholder{color:#8a94a6}
.center input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.btn-soft{height:54px;border:0;border-radius:14px;background:#2a4bd7;font-size:20px;font-weight:bold;color:#fff;cursor:pointer}
.btn-soft:hover{background:#2140c0}
.err{min-height:22px;margin:0;text-align:center;color:#b42318;font-size:15px}
.link{align-self:center;background:none;border:0;color:#2563eb;font:inherit;font-size:15px;cursor:pointer;text-decoration:underline}
.kode{font:bold 30px/1.2 ui-monospace,Menlo,Consolas,monospace;text-align:center;letter-spacing:2px;padding:18px;background:#e8f0fe;border-radius:18px}
.center p{margin:0;text-align:center;color:#444;font-size:16px;line-height:1.5}
.center textarea{width:100%;min-height:90px;border:2px solid #111;border-radius:14px;padding:10px;font:13px ui-monospace,Menlo,Consolas,monospace}
.status{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 20px;color:#8a94a6;font:15px system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.status b{color:#1f2937}
.ico{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;border-radius:9px;background:#2563eb;color:#fff;vertical-align:middle}
.judul{margin:0;color:#1f2937;font:700 24px system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.aksi{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){.judul{font-size:20px}.aksi{width:100%;justify-content:space-between}}
.refresh{display:inline-flex;align-items:center;gap:10px;padding:9px 22px;border:1px solid #e1e6f0;border-radius:16px;background:#eef1f8;color:#1f2937;font:bold 17px system-ui,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
.refresh .ico{width:30px;height:30px;margin:0}
.keluar{border:0;background:none;color:#6b7280;font:15px system-ui,Arial,sans-serif;cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:6px;padding:0 20px;border-bottom:1px solid #dde2ec;overflow-x:auto}
.tabs button{padding:11px 16px;border:0;border-bottom:3px solid transparent;background:none;color:#6b7280;font:600 15px system-ui,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:#1f2937;border-bottom-color:#2563eb}
.ctl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;padding:16px 20px 0;max-width:1100px;margin:0 auto}
.ctl label{display:flex;flex-direction:column;gap:3px;font:bold 13px system-ui,Arial,sans-serif}
.ctl select,.ctl button{font:inherit;padding:7px 10px;border:1px solid #888;border-radius:6px;background:#fff;color:#111}
.ctl #pdf,.ctl #pdfLr{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.grid[data-tab^=rekap] .a1,.grid[data-tab^=rekap] .b1{display:none}
#lrgrid:not([data-tab^=rekap]) .a2,#lrgrid:not([data-tab^=rekap]) .b2{display:none}
.grid[data-tab^=rekap]{grid-template-columns:1fr;max-width:960px}
.grid[data-tab=rekapa] .b2,.grid[data-tab=rekapb] .a2{display:none}
.grid[data-tab=a],.grid[data-tab=b]{grid-template-columns:1fr;max-width:640px}
.grid[data-tab=a] .b1,.grid[data-tab=a] .b2,.grid[data-tab=b] .a1,.grid[data-tab=b] .a2{display:none}
@media print{.status,.tabs,.ctl{display:none}}

.mainnav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 0;border-bottom:1px solid #dde2ec;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.mainnav button{padding:11px 20px;border:1px solid #dde2ec;border-bottom:0;border-radius:12px 12px 0 0;background:#f6f7fb;color:#4b5563;font:600 15px system-ui,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
.mainnav button[aria-selected=true]{background:#2a4bd7;border-color:#2a4bd7;color:#fff}
.sec td{background:#eef0f4;font-weight:bold;letter-spacing:.05em;font-size:13px}
.t.lb td{font-size:16px}
.pos{color:#0a6b2d}.neg{color:#b42318}
table.rk td:nth-child(2),table.rk td:nth-child(3){width:auto}
table.rk td{white-space:nowrap}
table.rk tr.sel td{background:#fff9d6}
table.rk tr.tt td{font-weight:bold;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.rkh{margin:0 0 6px;font-weight:bold}
.grid>div{min-width:0}
.sc{overflow-x:auto}
.note2{margin:6px 0 0;color:var(--mut);font-size:12.5px}
@media print{.mainnav{display:none}}
</style>
</head>
<body>
<section id="login" class="center">
  <p class="hint">Laporan</p>
  <input id="nama" type="text" placeholder="Nama" autocomplete="username" aria-label="Nama">
  <div class="pw"><input id="sandi" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button type="button" id="mata" class="mata" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button type="button" id="masuk" class="btn-soft">Masuk</button>
  <p id="galat" class="err" role="alert"></p>
</section>

<div id="app" hidden>
  <div class="status">
    <h1 class="judul">Laporan Hasil Kapal</h1>
    <div class="aksi">
      <div id="stat" role="status"></div>
      <button type="button" id="muat" class="refresh"></button>
    </div>
  </div>
  <nav class="mainnav" id="mainnav" role="tablist" aria-label="Menu" hidden>
    <button type="button" role="tab" data-m="gaji" aria-selected="true">Laporan Gaji</button>
    <button type="button" role="tab" data-m="lr" aria-selected="false">Laporan Laba Rugi</button>
  </nav>
  <div id="paneGaji">
  <nav class="tabs" id="tabsGaji" role="tablist" aria-label="Laporan">
    <button type="button" role="tab" data-t="semua">Semua</button>
    <button type="button" role="tab" data-t="a">KM Bintang Laut</button>
    <button type="button" role="tab" data-t="b">KM Serba Jaya</button>
  </nav>
  <div class="ctl">
    <label id="wa">KM Bintang Laut<select id="sa"></select></label>
    <label id="wb">KM Serba Jaya<select id="sb"></select></label>
    <button type="button" id="pdf">Export PDF</button>
  </div>
  <main class="grid" id="grid" data-tab="semua">
    <div class="a1" id="a1"></div>
    <div class="b1" id="b1"></div>
    <div class="a2" id="a2"></div>
    <div class="b2" id="b2"></div>
  </main>
  </div>
  <div id="paneLR" hidden>
    <nav class="tabs" id="tabsLR" role="tablist" aria-label="Laba Rugi">
      <button type="button" role="tab" data-l="semua">Semua</button>
      <button type="button" role="tab" data-l="a">KM Bintang Laut</button>
      <button type="button" role="tab" data-l="b">KM Serba Jaya</button>
      <button type="button" role="tab" data-l="rekap">Rekap Trip</button>
    </nav>
    <div class="ctl">
      <label id="wla">KM Bintang Laut<select id="la"></select></label>
      <label id="wlb">KM Serba Jaya<select id="lb"></select></label>
      <button type="button" id="pdfLr">Export PDF</button>
    </div>
    <main class="grid" id="lrgrid" data-tab="semua">
      <div class="a1" id="la1"></div>
      <div class="b1" id="lb1"></div>
      <div class="a2" id="la2"></div>
      <div class="b2" id="lb2"></div>
    </main>
  </div>
</div>
<script>
var SHEET_ID = '1c1ADp2Yc7xJ6GI6vRAYlZqauayF89lmVdH-LjE-IbNM';
var URL_DATA = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
  '/gviz/tq?tqx=out:json&sheet=Data&headers=0&range=A3:O1000';

// Kolom di sheet Data (mulai 0 = kolom A)
var K = [
  { id: 'a', nama: 'KM BINTANG LAUT', def: 'TRIP 76',
    c: { ket: 10, trip: 11, nom: 12, ut: 13, di: 14 },
    // data tersimpan 20 November 2026 (dipakai bila spreadsheet tidak bisa dibaca)
    items: ['Ikan Basah', 'Ikan Asin'],
    belanja: { 'TRIP 75': 33717000, 'TRIP 76': 23748500 },
    trips: {
      'TRIP 75': { nom: [10568000, 36672800], utang: 129760, diambil: 3100000 },
      'TRIP 76': { nom: [19369800, 33206850], utang: 0, diambil: 3950000 },
      'TRIP 77': { nom: [11764500, 0], utang: 0, diambil: 2000000 }
    } },
  { id: 'b', nama: 'KM SERBA JAYA', def: 'TRIP 14',
    c: { ket: 2, trip: 3, nom: 4, ut: 5, di: 6 },
    items: ['Ikan Basah', 'Ikan Basah Toke', 'Ikan Asin'],
    belanja: { 'TRIP 13': 29811500 },
    trips: {
      'TRIP 13': { nom: [3996250, 0, 9502500], utang: 335075, diambil: 1780000 },
      'TRIP 14': { nom: [15856850, 712500, 28545400], utang: 765200, diambil: 1680000 },
      'TRIP 15': { nom: [9994200, 435000, 0], utang: 0, diambil: 1430000 }
    } }
];

var TIER = [
  [0, 50000000, 0.10, 'Rp 0 - Rp 50.000.000'],
  [50000000, 75000000, 0.11, 'Rp 50.000.001 - Rp 75.000.000'],
  [75000000, 100000000, 0.12, 'Rp 75.000.001 - Rp 100.000.000'],
  [100000000, null, 0.13, 'Rp 100.000.001 - Max']
];

var TIER_DEF = TIER.map(function (t) { return { from: t[0], to: t[1], p: t[2], lab: 'Gaji Hasil (' + t[3] + ')' }; });
var URL_TIER = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
  '/gviz/tq?tqx=out:csv&headers=0&sheet=' + encodeURIComponent('Perhitungan Gaji') + '&range=A1:H40';
var URL_BELANJA = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
  '/gviz/tq?tqx=out:json&headers=0&sheet=Belanja&range=A3:M1000';
function he(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function pctNum(p) { return String(Math.round(p * 1000) / 10).replace('.', ','); }
function el(id) { return document.getElementById(id); }
function dots(s) { return String(s).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function rp(n) { var r = Math.round(n); return (r < 0 ? '-' : '') + 'Rp' + dots(Math.abs(r)); }
function nc(v) { return Math.round(v) < 0 ? 'n neg' : 'n'; } /* minus = merah, selain itu hitam */
function rp2(n) { var p = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '-' : '') + 'Rp' + dots(p[0]) + ',' + p[1]; }
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
function angka(t) { return parseInt(String(t).replace(/\D/g, ''), 10) || 0; }

/* ---------- Hitungan ---------- */
function hitung(k, trip) {
  var d = k.trips[trip];
  var total = sum(d.nom);
  var hasil = (k.tier || TIER_DEF).map(function (t) {
    var a = Math.max(0, t.to === null ? total - t.from : Math.min(total, t.to) - t.from);
    return { a: a, p: t.p, c: a * t.p, lab: t.lab };
  });
  var gaji = sum(hasil.map(function (h) { return h.c; }));
  var utang = -Math.abs(d.utang), diambil = -Math.abs(d.diambil);
  return { d: d, total: total, hasil: hasil, gaji: gaji, utang: utang, diambil: diambil, sisa: gaji + utang + diambil };
}

/* ---------- Tampilan ---------- */
function atas(k, trip, r) {
  var h = '<table><tr><td colspan="3"><b>LAPORAN HASIL KAPAL</b></td></tr>' +
    '<tr><td colspan="3"><b>' + k.nama + '</b></td></tr>' +
    '<tr><td colspan="3"><b>' + trip + '</b></td></tr>' +
    '<tr class="h"><td>Keterangan</td><td>Percent %</td><td class="n">Nominal</td></tr>';
  k.items.forEach(function (it, i) {
    h += '<tr><td>' + it + '</td><td></td><td class="' + nc(r.d.nom[i]) + '">' + rp(r.d.nom[i]) + '</td></tr>';
  });
  h += '<tr class="t"><td>Total</td><td></td><td class="' + nc(r.total) + '">' + rp(r.total) + '</td></tr>';
  r.hasil.forEach(function (x) {
    h += '<tr><td>' + he(x.lab) + '</td><td>' + pctNum(x.p) +
         ' %</td><td class="' + nc(x.c) + '">' + rp(x.c) + '</td></tr>';
  });
  h += '<tr class="b ln"><td>Gaji Total</td><td></td><td class="' + nc(r.gaji) + '">' + rp(r.gaji) + '</td></tr>' +
       '<tr class="b"><td>Sisa Utang</td><td></td><td class="' + nc(r.utang) + '">' + rp(r.utang) + '</td></tr>' +
       '<tr class="b"><td>Gaji Sudah Diambil</td><td></td><td class="' + nc(r.diambil) + '">' + rp(r.diambil) + '</td></tr>' +
       '<tr class="b ln"><td>Sisa Gaji</td><td></td><td class="' + nc(r.sisa) + '">' + rp(r.sisa) + '</td></tr></table>';
  return h;
}

function bawah(r) {
  var h = '<table><tr class="h"><td>Hasil</td><td>Percent %</td><td class="n">Nominal</td></tr>';
  r.hasil.forEach(function (x) {
    h += '<tr class="g"><td class="n">' + rp2(x.a) + '</td><td>' + pctNum(x.p) +
         '%</td><td class="' + nc(x.c) + '">' + rp(x.c) + '</td></tr>';
  });
  h += '<tr class="g b"><td class="n">' + rp2(r.total) + '</td><td></td><td class="' + nc(r.gaji) + '">' + rp(r.gaji) + '</td></tr></table>';
  return h;
}

function render() {
  K.forEach(function (k) {
    if (kapalBoleh && k.id !== kapalBoleh) { el(k.id + '1').innerHTML = ''; el(k.id + '2').innerHTML = ''; return; }
    var trip = el('s' + k.id).value;
    if (!trip || !k.trips[trip]) {
      el(k.id + '1').innerHTML = '<p><b>' + k.nama + '</b><br>Belum ada data trip.</p>';
      el(k.id + '2').innerHTML = '';
      return;
    }
    var r = hitung(k, trip);
    el(k.id + '1').innerHTML = atas(k, trip, r);
    el(k.id + '2').innerHTML = bawah(r);
  });
}

function isiPilihan() {
  K.forEach(function (k) {
    var s = el('s' + k.id);
    var cur = s.value || k.def;
    var names = Object.keys(k.trips).sort(function (a, b) { return angka(a) - angka(b); });
    if (!isMaster()) {
      names = names.filter(function (t) { return t === TRIP_TERBUKA[k.id]; });
      cur = TRIP_TERBUKA[k.id];
      s.disabled = true;
    } else { s.disabled = false; }
    s.innerHTML = '';
    names.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t; o.textContent = t;
      s.appendChild(o);
    });
    s.value = k.trips[cur] ? cur : (names.length ? names[names.length - 1] : '');
  });
}

/* ---------- Tarif gaji dari sheet "Perhitungan Gaji" (label, persen, batas hasil ikut spreadsheet) ---------- */
function csvRows(t) {
  var out = [], row = [], c = '', q = false, i, ch;
  for (i = 0; i < t.length; i++) {
    ch = t.charAt(i);
    if (q) { if (ch === '"') { if (t.charAt(i + 1) === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(c); c = ''; }
    else if (ch === '\n') { row.push(c); out.push(row); row = []; c = ''; }
    else if (ch !== '\r') c += ch;
  }
  if (c.length || row.length) { row.push(c); out.push(row); }
  return out;
}
function pctVal(s) {
  s = String(s == null ? '' : s).trim();
  var n = parseFloat(s.replace(/\s/g, '').replace('%', '').replace(',', '.'));
  if (!s || !isFinite(n) || n < 0) return NaN;
  return /%/.test(s) ? n / 100 : (n > 1 ? n / 100 : n);
}
/* Baris "Gaji Hasil (Rp 0 - Rp 50.000.000)" + persen di sebelahnya, di bawah judul nama kapal. Batas diambil dari angka pada label. */
function olahTier(txt) {
  var rows = csvRows(txt);
  K.forEach(function (k) {
    var lc = -1, i, j;
    for (i = 0; i < rows.length && i < 8 && lc < 0; i++) {
      for (j = 0; j < rows[i].length; j++) { if (String(rows[i][j]).trim().toUpperCase() === k.nama) { lc = j; break; } }
    }
    if (lc < 0) return;
    var out = [], prev = 0, ok = true;
    for (i = 0; i < rows.length; i++) {
      var lab = String(rows[i][lc] == null ? '' : rows[i][lc]).trim();
      if (!/^gaji\b[^(]*\(\s*rp/i.test(lab)) { if (out.length) break; continue; }
      var nums = (lab.match(/Rp\s*[\d.]+/gi) || []).map(angka);
      var p = pctVal(rows[i][lc + 1]);
      var to = /max/i.test(lab) ? null : nums[nums.length - 1];
      if (!isFinite(p) || (to !== null && (to === undefined || to < prev))) { ok = false; break; }
      out.push({ from: prev, to: to, p: p, lab: lab });
      if (to === null) break;
      prev = to;
    }
    if (ok && out.length) k.tier = out;
  });
}


/* ---------- Laporan Laba Rugi = Penghasilan - Biaya (Belanja, sudah termasuk gaji) ---------- */
function olahBelanja(rows) {
  K.forEach(function (k) {
    var b = {};
    rows.forEach(function (row) {
      var trip = normTrip(sel(row, k.c.trip)), n = num(sel(row, k.c.nom));
      if (trip && n) b[trip] = (b[trip] || 0) + n;
    });
    k.belanja = b;
  });
}
function bukanPenghasilan(it) { return /toke/i.test(it); } /* Ikan Basah Toke tidak dihitung sebagai penghasilan */
function hitungLR(k, trip) {
  var r = hitung(k, trip), bel = Math.round((k.belanja && k.belanja[trip]) || 0), p = 0;
  k.items.forEach(function (it, i) { if (!bukanPenghasilan(it)) p += (r.d.nom[i] || 0); });
  p = Math.round(p);
  return { r: r, penghasilan: p, belanja: bel, gaji: Math.round(r.gaji), biaya: bel, laba: p - bel };
}
function labaTxt(v) { return v < 0 ? 'RUGI' : 'LABA'; }
function marginTxt(x) { return x.penghasilan > 0 ? pctNum(x.laba / x.penghasilan) + ' %' : ''; }

/* ---------- Membaca spreadsheet (Google Visualization) ---------- */
function sel(row, i) { var c = row.c && row.c[i]; return c && c.v !== null && c.v !== undefined ? c.v : ''; }
function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
function normTrip(v) {
  var s = String(v).trim().replace(/\s+/g, ' ').toUpperCase();
  return /^\d+$/.test(s) ? 'TRIP ' + s : s;
}

function olah(rows) {
  K.forEach(function (k) {
    var items = [], trips = {};
    rows.forEach(function (row) {
      var ket = String(sel(row, k.c.ket)).trim();
      var trip = normTrip(sel(row, k.c.trip));
      if (!ket || !trip) return;
      if (items.indexOf(ket) < 0) items.push(ket);
      var t = trips[trip] || (trips[trip] = { nom: {}, utang: 0, diambil: 0, ada: false });
      var n = num(sel(row, k.c.nom)), u = num(sel(row, k.c.ut)), d = num(sel(row, k.c.di));
      t.nom[ket] = (t.nom[ket] || 0) + n;
      t.utang += u; t.diambil += d;
      if (n || u || d) t.ada = true;
    });
    var hasil = {};
    Object.keys(trips).forEach(function (name) {
      var t = trips[name];
      if (!t.ada) return;
      hasil[name] = { nom: items.map(function (it) { return t.nom[it] || 0; }), utang: t.utang, diambil: t.diambil };
    });
    k.items = items; k.trips = hasil;
  });
}

function namaValid(n) {
  if (n.length < 3 || n.length > 60) return false;
  if (!/^[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ .'-]*$/.test(n)) return false;
  if (/^(tekong|admin|master|user|test|tes|nama|bos)$/i.test(n)) return false;
  return true;

  if (/Edg\//i.test(ua)) br = 'Edge'; else if (/OPR\//i.test(ua)) br = 'Opera';

  [].forEach.call(document.querySelectorAll('#tabsGaji button'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-t') === t); });
  el('wa').hidden = (t === 'b'); el('wb').hidden = (t === 'a');
}
function muat() {
  if (el('app').hidden) return;
  el('stat').innerHTML = 'Memuat data...';
  Promise.all([
    fetch(URL_DATA + '&t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }),
    fetch(URL_TIER + '&t=' + Date.now()).then(function (r) { return r.ok ? r.text() : null; }).catch(function () { return null; }),
    fetch(URL_BELANJA + '&t=' + Date.now()).then(function (r) { return r.ok ? r.text() : null; }).catch(function () { return null; })
  ])
    .then(function (hs) {
      var j = bacaGviz(hs[0]);
      if (j.status !== 'ok') throw new Error('status');
      olah(j.table.rows);
      if (hs[1]) { try { olahTier(hs[1]); } catch (e) {} }
      if (hs[2]) { try { var jb = bacaGviz(hs[2]); if (jb.status === 'ok') olahBelanja(jb.table.rows); } catch (e) {} }
      isiPilihan(); render(); isiPilihanLR(); renderLR();
      setStatus(true);
    })
    .catch(function () { setStatus(false, 'Offline · menampilkan data tersimpan 20 November 2026'); });
}

/* ---------- Export PDF langsung (tanpa dialog cetak) ---------- */
var LB = { r: { ' ': 250, '%': 833, ',': 250, '-': 333, '.': 250, 'R': 667, 'p': 500 },
           b: { ' ': 250, '%': 1000, ',': 250, '-': 333, '.': 250, 'R': 722, 'p': 556 } };
function lebar(t, b, u) {
  var m = LB[b ? 'b' : 'r'], w = 0;
  for (var i = 0; i < t.length; i++) { var c = t.charAt(i); w += (c >= '0' && c <= '9') ? 500 : (m[c] || 500); }
  return w * u / 1000;
}
function esc(t) { return t.replace(/[\\()]/g, '\\$&'); }
function f2(n) { return n.toFixed(2); }

function halaman(h) {
  var k = h.k, r = h.r, RH = 19, y = 841.89 - 50, s = '';
  function teks(t, x, b, u, rata) {
    if (!t) return;
    var xx = rata === 'r' ? x - lebar(t, b, u) : x;
    var mer = rata === 'r' && t.charAt(0) === '-'; /* minus = merah */
    s += 'BT ' + (mer ? '0.71 0.14 0.09 rg ' : '') + '/' + (b ? 'F2' : 'F1') + ' ' + u + ' Tf ' + f2(xx) + ' ' + f2(y - 13.5) + ' Td (' + esc(t) + ') Tj ' + (mer ? '0 g ' : '') + 'ET\n';
  }
  function kuning() { s += '1 1 0 rg 40 ' + f2(y - RH) + ' 515 ' + RH + ' re f 0 g\n'; }
  function garis(yy) { s += '0.6 w 40 ' + f2(yy) + ' m 555 ' + f2(yy) + ' l S\n'; }
  function petak(x, w) { s += '0.6 w ' + x + ' ' + f2(y - RH) + ' ' + w + ' ' + RH + ' re S\n'; }
  function baris(a, b, c, g) {
    var tebal = /[bth]/.test(g);
    if (/[ht]/.test(g)) kuning();
    if (/t/.test(g)) { garis(y); garis(y - RH); }
    if (/l/.test(g)) garis(y);
    teks(a, 44, tebal, 10.5); teks(b, 375, tebal, 10.5); teks(c, 551, tebal, 10.5, 'r');
    y -= RH;
  }
  function petak3(a, b, c, tebal) {
    petak(40, 330); petak(370, 55); petak(425, 130);
    teks(a, 366, tebal, 10.5, 'r'); teks(b, 421, tebal, 10.5, 'r'); teks(c, 551, tebal, 10.5, 'r');
    y -= RH;
  }
  teks('LAPORAN HASIL KAPAL', 40, 1, 13); y -= 21;
  teks(k.nama, 40, 1, 13); y -= 21;
  teks(h.trip, 40, 1, 13); y -= 24;
  baris('Keterangan', 'Percent %', 'Nominal', 'h');
  k.items.forEach(function (it, i) { baris(it, '', rp(r.d.nom[i]), ''); });
  baris('Total', '', rp(r.total), 't');
  r.hasil.forEach(function (x) { baris(x.lab, pctNum(x.p) + ' %', rp(x.c), ''); });
  baris('Gaji Total', '', rp(r.gaji), 'bl');
  baris('Sisa Utang', '', rp(r.utang), 'b');
  baris('Gaji Sudah Diambil', '', rp(r.diambil), 'b');
  baris('Sisa Gaji', '', rp(r.sisa), 'bl');
  y -= 24;
  kuning(); teks('Hasil', 44, 1, 10.5); teks('Percent %', 375, 1, 10.5); teks('Nominal', 551, 1, 10.5, 'r'); y -= RH;
  r.hasil.forEach(function (x) { petak3(rp2(x.a), pctNum(x.p) + '%', rp(x.c), 0); });
  petak3(rp2(r.total), '', rp(r.gaji), 1);
  y = 58; teks('Dibuat ' + tgl() + ' dari data spreadsheet.', 40, 0, 8);
  return s;
}


function halamanLR(h) {
  var k = h.k, x = h.x, RH = 19, y = 841.89 - 50, s = '';
  function teks(t, px, b, u, rata) {
    if (!t) return;
    var xx = rata === 'r' ? px - lebar(t, b, u) : px;
    s += 'BT /' + (b ? 'F2' : 'F1') + ' ' + u + ' Tf ' + f2(xx) + ' ' + f2(y - RH + 5.5) + ' Td (' + esc(t) + ') Tj ET\n';
  }
  function kuning() { s += '1 1 0 rg 40 ' + f2(y - RH) + ' 515 ' + RH + ' re f 0 g\n'; }
  function abu() { s += '0.93 0.94 0.96 rg 40 ' + f2(y - RH) + ' 515 ' + RH + ' re f 0 g\n'; }
  function garis(yy) { s += '0.6 w 40 ' + f2(yy) + ' m 555 ' + f2(yy) + ' l S\n'; }
  function baris(a, b, c, g) {
    var tebal = /[bth]/.test(g);
    if (/h/.test(g)) kuning();
    if (/t/.test(g)) { kuning(); garis(y); garis(y - RH); }
    if (/s/.test(g)) abu();
    if (/l/.test(g)) garis(y);
    teks(a, 44, tebal || /s/.test(g), 10.5); teks(b, 375, tebal, 10.5); teks(c, 551, tebal, 10.5, 'r');
    y -= RH;
  }
  teks('LAPORAN LABA RUGI', 40, 1, 13); y -= 21;
  teks(k.nama, 40, 1, 13); y -= 21;
  teks(h.rekap ? 'Rekap Per Trip' : h.trip, 40, 1, 13); y -= 24;
  if (!h.rekap) {
  baris('Keterangan', '', 'Nominal', 'h');
  baris('PENGHASILAN', '', '', 's');
  k.items.forEach(function (it, i) { if (!bukanPenghasilan(it)) baris(it, '', rp(x.r.d.nom[i]), ''); });
  baris('Total Penghasilan', '', rp(x.penghasilan), 'bl');
  baris('BIAYA', '', '', 's');
  if (x.belanja > 0) { baris('Belanja (di luar gaji)', '', rp(x.belanja - x.gaji), ''); baris('Gaji Total', '', rp(x.gaji), ''); }
  else baris('Belanja', '', rp(x.belanja), '');
  baris('Total Biaya', '', rp(x.biaya), 'bl');
  baris(labaTxt(x.laba) + ' (Penghasilan - Biaya)', marginTxt(x), rp(x.laba), 't');
  if (!x.belanja) { y -= 4; teks('Catatan: belanja trip ini belum terisi di sheet Belanja.', 44, 0, 8.5); y -= RH; }
  }
  // rekap per trip
  var rk = rekapBaris(k), RR = 19;
  RH = RR;
  function kol(c, g) {
    var tebal = /[bh]/.test(g), pos = [44, 170, 285, 365, 455, 551];
    if (/h/.test(g)) kuning();
    if (/t/.test(g)) { garis(y); garis(y - RR); }
    c.forEach(function (t, i) { teks(t, pos[i], tebal, 9.5, i ? 'r' : undefined); });
    y -= RR;
  }
  function np(v, ada) { return ada === false ? '-' : rp(v); }
  if (h.rekap) {
  kol(['Trip', 'Penghasilan', 'Belanja (di luar gaji)', 'Gaji Total', 'Total Biaya', 'Laba / (Rugi)'], 'h');
  rk.rows.forEach(function (r) {
    if (y < 70) return;
    var x = r.x;
    kol([r.trip, rp(x.penghasilan), np(x.luar, x.isi), np(x.gajiR, x.isi), rp(x.biaya), rp(x.laba)], '');
  });
  kol(['Total', rp(rk.tot.penghasilan), rp(rk.tot.luar), rp(rk.tot.gaji), rp(rk.tot.biaya), rp(rk.tot.laba)], 'bt');
  }
  RH = 19; y = 58; teks('Dibuat ' + tgl() + ' dari data spreadsheet.', 40, 0, 8);
  return s;
}
function eksporLR() {
  if (!isMaster()) return;
  var hal = [];
  K.forEach(function (k) {
    if (kapalBoleh && k.id !== kapalBoleh) return;
    if (tabLR === 'rekap') { hal.push({ lr: true, rekap: true, k: k }); return; }
    if (tabLR !== 'semua' && tabLR !== k.id) return;
    var t = el('l' + k.id).value;
    if (t && k.trips[t]) hal.push({ lr: true, k: k, trip: t, x: hitungLR(k, t) });
  });
  if (!hal.length) return;
  var nama = tabLR === 'rekap' ? 'Rekap_Trip_LabaRugi.pdf' : 'LabaRugi_' + hal.map(function (h) { return h.k.nama.replace(/\s+/g, '_') + '_' + h.trip.replace(/\s+/g, ''); }).join('_dan_') + '.pdf';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buatPdf(hal)], { type: 'application/pdf' }));
  a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}

function buatPdf(hal) {
  var o = [], kids = [];
  o[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  o[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>';
  o[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>';
  hal.map(function (h) { return h.lr ? halamanLR(h) : halaman(h); }).forEach(function (c, i) {
    var p = 5 + i * 2, q = p + 1;
    kids.push(p + ' 0 R');
    o[p] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + q + ' 0 R >>';
    o[q] = '<< /Length ' + c.length + ' >>\nstream\n' + c + '\nendstream';
  });
  o[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + kids.length + ' >>';
  var out = '%PDF-1.4\n', off = [], i;
  for (i = 1; i < o.length; i++) { off[i] = out.length; out += i + ' 0 obj\n' + o[i] + '\nendobj\n'; }
  var xr = out.length;
  out += 'xref\n0 ' + o.length + '\n0000000000 65535 f \n';
  for (i = 1; i < o.length; i++) out += ('0000000000' + off[i]).slice(-10) + ' 00000 n \n';
  return out + 'trailer\n<< /Size ' + o.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
}
