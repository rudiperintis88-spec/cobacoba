<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIKK Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;--ink:#16202e;--muted:#667085;--line:#e3e6ec;--navy:#1b3556;
    --green:#16a34a;--red:#d8281e;--orange:#b45309;--blue:#2563eb;
    --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
    --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
  .top{display:flex;align-items:center;gap:16px;padding:0 28px;height:54px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
  .brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
  nav{display:flex;gap:8px}
  nav button{border:0;background:transparent;font:inherit;font-weight:500;color:#344054;padding:7px 16px;font-size:13.5px;border-radius:99px;cursor:pointer}
  nav button:hover{background:#f2f4f7}
  nav button.on{background:var(--navy);color:#fff;font-weight:600}
  main{max-width:1500px;margin:0 auto;padding:26px 28px 50px}
  [hidden]{display:none!important}
  .head{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  h1{margin:0;font:700 28px/1.15 var(--sans);letter-spacing:-.3px}
  .k .yr{margin-top:8px}
  .k .yd{margin:2px 0 0 0;color:#475467;font-size:12.5px}
  .srcLine{margin-top:8px;color:#475467;font-size:13px}
  .per{margin-top:8px;color:#475467;font-size:13.5px}
  .side{text-align:right;max-width:100%}
  .liveRow{display:flex;gap:14px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .live{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:#475467}
  .live b{color:var(--ink);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #dcf5e4;display:inline-block;flex:none}
  .dot.bad{background:var(--red);box-shadow:0 0 0 3px #fbdedb}
  .dot.load{background:#f59e0b;box-shadow:0 0 0 3px #fdeccb}
  .refresh{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px 7px 8px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
  .refresh .ric{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;font-size:15px}
  .refresh:disabled{opacity:.6;cursor:default}
  .src{margin-top:12px;color:#667085;font-size:15px}
  hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0 18px}
  .alert{margin:0 0 18px;padding:13px 20px;border-radius:12px;font-size:13.5px;background:#fdf1d6;color:#8a5a00}
  .alert.ok{background:#e6f6ec;color:#12683a}
  .alert.err{background:#fdecea;color:#a3231a}
  .alert a{color:inherit;font-weight:600}
  .kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;margin-bottom:24px}
  .k{border:1px solid var(--line);border-radius:16px;padding:16px 20px;background:#fff;min-width:0}
  .k .lab{display:flex;gap:10px;align-items:center;font-size:14px;color:#344054}
  .k .lab i{width:11px;height:11px;border-radius:50%;flex:none}
  .k .num{font:600 24px/1.1 var(--mono);margin:10px 0 6px;letter-spacing:-.5px}
  .k .num small{font-size:15px}
  .k .sub{color:#667085;font-size:12.5px}
  .k.big{grid-row:span 2;display:flex;flex-direction:column}
  .k.big .lab{font:600 14px var(--sans);letter-spacing:.1px}
  .k.big .num{font:600 38px/1.1 var(--mono);letter-spacing:-1px;margin:12px 0 8px}
  .k.big .sub{font:400 13px/1.6 var(--sans);color:#1c2430}
  .k.big .sub span{color:#667085}
  .k.red{background:#fdecea;border-color:#f5c6c1}
  .k.red .num{color:var(--red)}
  .k.org .num{color:var(--orange)}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px;border-top:2px solid #dfe3ea;padding-top:16px}
  .pills button{border:1px solid #cfd5df;background:#fff;color:#475467;font:inherit;font-weight:500;border-radius:99px;padding:7px 16px;cursor:pointer;font-size:13px}
  .pills button:hover{background:#f7f8fb}
  .pills button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .tools input,.tools select,.tools button{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .tools input{min-width:230px}
  .tools #q{order:10;flex:1 1 100%;width:100%;min-width:0}
  .tools select{flex:0 0 auto;width:auto}
  .tools .pi{color:var(--muted);font-size:12.5px}
  .tools button{cursor:pointer;font-weight:600}
  .tools button:disabled{opacity:.5;cursor:default}
  .tbl{border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:70vh}
  table{border-collapse:collapse;table-layout:fixed;min-width:100%;white-space:pre}
  th,td{overflow:hidden;text-overflow:ellipsis}
  th,td{padding:6px 12px;border-bottom:1px solid #eef0f4;text-align:left;font-size:12.5px}
  th{position:sticky;top:0;background:#f4f6fa;z-index:1;font-weight:600;font-size:12px;color:#344054}
  th.p{background:#fff1cf}
  tbody tr:hover td{background:#f9fafc}
  td.mono{font-family:var(--mono);font-size:12px}
  .miss{color:var(--red)}
  .tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid;font-weight:500}
  .tag.sikk{color:#12683a;border-color:#a9d8b8;background:#eaf7ee}
  .tag.wo{color:#1d4ed8;border-color:#b9cdf5;background:#edf3fd}
  .tag.none{color:var(--red);border-color:#f0b7b2;background:#fdeeed}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .pager{display:flex;gap:10px;align-items:center;margin-top:12px}
  .pager button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
  .pager button:disabled{opacity:.45;cursor:default}
  .note{color:var(--muted);font-size:12px;margin-top:16px;max-width:980px}
  th.sortable{cursor:pointer;user-select:none}
  th .ht{margin-right:7px}
  .arr{display:inline-block;font-size:12px;color:#c3c8d3;vertical-align:middle}
  th.sortable:hover .arr{color:#98a2b3}
  th.sorted .arr{color:#6d28d9}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:hidden}
  .modal .mbox{min-width:0;max-width:100%}
  .modal[hidden]{display:none}
  .mbox{background:#fff;border-radius:20px;padding:28px 30px;width:min(540px,100%);box-shadow:0 24px 70px rgba(0,0,0,.28)}
  .mbox h3{margin:0 0 4px;font:400 32px var(--serif)}
  .mbox .mp{margin:0 0 18px;color:var(--muted);font-size:14px}
  .opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .opt.on{border-color:var(--navy);background:#f3f6fb}
  .opt input{margin-top:5px}
  .opt b{display:block;font-weight:600}
  .opt span{color:var(--muted);font-size:13px}
  .mnote{color:var(--orange);font-size:13px;min-height:18px;margin-top:6px}
  .mnote.err{color:var(--red)}
  .mbtn{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .mbtn button{font:inherit;padding:11px 22px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
  .mbtn button.go{background:var(--navy);border-color:var(--navy);color:#fff}
  .mbtn button:disabled{opacity:.6;cursor:default}
  /* ---- halaman login ---- */
  body.locked .top,body.locked main{display:none}
  .gate{position:fixed;inset:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .gate[hidden]{display:none}
  .gbox{width:min(420px,100%);border:1px solid #dcdde6;border-radius:20px;padding:36px 30px 32px;background:#fff}
  .gbox h2{margin:0 0 28px;text-align:center;font:700 30px/1.15 var(--sans);letter-spacing:-.3px}
  .gbox input{width:100%;font:inherit;font-size:16px;text-align:center;padding:16px 44px;border:1px solid #e4e6ec;border-radius:16px;background:#f3f4f6;color:var(--ink);margin-bottom:14px;outline:none}
  .gbox input::placeholder{color:#9aa3b2}
  .gbox input:focus{border-color:#2745d8;background:#fff;box-shadow:0 0 0 4px #dfe5fb}
  .gpw{position:relative}
  .gpw button{position:absolute;right:14px;top:14px;border:0;background:transparent;cursor:pointer;padding:6px;color:#4b5563;line-height:0}
  .gerr{min-height:22px;margin:-4px 0 12px;text-align:center;color:var(--red);font-size:15px}
  .gbtn{width:100%;font:inherit;font-size:16px;font-weight:700;padding:15px;border:0;border-radius:14px;background:#2745d8;color:#fff;cursor:pointer}
  .gbtn:hover{background:#1f39b8}
  .gbtn:disabled{opacity:.65;cursor:default}
  @media (max-width:600px){.gbox{padding:28px 20px 26px}.gbox h2{font-size:24px}.gbox input{padding:14px 36px;font-size:15px}}
  .k.clk{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative}
  .k.clk:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.10);border-color:#b8c2d4}
  .k.clk:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .k .chev{margin-left:auto;font-size:20px;line-height:1;color:#98a2b3}
  .k.clk:hover .chev{color:var(--navy)}
  .pbox{width:min(1300px,100%);max-height:92vh;display:flex;flex-direction:column}
  .pbox{overflow:hidden}
  .pbox .tbl{flex:1 1 auto;max-height:none;min-height:180px;min-width:0;max-width:100%;overflow:auto}
  .pbox .tools{margin:4px 0 10px}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .phead .x{border:0;background:transparent;font-size:34px;line-height:1;cursor:pointer;color:#667085;padding:0 6px}
  .pbox .pager .go{margin-left:auto;background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  @media (max-width:1000px){
    .kpis{grid-template-columns:1fr 1fr}.k.big{grid-column:1/-1;grid-row:auto}
    h1{font-size:24px}.k.big .num{font-size:32px}.side{text-align:left}.liveRow{justify-content:flex-start}
  }
  @media (max-width:600px){
    main{padding:22px 16px 50px}.top{padding:0 14px}.kpis{grid-template-columns:1fr}
    .k .num{font-size:21px}.tools input{min-width:0;width:100%}
  }
</style>

<script>
const FILE_ID = '1D9Hu8RNqkWMa6uJ9EZ0OT4K8eTfh46O32_ttXh3u2to';
const SHEET_SA = 'Data SA';
const BR = [
  { key: 'AM', name: 'GR Adam Malik', sb: 'SB AM', am: 'AM' },
  { key: 'PF', name: 'GR Flamboyan',  sb: 'SB PF', am: 'PF' },
  { key: 'BP', name: 'Body Repair',   sb: 'SB BP', am: 'BP' },
  { key: 'OX', name: 'Otoxpert',      sb: 'SB OX', am: 'OX' }
];
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const REFRESH_MS = 2 * 60 * 1000;
const PAGE = 100;

const sheetUrl = n => 'https://docs.google.com/spreadsheets/d/' + FILE_ID +
  '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(n);
const $ = id => document.getElementById(id);
const norm = s => String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
const val = s => String(s == null ? '' : s).trim();
const fnum = n => Number(n).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const pad = n => String(n).padStart(2, '0');

const S = { cur: 'AM', tab: 'out', page: 0, loading: false, data: {}, sort: {}, memo: null, year: '', month: '' };
const OUTLIKE = ['out', 'nosikk', 'noket', 'both'];     // tab yang memakai susunan kolom Data Terbaru

/* ---------- CSV & Sheet ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c === '\r') { /* skip */ }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
/* Jalur 1: link-sharing (gviz). Jalur 2: "Publikasikan ke web" (link pubhtml). */
const PUB_ID = '2PACX-1vRMbMi2Lkoed_DWOxFPNQjcBhiDFRVqammycjZufOmpFfifrMCgbP1i_ORFFari85ZAXfBC4sM_r5_F';
let pubMap = null;
async function pubSheets() {
  if (pubMap) return pubMap;
  const r = await fetch('https://docs.google.com/spreadsheets/d/e/' + PUB_ID + '/pubhtml');
  if (!r.ok) throw new Error('pubhtml HTTP ' + r.status);
  const t = await r.text();
  const m = new Map(), re = /name:\s*"((?:[^"\\]|\\.)*)"[\s\S]{0,600}?gid:\s*"(\d+)"/g;
  let x;
  while ((x = re.exec(t))) m.set(x[1].replace(/\\x([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16))), x[2]);
  if (!m.size) throw new Error('daftar sheet tidak ditemukan di link publikasi');
  pubMap = m; return m;
}
async function readSheet(name) {
  let why = '';
  try {                                                   // jalur 1
    const r = await fetch(sheetUrl(name));
    if (r.ok) {
      const t = await r.text();
      if (!t.trim().startsWith('<')) return parseCSV(t);
      why = 'file belum dibagikan ke publik';
    } else why = 'HTTP ' + r.status;
  } catch (e) { why = 'diblokir browser / file belum dibagikan ke publik'; }
  try {                                                   // jalur 2
    const m = await pubSheets();
    if (!m.has(name)) throw new Error('sheet tidak ada di link publikasi');
    const r = await fetch('https://docs.google.com/spreadsheets/d/e/' + PUB_ID + '/pub?gid=' + m.get(name) + '&single=true&output=csv');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    if (t.trim().startsWith('<')) throw new Error('bukan CSV');
    return parseCSV(t);
  } catch (e2) {
    throw new Error('Sheet "' + name + '" tidak bisa dibaca (' + why + '; link publikasi: ' + e2.message + '). ' +
      'Solusi: di Google Sheet pilih Bagikan > "Siapa saja yang memiliki link" (Pelihat), atau File > Bagikan > Publikasikan ke web (seluruh dokumen).');
  }
}
function colIdx(header, ...names) {
  const h = header.map(norm);
  for (const n of names) { const i = h.indexOf(norm(n)); if (i >= 0) return i; }
  return -1;
}
function colStarts(header, prefix) { return header.map(norm).findIndex(x => x.startsWith(norm(prefix))); }
function need(i, nm, sh) { if (i < 0) throw new Error('Kolom "' + nm + '" tidak ditemukan di ' + (sh === SHEET_SA ? 'sheet ' + sh : 'Data Sebelumnya')); return i; }
const dateOf = s => val(s).split(' ')[0];
const dmy = s => { const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s || '')); return m ? { d: +m[1], m: +m[2], y: +m[3] } : null; };

/* tanggal -> DD/MM/YYYY (hanya bila isinya memang tanggal; selain itu dibiarkan apa adanya) */
const MON3 = { jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, aug: 8, ags: 8, sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12 };

  const tm = '(?:[ T]+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?(?:\\.\\d+)?\\s*(?:Z|[+-]\\d{2}:?\\d{2})?)?$';

  if ((m = new RegExp('^(\\d{1,2})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{4})' + tm).exec(t))) { d = +m[1]; mo = +m[2]; y = +m[3]; hm = m.slice(4); }
  else if ((m = new RegExp('^(\\d{4})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{1,2})' + tm).exec(t))) { y = +m[1]; mo = +m[2]; d = +m[3]; hm = m.slice(4); }
  else if ((m = new RegExp('^(\\d{1,2})[ \\-]([A-Za-z]{3,})\\.?[ \\-,]+(\\d{4})' + tm).exec(t))) { mo = MON3[m[2].slice(0, 3).toLowerCase()]; d = +m[1]; y = +m[3]; hm = m.slice(4); }
  else return null;
  if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
  const hh = hm[0] != null ? +hm[0] : null, mi = hm[1] != null ? +hm[1] : 0, ss = hm[2] != null ? +hm[2] : null;

  const t = String(v == null ? '' : v).trim(); const p = parseTgl(t); if (!p) return t;

}

/* No Polisi dikunci ke format baku: wilayah 2 kolom, nomor 4 kolom (rata kiri), seri.
   Contoh: "BK 1    RHS", "BK 11   SRG", "B  1039 FIO", "BK 878  YA". Yang tidak sesuai pola dibiarkan apa adanya. */
function fmtPol(v) {
  const raw = String(v == null ? '' : v);
  const m = /^\s*([A-Za-z]{1,2})\s*(\d{1,4})\s*([A-Za-z]{0,3})\s*$/.exec(raw);

}

/* ---------- Susun AM seperti SB ---------- */
function build(d, br, sb, am, sa) {
  const saH = sa[0];
  const saCode = need(colIdx(saH, 'Advisor'), 'Advisor', SHEET_SA);
  const saName = need(colIdx(saH, 'Nama Advisor'), 'Nama Advisor', SHEET_SA);
  const saMap = new Map();
  for (let i = 1; i < sa.length; i++) {
    const k = norm(sa[i][saCode]); if (k && !saMap.has(k)) saMap.set(k, val(sa[i][saName]));
  }

  const sbH = sb[0];
  const T = {
    tglWO: need(colIdx(sbH, 'TglWO'), 'TglWO', br.sb),
    wo: need(colIdx(sbH, 'No WO'), 'No WO', br.sb),
    sikkTgl: need(colIdx(sbH, 'SIKK Tgl'), 'SIKK Tgl', br.sb),
    sikkNo: need(colIdx(sbH, 'SIKK No'), 'SIKK No', br.sb),
    ket: need(colIdx(sbH, 'Keterangan'), 'Keterangan', br.sb),
    fisik: need(colIdx(sbH, 'Fisik SIKK'), 'Fisik SIKK', br.sb),
    keluar: need(colStarts(sbH, 'Tgl Keluar'), 'Tgl Keluar', br.sb),
    namaAdv: colIdx(sbH, 'Nama Advisor')
  };
  T.p = T.keluar + 1;   // kolom P (tanpa judul) = kolom setelah Tgl Keluar

  const sikk1 = new Map(), sikk2 = new Map(), wo1 = new Map(), wo2 = new Map();
  for (let i = 1; i < sb.length; i++) {
    const r = sb[i];
    const sn = val(r[T.sikkNo]), wn = val(r[T.wo]);
    if (sn) {
      if (!sikk1.has(sn)) sikk1.set(sn, r);
      const k2 = sn + '|' + dateOf(r[T.sikkTgl]); if (!sikk2.has(k2)) sikk2.set(k2, r);
    }
    if (wn) {
      if (!wo1.has(wn)) wo1.set(wn, r);
      const k2 = wn + '|' + val(r[T.tglWO]); if (!wo2.has(k2)) wo2.set(k2, r);
    }
  }

  const amH = am[0];
  const A = {
    no: colIdx(amH, 'No'),
    tglWO: need(colIdx(amH, 'TglWO'), 'TglWO', br.am),
    pol: need(colIdx(amH, 'NoPolisi'), 'NoPolisi', br.am),
    wo: need(colIdx(amH, 'No WO'), 'No WO', br.am),
    adv: need(colIdx(amH, 'Advisor'), 'Advisor', br.am),
    nama: need(colIdx(amH, 'Nama'), 'Nama', br.am),
    sikkTgl: need(colIdx(amH, 'SIKK Tgl'), 'SIKK Tgl', br.am),
    sikkNo: need(colIdx(amH, 'SIKK No'), 'SIKK No', br.am),
    out: need(colIdx(amH, 'Vhc Out'), 'Vhc Out', br.am),
    sat: need(colIdx(amH, 'Satpam'), 'Satpam', br.am),
    op: need(colIdx(amH, 'Operator'), 'Operator', br.am)
  };

  const pHead = val(sbH[T.p]) || 'Kolom P';
  const head = ['No', 'TglWO', 'NoPolisi', 'No WO', 'Advisor', 'Nama Advisor', 'Nama',
    'SIKK Tgl', 'SIKK No', 'Vhc Out', 'Satpam', 'Operator',
    val(sbH[T.ket]), val(sbH[T.fisik]), val(sbH[T.keluar]), pHead, 'Sumber'];

  const out = [];
  const stat = { total: 0, sikk: 0, wo: 0, none: 0, advMiss: 0, pFill: 0, years: {}, yd: {}, latest: null };
  for (let i = 1; i < am.length; i++) {
    const r = am[i];
    if (r.every(x => val(x) === '')) continue;
    const sn = val(r[A.sikkNo]), wn = val(r[A.wo]);
    let m = null, src = 'NONE';
    if (sn) {
      m = sikk2.get(sn + '|' + dateOf(r[A.sikkTgl])) || sikk1.get(sn);
      if (m) src = 'SIKK';
    }
    if (!m && wn) {
      m = wo2.get(wn + '|' + val(r[A.tglWO])) || wo1.get(wn);
      if (m) src = 'WO';
    }
    const adv = val(r[A.adv]);
    let advName = saMap.get(norm(adv)) || '';
    if (!advName && m && T.namaAdv >= 0) advName = val(m[T.namaAdv]);   // cadangan: dari SB bila tidak ada di Data SA
    const row = [
      A.no >= 0 ? val(r[A.no]) : String(out.length + 1),
      val(r[A.tglWO]), fmtPol(r[A.pol]), wn, adv, advName, val(r[A.nama]),
      val(r[A.sikkTgl]), sn, val(r[A.out]), val(r[A.sat]), val(r[A.op]),
      m ? val(m[T.ket]) : '', m ? val(m[T.fisik]) : '', m ? fmtTgl(val(m[T.keluar])) : '', m ? fmtTgl(val(m[T.p])) : '',
      src
    ];
    out.push(row);
    stat.total++;
    if (src === 'SIKK') stat.sikk++; else if (src === 'WO') stat.wo++; else stat.none++;
    if (!advName) stat.advMiss++;
    if (row[15]) stat.pFill++;
    const dt = dmy(r[A.tglWO]);
    if (dt) { stat.years[dt.y] = (stat.years[dt.y] || 0) + 1; const q = stat.yd[dt.y] || (stat.yd[dt.y] = { sikk: 0, wo: 0, none: 0 }); if (src === 'SIKK') q.sikk++; else if (src === 'WO') q.wo++; else q.none++; }
    const ds = dmy(r[A.sikkTgl]) || dt;
    if (ds) {
      const t = Date.UTC(ds.y, ds.m - 1, ds.d);
      if (!stat.latest || t > stat.latest.t) stat.latest = { t, d: ds.d, m: ds.m, y: ds.y };
    }
  }
  // Database = sheet AM + Nama Advisor (12 kolom pertama); Data Terbaru = Database + kolom M-P dari SB AM
  d.db = { head: head.slice(0, 12), rows: out.map(r => r.slice(0, 12)) };
  d.sbTgl = T.tglWO;                      // posisi kolom TglWO di sheet SB (untuk pilihan periode)
  d.nosikk = out.filter(r => !r[8]);     // belum ada No SIKK
  d.noket = out.filter(r => !r[12]);     // belum ada Keterangan
  d.both = out.filter(r => !r[8] && !r[12]);   // belum ada No SIKK dan belum ada Keterangan
  const fx = [T.keluar, T.p].filter(i => i >= 0);   // Data Sebelumnya apa adanya, hanya kolom Tgl Keluar & kolom P dirapikan ke DD/MM/YYYY
  sb = sb.map((r, i) => { if (!i) return r; const c = r.slice(); fx.forEach(k => { if (c[k] != null) c[k] = fmtTgl(c[k]); }); return c; });
  d.sb = sb; d.am = am; d.sa = sa; d.out = out; d.head = head; d.stat = stat;
}

async function loadBranch(key) {
  if (S.loading) return;
  S.loading = true; render();
  const br = BR.find(b => b.key === key);
  const d = S.data[key] || (S.data[key] = {});
  const res = await Promise.allSettled([br.sb, br.am, SHEET_SA].map(readSheet));
  d.synced = res.filter(r => r.status === 'fulfilled').length; d.n = 3;
  d.names = [br.sb, br.am, SHEET_SA];
  if (d.synced < 3) {
    d.err = res.find(r => r.status === 'rejected').reason.message;
  } else {
    await new Promise(r => setTimeout(r, 20));
    try { build(d, br, res[0].value, res[1].value, res[2].value); d.err = ''; d.at = new Date(); }
    catch (e) { d.err = e.message; }
  }
  S.loading = false; render();
}

/* ---------- Pilihan periode (tahun / bulan, berdasarkan kolom TglWO) ---------- */
function periodLabel() { return [S.month ? MONTHS[+S.month - 1] : '', S.year].filter(Boolean).join(' '); }
function inPeriod(tgl) {
  if (!S.year && !S.month) return true;
  const m = dmy(tgl); if (!m) return false;
  if (S.year && String(m.y) !== S.year) return false;
  if (S.month && String(m.m) !== S.month) return false;
  return true;
}
function statOf(rows) {
  const s = { total: 0, sikk: 0, wo: 0, none: 0, advMiss: 0, pFill: 0, years: {}, yd: {}, latest: null };
  for (const r of rows) {
    s.total++;
    if (r[16] === 'SIKK') s.sikk++; else if (r[16] === 'WO') s.wo++; else s.none++;
    if (!r[5]) s.advMiss++;
    if (r[15]) s.pFill++;
    const dt = dmy(r[1]); if (dt) { s.years[dt.y] = (s.years[dt.y] || 0) + 1; const q = s.yd[dt.y] || (s.yd[dt.y] = { sikk: 0, wo: 0, none: 0 }); if (r[16] === 'SIKK') q.sikk++; else if (r[16] === 'WO') q.wo++; else q.none++; }
    const ds = dmy(r[7]) || dt;
    if (ds) { const t = Date.UTC(ds.y, ds.m - 1, ds.d); if (!s.latest || t > s.latest.t) s.latest = { t, d: ds.d, m: ds.m, y: ds.y }; }
  }
  return s;
}
const SC = { sig: '', v: null };
function scoped() {           // data cabang yang sedang dibuka, sudah dipersempit sesuai periode terpilih
  const d = S.data[S.cur];
  if (!d || !d.out) return d || {};
  if (!S.year && !S.month) return d;
  const sig = [S.cur, d.at && d.at.getTime(), S.year, S.month].join('|');
  if (SC.sig === sig && SC.v) return SC.v;
  const out = d.out.filter(r => inPeriod(r[1]));
  const v = Object.assign({}, d, {
    out, nosikk: out.filter(r => !r[8]), noket: out.filter(r => !r[12]), both: out.filter(r => !r[8] && !r[12]),
    db: { head: d.db.head, rows: d.db.rows.filter(r => inPeriod(r[1])) },
    sb: [d.sb[0]].concat(d.sb.slice(1).filter(r => inPeriod(r[d.sbTgl]))),
    stat: statOf(out)

  SC.sig = sig; SC.v = v; return v;

function curView(full) {
  const d = full ? S.data[S.cur] : scoped();
  if (!d || !d.out) return { head: [], rows: [] };
  if (S.tab === 'out') return { head: d.head, rows: d.out };
  if (S.tab === 'nosikk') return { head: d.head, rows: d.nosikk };
  if (S.tab === 'noket') return { head: d.head, rows: d.noket };
  if (S.tab === 'both') return { head: d.head, rows: d.both };
  if (S.tab === 'db') return d.db;
  const src = S.tab === 'prev' ? d.sb : d.sa;
  return { head: src[0].map(val), rows: src.slice(1).filter(r => r.some(x => val(x) !== '')) };
}
function filteredRaw() {
  const v = curView();
  const q = norm($('q').value);
  let rows = v.rows;
  if (OUTLIKE.includes(S.tab)) {
    const fs = $('fSrc').value, fa = $('fAdv').value, fp = $('fP').value;
    if (fs || fa || fp) rows = rows.filter(r => {
      if (fs && r[16] !== fs) return false;
      if (fa === 'MISS' && r[5]) return false;
      if (fp === 'FILLED' && !r[15]) return false;
      return true;
    });
  }
  if (q) rows = rows.filter(r => r.join(' ').toLowerCase().includes(q));
  const so = S.sort[S.tab];
  if (so) rows = sortRows(rows, so.c, so.dir);
  return { head: v.head, rows };
}
function filtered() {            // hasil disimpan sementara agar pindah halaman tidak mengurutkan ulang
  const d = S.data[S.cur] || {};
  const sig = [S.cur, S.tab, d.at && d.at.getTime(), JSON.stringify(S.sort[S.tab] || null),
    $('q').value, $('fSrc').value, $('fAdv').value, $('fP').value, S.year, S.month].join('§');
  if (S.memo && S.memo.sig === sig) return S.memo.v;
  const v = filteredRaw(); S.memo = { sig, v }; return v;

/* ---------- Pengurutan kolom ---------- */
/* ---------- Lebar kolom tetap: mengikuti teks terpanjang di seluruh data ---------- */
const WCACHE = {};
let MCTX;
function meas(s, bold) {
  if (MCTX === undefined) { try { MCTX = document.createElement('canvas').getContext('2d') || null; } catch (e) { MCTX = null; } }
  if (!MCTX) return String(s).length * 7.6 * (bold ? 1.06 : 1);
  MCTX.font = (bold ? '600 12px ' : '12.5px ') + '"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif';
  return MCTX.measureText(String(s)).width;
}
function widthsFor(tab) {
  const d = S.data[S.cur] || {};
  const base = OUTLIKE.includes(tab) ? 'out' : tab;
  const key = S.cur + '|' + base + '|' + (d.at ? d.at.getTime() : 0);
  if (WCACHE[key]) return WCACHE[key];
  const keep = S.tab; S.tab = base;
  let v; try { v = curView(true); } finally { S.tab = keep; }     // lebar kolom dari seluruh data, tidak terpengaruh periode
  const W = v.head.map((h, c) => {
    let mx = String(h).length;
    for (const r of v.rows) { const n = r[c] == null ? 0 : String(r[c]).length; if (n > mx) mx = n; }
    let cell = 0, seen = 0;
    for (const r of v.rows) {                         // ukur hanya teks yang terpanjang (cepat)
      const s = r[c] == null ? '' : String(r[c]);
      if (s.length >= mx - 2 && s.length > 0) { cell = Math.max(cell, meas(s)); if (++seen >= 12) break; }
    }
    if (base === 'out' && c === 16) cell = Math.max(cell, 96);          // label Sumber (tag)
    const head = meas(h, true) + 24;                                    // judul + panah urut
    return Math.min(420, Math.max(64, Math.ceil(Math.max(cell, head)) + 32));
  });
  WCACHE[key] = W; return W;
}
const COLL = new Intl.Collator('id', { numeric: true, sensitivity: 'base' });
const RE_DATE = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/;
function sortRows(rows, c, dir) {
  const sample = [];
  for (const r of rows) { const v = val(r[c]); if (v) { sample.push(v); if (sample.length >= 60) break; } }
  let type = 's';
  if (sample.length && sample.every(v => RE_DATE.test(v))) type = 'd';
  else if (sample.length && sample.every(v => /^-?\d+([.,]\d+)?$/.test(v) && !/^-?0\d/.test(v))) type = 'n';

    v = val(v);
    if (type === 'd') { const m = RE_DATE.exec(v); return m ? Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) : 0; }
    if (type === 'n') return parseFloat(v.replace(',', '.'));
    return v;
  };
  const k = rows.map(r => ({ r, k: keyOf(r[c]), b: val(r[c]) === '' }));
  const sg = dir === 'desc' ? -1 : 1;
  k.sort((a, b) => {
    if (a.b !== b.b) return a.b ? 1 : -1;          // sel kosong selalu di bawah
    if (a.b) return 0;
    const x = type === 's' ? COLL.compare(a.k, b.k) : a.k - b.k;
    return sg * x;

}

/* ---------- Export PDF & Excel (langsung unduh, tanpa dialog cetak) ---------- */
const TAB_LABEL = { prev: 'Data Sebelumnya', db: 'Database', out: 'Data Terbaru', nosikk: 'Belum Ada No SIKK', noket: 'Belum Ada Keterangan', both: 'Tanpa No SIKK & Keterangan', sa: SHEET_SA };
const TAB_ORDER = ['prev', 'db', 'out', 'nosikk', 'noket', 'both', 'sa'];
const SRC_TXT = { SIKK: 'SIKK No', WO: 'No WO', NONE: 'Tidak ketemu' };
const PDF_MAX = 5000;

function exportItem(tab, active) {        // active = ikut filter, pencarian dan urutan tab yang sedang dibuka
  const keep = S.tab; S.tab = tab;
  try {
    const v = active ? filtered() : curView();
    const head = v.head.slice();
    const numNo = head[0] === 'No';
    const rows = v.rows.map((r, ri) => head.map((_, i) => {
      const c = (i === 0 && numNo) ? ri + 1 : (r[i] == null ? '' : r[i]);
      return (OUTLIKE.includes(tab) && i === 16) ? (SRC_TXT[c] || c) : c;
    }));
    if (OUTLIKE.includes(tab)) head[16] = 'Sumber Data';
    return { tab, title: TAB_LABEL[tab], head, rows };
  } finally { S.tab = keep; }
}
function stamp() { const a = new Date(); return a.getFullYear() + pad(a.getMonth() + 1) + pad(a.getDate()) + '_' + pad(a.getHours()) + pad(a.getMinutes()); }
function fileBase(scope) { const br = BR.find(b => b.key === S.cur); return 'SIKK_' + br.name.replace(/\s+/g, '_') + '_' + (scope === 'all' ? 'Semua_Tab' : TAB_LABEL[S.tab].replace(/\s+/g, '_')) + (periodLabel() ? '_' + periodLabel().replace(/\s+/g, '_') : '') + '_' + stamp(); }

function exportPDF(items, scope) {
  const J = window.jspdf;
  if (!J || !J.jsPDF) throw new Error('Library PDF belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
  const br = BR.find(b => b.key === S.cur);
  const doc = new J.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3', compress: true });
  if (typeof doc.autoTable !== 'function') throw new Error('Plugin tabel PDF belum termuat. Muat ulang halaman.');
  const now = new Date();
  const when = now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear() + ', ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  items.forEach((it, idx) => {
    if (idx > 0) doc.addPage();
    const cut = it.rows.length > PDF_MAX;
    const body = cut ? it.rows.slice(0, PDF_MAX) : it.rows;
    doc.setFontSize(15); doc.setTextColor(22, 32, 46);
    doc.text('SIKK ' + br.name + ' - ' + it.title, 10, 13);
    doc.setFontSize(9); doc.setTextColor(102, 112, 133);
    doc.text('Dicetak ' + when + (periodLabel() ? '  |  Periode ' + periodLabel() : '') + '  |  ' + fnum(it.rows.length) + ' baris' +
      (cut ? '  (PDF dibatasi ' + fnum(PDF_MAX) + ' baris pertama, gunakan Export Excel untuk data lengkap)' : ''), 10, 18.5);
    doc.autoTable({
      head: [it.head], body, startY: 22,
      styles: { fontSize: 6.5, cellPadding: 1.1, overflow: 'ellipsize' },
      headStyles: { fillColor: [27, 53, 86], textColor: 255, fontSize: 6.8 },
      alternateRowStyles: { fillColor: [247, 249, 252] },
      margin: { left: 10, right: 10, top: 14, bottom: 12 }
    });
  });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    doc.text('Halaman ' + i + ' / ' + n, 410, 291, { align: 'right' });
  }
  doc.save(fileBase(scope) + '.pdf');
}

function exportXLS(items, scope) {
  if (typeof XLSX === 'undefined') throw new Error('Library Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
  const wb = XLSX.utils.book_new();
  items.forEach(it => {
    const ws = XLSX.utils.aoa_to_sheet([it.head].concat(it.rows));
    // sel kosong benar-benar dikosongkan (teks "" dihitung Excel sebagai terisi saat kolom di-blok)
    Object.keys(ws).forEach(k => { if (k[0] !== '!' && ws[k].t === 's' && ws[k].v === '') delete ws[k]; });
    // semua sel berisi tanggal (dengan atau tanpa jam) jadi tanggal asli Excel, bukan teks; kolom No jadi angka
    const numCols = [];
    it.head.forEach((h, c) => { if (String(h).trim() === 'No') numCols.push(c); });
    for (let r = 1; r <= it.rows.length; r++) {
      for (let c = 0; c < it.head.length; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (!cell || cell.t !== 's') continue;
        if (numCols.includes(c)) { if (/^\d+$/.test(cell.v)) { cell.t = 'n'; cell.v = +cell.v; delete cell.w; } continue; }
        const p = parseTgl(cell.v); if (!p) continue;
        let ser = Date.UTC(p.y, p.m - 1, p.d) / 86400000 + 25569;
        if (p.hh != null) ser += (p.hh * 3600 + p.mi * 60 + (p.ss || 0)) / 86400;
        cell.t = 'n'; cell.v = ser; delete cell.w;
        cell.z = p.hh != null ? (p.ss != null ? 'dd/mm/yyyy hh:mm:ss' : 'dd/mm/yyyy hh:mm') : 'dd/mm/yyyy';
      }
    }
    ws['!cols'] = it.head.map(h => ({ wch: Math.min(34, Math.max(11, String(h).length + 3)) }));
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(1, it.rows.length), c: Math.max(0, it.head.length - 1) } }) };
    XLSX.utils.book_append_sheet(wb, ws, it.title);
  });
  XLSX.writeFile(wb, fileBase(scope) + '.xlsx');
}

function _ambilPerangkat(){var ua=navigator.userAgent||'';var os='Tidak diketahui';if(/Windows/i.test(ua))os='Windows';else if(/Android/i.test(ua))os='Android';else if(/iPhone|iPad|iPod/i.test(ua))os='iOS';else if(/Macintosh|Mac OS/i.test(ua))os='Mac';else if(/Linux/i.test(ua))os='Linux';var br='Tidak diketahui';if(/Edg\//i.test(ua))br='Edge';else if(/OPR\//i.test(ua))br='Opera';else if(/Chrome\//i.test(ua)&&!/Chromium/i.test(ua))br='Chrome';else if(/Firefox\//i.test(ua))br='Firefox';else if(/Safari\//i.test(ua)&&!/Chrome/i.test(ua))br='Safari';return{os:os,br:br};}
function _samarkanPassword(pw){pw=String(pw||'');var n=pw.length;if(!n)return '';if(n<=4)return pw[0]+'*'.repeat(n-1);return pw.slice(0,2)+'*'.repeat(n-4)+pw.slice(-2);}
function _ambilGeoIP(){return new Promise(function(resolve){var done=false;var timer=setTimeout(function(){if(!done){done=true;resolve({});}},2500);fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(d){if(done)return;done=true;clearTimeout(timer);resolve({ip:d.ip||'-',negara:d.country_name||'-',kota:d.city||'-',lat:(d.latitude!=null?d.latitude:''),lng:(d.longitude!=null?d.longitude:'')});}).catch(function(){if(!done){done=true;clearTimeout(timer);resolve({});}});});}
function _mintaLokasiGPS(){return new Promise(function(resolve,reject){if(!navigator.geolocation){reject('nogeo');return;}navigator.geolocation.getCurrentPosition(function(pos){resolve({lat:pos.coords.latitude,lng:pos.coords.longitude});},function(err){reject(err);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});});}
function _isMobileDevice(){return /Android|iPhone|iPad|iPod|Mobile|Windows Phone|BlackBerry|webOS/i.test(navigator.userAgent||'');}
function _alamatDariKoordinat(lat,lng){return fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1',{headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(d){var a=d.address||{};return{alamat:d.display_name||'-',negara:a.country||'-',kota:a.city||a.town||a.village||a.county||a.regency||'-'};}).catch(function(){return{alamat:'-',negara:'-',kota:'-'};});}
function _getDeviceId(){try{var id=localStorage.getItem('pp_device_id');if(!id||id==='undefined'||id==='null'){id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);localStorage.setItem('pp_device_id',id);}return id;}catch(e){return 'no-storage-'+Date.now()+'-'+Math.random().toString(36).slice(2);}}
function _cekPerangkatSekali(nama,cabang,urlScript){return new Promise(function(resolve){var id=_getDeviceId();var cbName='_devcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);var done=false;var script=document.createElement('script');var timer=setTimeout(function(){if(!done){done=true;cleanup();resolve(null);}},9000);function cleanup(){clearTimeout(timer);try{delete window[cbName];}catch(e){window[cbName]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);}window[cbName]=function(data){if(done)return;done=true;cleanup();resolve(data||null);};script.src=urlScript+'?action=cek&device='+encodeURIComponent(id)+'&nama='+encodeURIComponent(nama)+'&cabang='+encodeURIComponent(cabang)+'&callback='+cbName;script.onerror=function(){if(!done){done=true;cleanup();resolve(null);}};document.body.appendChild(script);});}
function _cekPerangkat(nama,cabang,urlScript){return _cekPerangkatSekali(nama,cabang,urlScript).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){return r||{status:'error'};});}
function sendLoginNotif(nama, cabang, pwTyped, loc){
  var _dev = _ambilPerangkat();
  _ambilGeoIP().then(function(geo){
    if(loc){geo.lat=loc.lat;geo.lng=loc.lng;if(loc.negara)geo.negara=loc.negara;if(loc.kota)geo.kota=loc.kota;}
    try {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ nama: nama, status: 'Berhasil', password: _samarkanPassword(pwTyped), cabang: cabang, link: location.href, akses: 'Akses Dashboard', perangkat: _dev.os, browser: _dev.br, ip: geo.ip||'-', negara: geo.negara||'-', kota: geo.kota||'-', lat: geo.lat||'', lng: geo.lng||'', alamat: (loc&&loc.alamat)||'-', waktu: new Date().toISOString() })
      });
    } catch (e) {}
  });
}

function sha256(str) {                        // cadangan bila crypto.subtle tidak tersedia (mis. halaman http)
  const K = [], H = [];
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  let p = 0;
  for (let c = 2; p < 64; c++) {
    let prime = true; for (let i = 2; i * i <= c; i++) if (c % i === 0) { prime = false; break; }
    if (prime) { if (p < 8) H[p] = (Math.pow(c, .5) * 4294967296) | 0; K[p++] = (Math.pow(c, 1 / 3) * 4294967296) | 0; }
  }
  const b = Array.from(new TextEncoder().encode(str)), bl = b.length * 8;
  b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  for (let i = 7; i >= 0; i--) b.push(i > 3 ? 0 : (bl >>> (i * 8)) & 255);
  for (let o = 0; o < b.length; o += 64) {
    const w = [];
    for (let i = 0; i < 16; i++) w[i] = (b[o + i * 4] << 24) | (b[o + i * 4 + 1] << 16) | (b[o + i * 4 + 2] << 8) | b[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function hashPw(s) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* pakai cadangan */ }
  return sha256(s);
}
function nameError(raw) {
  const n = String(raw || '').trim().replace(/\s+/g, ' ');
  const words = n.split(' ').filter(Boolean);
  if (!/^[\p{L}.'-]+(?: [\p{L}.'-]+)+$/u.test(n) || words.length < 2 || n.replace(/[^\p{L}]/gu, '').length < 4)
    return 'Isi nama lengkap Anda (minimal 2 kata, hanya huruf).';
  const low = n.toLowerCase();
  if (NAME_BLOCK.some(k => low.split(/[\s.'-]+/).includes(k)) || /adam\s+malik|body\s+repair/.test(low))
    return 'Isi dengan nama orang, bukan nama dashboard atau cabang.';
  return '';
}
function getAuth() { try { const j = JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); return j && j.n ? j : null; } catch (e) { return null; } }
function setAuth(n) { try { sessionStorage.setItem(AUTH_KEY, JSON.stringify({ n, t: Date.now() })); } catch (e) { /* abaikan */ } }
function clearAuth() { try { sessionStorage.removeItem(AUTH_KEY); } catch (e) { /* abaikan */ } }

let started = false;
function startApp() {
  const a = getAuth();
  $('gate').hidden = true; document.body.classList.remove('locked');
  if (started) return; started = true;
  render();
  loadBranch(S.cur);                                               // baca otomatis saat dibuka
  setInterval(() => { if (!S.loading && $('gate').hidden) loadBranch(S.cur); }, REFRESH_MS);   // perbarui otomatis tiap 2 menit
}
function showGate() {
  document.body.classList.add('locked'); $('gate').hidden = false;
  $('gPw').value = ''; $('gErr').textContent = ''; $('gBtn').disabled = false;
  setTimeout(() => { try { $('gName').focus(); } catch (e) { /* abaikan */ } }, 30);
}
$('gEye').addEventListener('click', () => {
  const show = $('gPw').type === 'password';
  $('gPw').type = show ? 'text' : 'password';
  $('gEye').setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  $('gEyeIc').style.opacity = show ? '.6' : '1';
});
$('gform').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('gName').value.trim().replace(/\s+/g, ' '), pw = $('gPw').value;
  const ne = nameError(name);
  if (ne) { $('gErr').textContent = ne; $('gName').focus(); return; }
  if (!pw) { $('gErr').textContent = 'Password belum diisi.'; $('gPw').focus(); return; }
  $('gBtn').disabled = true; $('gErr').textContent = '';
  const h = await hashPw(pw);
  if (h !== PW_HASH) {
    $('gBtn').disabled = false; $('gErr').textContent = 'Password salah.'; $('gPw').value = ''; $('gPw').focus(); return;
  }
  $('gErr').textContent = 'Memeriksa perangkat...';
  const _devChk = await _cekPerangkat(name, CABANG_NAME, APPS_SCRIPT_URL);
  if (_devChk.status !== 'approved') {
    $('gBtn').disabled = false;
    $('gErr').textContent = _devChk.status === 'pending' ? 'Perangkat ini belum disetujui admin. Permintaan sudah dikirim, coba Masuk lagi setelah disetujui.'
      : (_devChk.status === 'rejected' ? 'Perangkat ini ditolak admin.' : 'Tidak bisa menghubungi server. Coba lagi.');
    return;
  }
  let _loc = null;
  if (_isMobileDevice()) {
    $('gErr').textContent = 'Meminta izin lokasi...';
    try {
      const _gps = await _mintaLokasiGPS();
      const _geo = await _alamatDariKoordinat(_gps.lat, _gps.lng);
      _loc = { lat: _gps.lat, lng: _gps.lng, alamat: _geo.alamat, negara: _geo.negara, kota: _geo.kota };
    } catch (gpsErr) {
      $('gBtn').disabled = false; $('gErr').textContent = 'Izin lokasi diperlukan untuk login. Mohon izinkan akses lokasi, lalu coba lagi.'; return;
    }
  }
  sendLoginNotif(name, CABANG_NAME, pw, _loc);
  $('gErr').textContent = '';
  setAuth(name); startApp();
});

clearAuth(); showGate(); // login diminta setiap kali halaman dibuka/reload
</script>
