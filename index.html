<script>
// URL "Publish to web" (File > Share > Publish to web) untuk sheet "Piutang GR & BP", Sheet1 (gid=0).
// Kalau data yang tampil ternyata basi, buka sheet-nya lalu: File > Share > Publish to web > Republish.
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTM7G5Mv4eC4DN3u_xkvUBCu3LYgZxMIEq0lY9QOKykZudX02ANnM0-2GwxtQ28gJjEEzThOWWj__Az/pub?gid=0&single=true&output=csv";

var MONTH_NAMES = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var MONTH_FULL_ID = ['','januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
var NAME_MAP = {
  'PT . ASURANSI MSIG INDONESIA': 'PT. ASURANSI MSIG INDONESIA',
  'PERINTIS PERKASA,PT': 'PERINTIS PERKASA, PT'
};

var autoTimer = null;
var lastData = null;
var currentDivisi = null;
var currentTab = 'debitur';
var searchQuery = '';
var openDebtorKeys = {}, openCabangKeys = {};
var FIXED_DIVISI = 'Body Repair'; // kosong = semua divisi; isi nama divisi = dashboard khusus divisi itu
var sortKey = 'tgljto', sortDir = 1; // default: Tgl Jto terlama dulu, lalu Hari terbesar

function rupiah(n){ return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
function numId(n){ return Math.round(n).toLocaleString('id-ID'); }
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}

// Robust CSV parser (handles quoted fields with commas)
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function parseAmount(s) {
  if (!s) return 0;
  s = s.trim().replace(/\./g, '').replace(/,/g, '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseDateDDMMYYYY(s) {
  if (!s) return null;
  const m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  return { day: parseInt(m[1]), month: parseInt(m[2]), year: parseInt(m[3]) };
}
function extractPerDate(title) {
  if (!title) return '';
  const re = new RegExp('(\\d{1,2})\\s+(' + MONTH_FULL_ID.slice(1).join('|') + ')\\s+(\\d{4})', 'i');
  const m = title.match(re);
  if (!m) return title;
  const day = m[1].padStart(2, '0');
  const monthIdx = MONTH_FULL_ID.indexOf(m[2].toLowerCase());
  const monthAbbr = monthIdx > 0 ? MONTH_NAMES[monthIdx] : m[2];
  return 'Per: ' + day + '-' + monthAbbr + '-' + m[3];
}

// ===== ATURAN KATEGORI & DIVISI (edit di sini) =====
// Kategori diputuskan dari No.Customer + Faktur No. menurut aturan MASING-MASING DIVISI.
// Aturan divisi dicek dulu, baru aturan umum '*'. Aturan pertama yang cocok menang; satu aturan boleh memakai
// cust saja, faktur saja, atau keduanya (harus cocok semua). Tidak ada yang cocok -> kolom kategori sheet (kolom O),
// kosong/#N/A -> "LAINNYA".
var KATEGORI_RULES = {
  '*': [
    { cust: /^B\d+(PP|PER)$/i, kategori: 'PERINTIS GROUP' }
  ],
  'Body Repair': [
    // contoh: { cust: /^B0000095TS$/i, faktur: /\/INV\//i, kategori: 'NAMA KATEGORI' },
  ],
  'GR Adam Malik': [
  ],
  'GR Flamboyan': [
  ]
};
function tentukanKategori(f){
  var lists = [KATEGORI_RULES[normalizeDivisi(f.divisi)] || [], KATEGORI_RULES['*'] || []];
  for (var l = 0; l < lists.length; l++){
    for (var i = 0; i < lists[l].length; i++){
      var r = lists[l][i];
      if ((!r.cust || r.cust.test(f.cust || '')) && (!r.faktur || r.faktur.test(f.faktur || ''))) return r.kategori;
    }
  }
  var k = (f.rawKat || '').trim().toUpperCase();
  return (!k || k.charAt(0) === '#') ? 'LAINNYA' : k;
}
function normalizeDivisi(raw){
  var s = (raw || '').toUpperCase();
  if (/ADAM/.test(s)) return 'GR Adam Malik';
  if (/FLAMBOYAN/.test(s)) return 'GR Flamboyan';
  if (/BODY|REPAIR|\bBP\b/.test(s)) return 'Body Repair';
  return (raw || '').trim() || 'Lainnya';
}
var DIVISI_ORDER = ['Body Repair', 'GR Adam Malik', 'GR Flamboyan'];

function dateNum(s){ var d = parseDateDDMMYYYY(s); return d ? d.year * 10000 + d.month * 100 + d.day : 99999999; }
var SORT_DEF = {
  nama: ['s', i => i.nama], nopol: ['s', i => i.nopol], faktur: ['s', i => i.faktur], top: ['s', i => i.top],
  tgljto: ['n', i => dateNum(i.tgljto)], jumlah: ['n', i => i.jumlah], giro: ['s', i => i.giro],
  sacode: ['s', i => i.sacode], sa: ['s', i => i.sa], hari: ['n', i => parseInt(i.hari, 10) || 0]
};
function sortArrow(k){ return sortKey === k ? (sortDir > 0 ? ' \u25b2' : ' \u25bc') : ''; }
function thS(k, label, cls){ return '<th class="sortable' + (cls ? ' ' + cls : '') + '" data-sort="' + k + '">' + label + (k === 'no' ? '' : sortArrow(k)) + '</th>'; }
function sortInvoices(list){
  var def = SORT_DEF[sortKey] || SORT_DEF.tgljto;
  return list.slice().sort(function(a, b){
    var x = def[1](a), y = def[1](b);
    var c = def[0] === 's' ? String(x).localeCompare(String(y), 'id', { numeric: true }) : x - y;
    if (!c) c = dateNum(a.tgljto) - dateNum(b.tgljto);
    if (!c) c = (parseInt(b.hari, 10) || 0) - (parseInt(a.hari, 10) || 0);
    if (!c) c = a.faktur < b.faktur ? -1 : (a.faktur > b.faktur ? 1 : 0);
    return c * sortDir;
  });
}

function buildDebtors(invs){
  var by = {};
  invs.forEach(function(inv){
    var d = by[inv.nama] || (by[inv.nama] = { name: inv.nama, total: 0, count: 0, invoices: [], monthsMap: {}, katSet: {} });
    d.total += inv.jumlah; d.count += 1; d.invoices.push(inv); d.katSet[inv.kategori] = 1;
    var dt = parseDateDDMMYYYY(inv.tgljto);
    var key = dt ? dt.year + '-' + String(dt.month).padStart(2, '0') : 'unknown';
    d.monthsMap[key] = (d.monthsMap[key] || 0) + inv.jumlah;
  });
  return Object.keys(by).map(function(k){
    var d = by[k];
    var months = Object.keys(d.monthsMap).sort().map(function(key){
      var label = 'Lainnya';
      if (key !== 'unknown'){ var p = key.split('-'); label = MONTH_NAMES[parseInt(p[1])] + ' ' + p[0]; }
      return { period: key, label: label, total: d.monthsMap[key] };
    });
    return { name: d.name, total: d.total, count: d.count, kategori: Object.keys(d.katSet).join(' \u00b7 '), invoices: d.invoices, months: months };
  }).sort(function(a, b){ return b.total - a.total; });
}
function groupDebtors(invs){
  var total = 0; invs.forEach(function(i){ total += i.jumlah; });
  return { total: total, count: invs.length, debtors: buildDebtors(invs), invs: invs };
}

var COL_DEFAULT = { no:0, cust:1, nama:2, nopol:3, faktur:4, top:5, tgljto:6, jumlah:7, giro:8, sacode:9, sa:10, hari:11, divisi:12, kategori:14 };
var COL_ALIASES = {
  no: ['no'], cust: ['nocust','nocustomer','kodecust','kodecustomer'], nama: ['namadebitur','debitur','namacustomer'],
  nopol: ['nopolisi','nopol','polisi'], faktur: ['fakturno','nofaktur','faktur'], top: ['top'],
  tgljto: ['tgljto','tgljatuhtempo','jatuhtempo'], jumlah: ['jumlah','nilai','saldo'], giro: ['giro'],
  sacode: ['sa'], sa: ['namasa'], hari: ['hari','umur','umurpiutang'],
  divisi: ['divisi','division','div'], kategori: ['kategori','category','cabang','jenis']
};
var COL = Object.assign({}, COL_DEFAULT), COL_INFO = '';
function normHdr(s){ return String(s == null ? '' : s).replace(/^\uFEFF/, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function colLetter(n){ var s = ''; n = n + 1; while (n > 0){ var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function mapColumns(hdr){
  var col = Object.assign({}, COL_DEFAULT), info = [];
  Object.keys(COL_ALIASES).forEach(function(k){
    var found = -1;
    for (var j = 0; j < hdr.length; j++){ if (COL_ALIASES[k].indexOf(normHdr(hdr[j])) >= 0){ found = j; break; } }
    if (found >= 0) col[k] = found;
    if (k === 'divisi' || k === 'kategori' || k === 'hari') info.push(k.charAt(0).toUpperCase() + k.slice(1) + '=' + colLetter(col[k]) + (found >= 0 ? '' : ' (default)'));
  });
  COL_INFO = 'Kolom: ' + info.join(', ');
  return col;
}

function processRows(rows) {
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].some(function(c){ return normHdr(c) === 'namadebitur'; }) || (rows[i][0] && rows[i][0].trim() === 'No')) { headerIdx = i; break; }
  }
  if (headerIdx === -1) throw new Error("Format kolom tidak dikenali (header 'No' tidak ditemukan)");
  COL = mapColumns(rows[headerIdx]);

  let reportTitle = '';
  for (let i = 0; i < headerIdx; i++) {
    for (let j = 0; j < rows[i].length; j++) {
      const cell = (rows[i][j] || '').replace(/^\uFEFF/, '').trim();
      if (!cell) continue;
      if (cell.toLowerCase() === 'berita acara') continue;
      reportTitle = cell; break;
    }
    if (reportTitle) break;
  }

  const dataRows = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    var nv = r[COL.no]; if (!nv || !/^\d+$/.test(nv.trim())) continue;
    dataRows.push(r);
  }

  var invs = dataRows.map(function(r){
    var g = function(k){ var v = r[COL[k]]; return (v == null ? '' : String(v)).trim(); };
    var nama = g('nama'); nama = NAME_MAP[nama] || nama;
    var f = { cust: g('cust'), faktur: g('faktur'), divisi: g('divisi'), rawKat: g('kategori') };
    return { nama: nama, cust: f.cust, faktur: f.faktur, tgljto: g('tgljto'), nopol: g('nopol'),
             sa: g('sa'), hari: g('hari'), jumlah: parseAmount(g('jumlah')), top: g('top'), giro: g('giro'), sacode: g('sacode'),
             divisi: normalizeDivisi(f.divisi), kategori: tentukanKategori(f) };
  });
  return buildData(invs, reportTitle);
}
function buildData(invs, reportTitle){
  var grandTotal = 0; invs.forEach(function(i){ grandTotal += i.jumlah; });
  var byDivisi = {};
  DIVISI_ORDER.forEach(function(n){ byDivisi[n] = []; });
  invs.forEach(function(i){ (byDivisi[i.divisi] = byDivisi[i.divisi] || []).push(i); });
  var divisions = { 'Semua Cabang': groupDebtors(invs) };
  Object.keys(byDivisi).forEach(function(n){ divisions[n] = groupDebtors(byDivisi[n]); });

  return { grand_total: grandTotal, grand_count: invs.length, report_title: reportTitle, divisions: divisions };
}


function computeAgingBuckets(debtors) {
  const buckets = {
    b1: { label: '1-7 hari', min: 1, max: 7, color: 'var(--green)', total: 0, count: 0 },
    b2: { label: '8-14 hari', min: 8, max: 14, color: 'var(--amber)', total: 0, count: 0 },
    b3: { label: '15-26 hari', min: 15, max: 26, color: 'var(--orange)', total: 0, count: 0 },
    b4: { label: '> 26 hari', min: 27, max: Infinity, color: 'var(--red)', total: 0, count: 0, warn: true },
  };
  debtors.forEach(d => {
    d.invoices.forEach(inv => {
      const h = parseInt(inv.hari, 10);
      if (isNaN(h)) return;
      for (const key in buckets) {
        const b = buckets[key];
        if (h >= b.min && h <= b.max) { b.total += inv.jumlah; b.count += 1; break; }
      }
    });
  });
  return buckets;
}

function renderAgingCards(debtors) {
  const buckets = computeAgingBuckets(debtors);
  var html = '';
  Object.keys(buckets).forEach(key => { var b = buckets[key]; var act = (currentTab === 'penagihan' && penBucket === key);
    html += '<div data-bucket="' + key + '" title="Klik untuk lihat detail" style="cursor:pointer;' + (act ? 'box-shadow:0 0 0 2px var(--blue);' : '') + 'background:' + (b.warn ? '#fdecee' : 'var(--panel)') + ';border:1px solid ' + (b.warn ? '#f3b9c0' : 'var(--border)') + ';border-radius:14px;padding:18px 20px;">' +
      '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + b.color + ';margin-right:6px;"></span>' + b.label + '</div>' +
      '<div style="font-family:Georgia,serif;font-size:22px;font-weight:600;color:' + (b.warn ? 'var(--red)' : 'var(--ink)') + ';">' + rupiah(b.total) + '</div>' +
      '<div style="font-size:12px;color:' + (b.warn ? 'var(--red)' : 'var(--muted-2)') + ';margin-top:4px;">' + numId(b.count) + ' faktur' + (b.warn ? ' &middot; prioritas tagih' : '') + '</div>' +
    '</div>';
  });
  document.getElementById('agingGrid').innerHTML = html;
  document.querySelectorAll('#agingGrid [data-bucket]').forEach(el => el.addEventListener('click', () => selectBucket(el.getAttribute('data-bucket'))));
}

function createDebtorHtml(d, keyPrefix) {
  var key = keyPrefix + '||' + d.name;
  var qq = searchQuery.trim().toLowerCase();
  var byFak = !!qq && d.name.toLowerCase().indexOf(qq) < 0 && fakMatch(d, qq);
  var isOpen = (key in openDebtorKeys) ? !!openDebtorKeys[key] : byFak;
  var shown = byFak ? d.invoices.filter(i => i.faktur.toLowerCase().indexOf(qq) >= 0) : d.invoices;
  var monthsHtml = '<div class="bar-title">Total Piutang</div><div class="months-row"><div class="month-pill" style="font-size:14px;">Total keseluruhan<b style="font-size:20px;">' + rupiah(d.total) + '</b></div></div>';
  monthsHtml += '<div class="bar-title">Rincian per Bulan (Tgl Jatuh Tempo)</div><div class="months-row">';
  d.months.forEach(m => { monthsHtml += `<div class="month-pill">${escapeHtml(m.label)}<b>${rupiah(m.total)}</b></div>`; });
  monthsHtml += '</div>';

  var arrow = function(k){ return sortKey === k ? (sortDir > 0 ? ' \u25b2' : ' \u25bc') : ''; };
  var invHtml = '<div class="bar-title">Daftar Faktur (' + shown.length + ')</div><div class="table-scroll"><table><thead><tr>' + thS('no','No','num') + thS('faktur','No Faktur') + thS('tgljto','Tgl Jto') + thS('nopol','No Polisi') + thS('sa','SA') + thS('hari','Hari','num') + thS('jumlah','Jumlah','num') + '</tr></thead><tbody>';
  sortInvoices(shown).forEach((inv, i) => {
    invHtml += `<tr><td class="num">${i + 1}</td><td>${escapeHtml(inv.faktur)}</td><td>${escapeHtml(inv.tgljto)}</td><td>${escapeHtml(inv.nopol || '-')}</td><td>${escapeHtml(inv.sa)}</td><td class="num">${escapeHtml(String(inv.hari || '-'))}</td><td class="num">${rupiah(inv.jumlah)}</td></tr>`;
  });
  invHtml += '</tbody></table></div>';

  return `<div class="debtor${isOpen ? ' open' : ''}" data-key="${escapeHtml(key)}">
    <div class="debtor-head" data-toggle="${escapeHtml(key)}">
      <div><div class="debtor-name">${escapeHtml(d.name)}<span class="cab">${escapeHtml(d.kategori || '-')}</span></div>
      <div class="debtor-meta">${numId(d.count)} faktur</div></div>
      <div class="debtor-right"><div class="debtor-total">${rupiah(d.total)}</div><div class="chevron">&#9656;</div></div>
    </div>
    <div class="debtor-body">${isOpen ? (monthsHtml + invHtml) : ''}</div>
  </div>`;
}

function renderDebiturTab(debtors) {
  var q = searchQuery.trim().toLowerCase();
  var filtered = q ? debtors.filter(d => d.name.toLowerCase().includes(q) || fakMatch(d, q)) : debtors;
  var html = `<div class="search-bar"><input id="search" type="text" placeholder="Cari nama debitur atau no faktur..." value="${escapeHtml(searchQuery)}"></div><div class="list">`;
  if (!filtered.length) html += '<div class="loading">Tidak ada debitur yang cocok.</div>';
  filtered.forEach(d => { html += createDebtorHtml(d, 'root'); });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  wireContentHandlers();
}

function renderKategoriTab(dd) {
  var byK = {};
  dd.invs.forEach(function(i){ (byK[i.kategori] = byK[i.kategori] || []).push(i); });
  var groups = Object.keys(byK).map(function(k){
    var tot = 0; byK[k].forEach(function(i){ tot += i.jumlah; });
    return { name: k, total: tot, count: byK[k].length, debtors: buildDebtors(byK[k]) };
  }).sort((a, b) => b.total - a.total);
  var q = searchQuery.trim().toLowerCase();
  var html = `<div class="search-bar"><input id="search" type="text" placeholder="Cari kategori, debitur, atau no faktur..." value="${escapeHtml(searchQuery)}"></div><div class="list">`;
  groups.forEach(g => {
    var gKey = 'kategori||' + g.name;
    var isOpen = (gKey in openCabangKeys) ? !!openCabangKeys[gKey] : !!q;
    var matches = !q || g.name.toLowerCase().includes(q) || g.debtors.some(d => d.name.toLowerCase().includes(q) || fakMatch(d, q));
    if (!matches) return;
    html += `<div class="cabang-group${isOpen ? ' open' : ''}" data-key="${escapeHtml(gKey)}">
      <div class="cabang-head" data-toggle-cabang="${escapeHtml(gKey)}">
        <div><div class="cabang-title">${escapeHtml(g.name)}</div>
        <div class="cabang-meta">${numId(g.debtors.length)} debitur &middot; ${numId(g.count)} faktur</div></div>
        <div class="debtor-right"><div class="cabang-total">${rupiah(g.total)}</div><div class="chevron">&#9656;</div></div>
      </div>
      <div class="cabang-body">`;
    if (isOpen) {
      html += '<div class="list">';
      g.debtors.forEach(d => {
        var dOk = !q || d.name.toLowerCase().includes(q) || g.name.toLowerCase().includes(q) || fakMatch(d, q);
        if (dOk) html += createDebtorHtml(d, gKey);
      });
      html += '</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  wireContentHandlers();
}

    '<div class="bar-title">Prioritas tagihan &middot; ' + numId(list.length) + ' faktur &middot; ' + rupiah(total) + '</div>' +
    '<div class="debtor" style="padding:6px 16px 12px;"><div class="table-scroll"><table><thead><tr>' + thS('no','No','num') + thS('faktur','No Faktur') + thS('nama','Debitur') +
    thS('tgljto','Tgl Jto') + thS('nopol','No Polisi') + thS('sa','SA') + thS('hari','Hari','num') + thS('jumlah','Jumlah','num') + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  wireContentHandlers();
}

// ===================== REKAP LAPORAN (format Berita Acara) + EXPORT =====================
var rekapMode = 'debitur';   // 'debitur' | 'kategori'
var BULAN_ID = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function bulanLabel(key){ if (key === 'unknown') return 'Tanpa Tgl Jto'; var p = key.split('-'); return BULAN_ID[parseInt(p[1], 10)] + ' ' + p[0]; }
function rekapTitle(){ return (lastData && lastData.report_title) || 'Opname Piutang di PT. Perintis Perkasa'; }
function rekapHeads(){ return ['No', 'No. Customer', 'Nama Debitur', 'Bulan', 'Jumlah']; }

// Debitur diurutkan dari total terbesar; baris per bulan (Tgl Jto) urut kronologis.
function rekapDebtors(invs){
  var by = {};
  invs.forEach(function(inv){
    var d = by[inv.nama] || (by[inv.nama] = { name: inv.nama, custs: [], total: 0, mm: {} });
    if (inv.cust && d.custs.indexOf(inv.cust) < 0) d.custs.push(inv.cust);
    d.total += inv.jumlah;
    var dt = parseDateDDMMYYYY(inv.tgljto);
    var key = dt ? dt.year + '-' + String(dt.month).padStart(2, '0') : 'unknown';
    d.mm[key] = (d.mm[key] || 0) + inv.jumlah;
  });
  return Object.keys(by).map(function(k){
    var d = by[k];
    d.cust = d.custs.join(' / ');
    d.rows = Object.keys(d.mm).sort().map(function(key){ return { bulan: bulanLabel(key), jumlah: d.mm[key] }; });
    return d;
  }).sort(function(a, b){ return (b.total - a.total) || a.name.localeCompare(b.name, 'id'); });
}

// Hasil: daftar baris bertipe row / sub / cat / catsub / grand (semua nominal di satu kolom Jumlah)
function buildRekapLines(invs, mode){
  var lines = [], no = 0, grand = 0;
  function addDebtors(debtors){
    debtors.forEach(function(d){
      no++;
      d.rows.forEach(function(r, idx){ lines.push({ t: 'row', first: idx === 0, no: no, cust: d.cust, nama: d.name, bulan: r.bulan, jumlah: r.jumlah }); });
      lines.push({ t: 'sub', nama: d.name, amount: d.total });
    });
  }
  if (mode === 'kategori'){
    var byK = {};
    invs.forEach(function(i){ (byK[i.kategori] = byK[i.kategori] || []).push(i); });
    var cats = Object.keys(byK).map(function(k){
      var t = 0; byK[k].forEach(function(i){ t += i.jumlah; });
      return { name: k, total: t, debtors: rekapDebtors(byK[k]) };
    }).sort(function(a, b){ return (b.total - a.total) || a.name.localeCompare(b.name, 'id'); });
    cats.forEach(function(c){
      lines.push({ t: 'cat', name: c.name, ndeb: c.debtors.length });
      addDebtors(c.debtors);
      lines.push({ t: 'catsub', name: c.name, amount: c.total });
      grand += c.total;
    });
  } else {
    var ds = rekapDebtors(invs);
    addDebtors(ds);
    ds.forEach(function(d){ grand += d.total; });
  }
  lines.push({ t: 'grand', amount: grand });
  return { lines: lines, grand: grand };
}

// Sel-sel per baris (dipakai tampilan layar dan PDF). a: r = kanan, c = tengah
function lineCells(L){
  if (L.t === 'row'){
    return L.first
      ? [{ v: L.no, a: 'c' }, { v: L.cust }, { v: L.nama, b: 1 }, { v: L.bulan }, { v: L.jumlah, a: 'r', money: 1 }]
      : [{ v: '' }, { v: '' }, { v: '' }, { v: L.bulan }, { v: L.jumlah, a: 'r', money: 1 }];
  }
  if (L.t === 'sub') return [{ v: 'Subtotal ' + L.nama, span: 4, a: 'r', b: 1 }, { v: L.amount, a: 'r', money: 1, b: 1 }];
  if (L.t === 'cat') return [{ v: 'KATEGORI: ' + L.name + '  ·  ' + L.ndeb + ' debitur', span: 5, b: 1 }];
  if (L.t === 'catsub') return [{ v: 'Subtotal Kategori ' + L.name, span: 4, a: 'r', b: 1 }, { v: L.amount, a: 'r', money: 1, b: 1 }];
  return [{ v: 'GRAND TOTAL', span: 4, a: 'r', b: 1 }, { v: L.amount, a: 'r', money: 1, b: 1 }];
}

// Kelompokkan baris jadi blok yang tidak boleh terpotong saat dicetak:
// [judul kategori] + baris bulan debitur + subtotal debitur. Subtotal kategori dan grand total menempel pada blok terakhir.
function rekapBlocks(lines){
  var blocks = [], cur = null;
  lines.forEach(function(L){
    if (L.t === 'catsub' || L.t === 'grand'){
      if (blocks.length) blocks[blocks.length - 1].push(L); else blocks.push([L]);
      cur = null; return;
    }
    if (!cur){ cur = []; blocks.push(cur); }
    cur.push(L);
    if (L.t === 'sub') cur = null;
  });
  return blocks;
}

function rekapSections(dd){
  if (currentDivisi !== 'Semua Cabang') return [{ divisi: currentDivisi, invs: dd.invs }];
  var by = {};
  dd.invs.forEach(function(i){ (by[i.divisi] = by[i.divisi] || []).push(i); });
  var names = DIVISI_ORDER.filter(function(n){ return by[n] && by[n].length; })
    .concat(Object.keys(by).filter(function(n){ return DIVISI_ORDER.indexOf(n) < 0; }).sort());
  return names.map(function(n){ return { divisi: n, invs: by[n] }; });
}

function rekapTableHtml(lines, mode){
  var hc = ['ctr', '', '', '', 'num'];
  var h = '<div class="table-scroll"><table class="ba"><thead><tr>' + rekapHeads().map(function(t, i){ return '<th class="' + hc[i] + '"' + (i === 0 ? ' style="width:48px"' : '') + '>' + t + '</th>'; }).join('') + '</tr></thead><tbody>';
  lines.forEach(function(L){
    h += '<tr class="' + L.t + (L.first ? ' first' : '') + '">' + lineCells(L).map(function(c){
      return '<td' + (c.span ? ' colspan="' + c.span + '"' : '') + (c.a === 'r' ? ' class="num"' : (c.a === 'c' ? ' class="ctr"' : '')) + '>' + (c.money ? numId(c.v) : escapeHtml(String(c.v))) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}

function renderRekapTab(dd){
  var isAll = currentDivisi === 'Semua Cabang';
  var secs = rekapSections(dd);
  var modeLabel = rekapMode === 'kategori' ? 'Per Kategori' : 'Per Debitur';
  var html = '<div class="rekap-bar"><div class="seg">' +
    '<button data-rm="debitur" class="' + (rekapMode === 'debitur' ? 'active' : '') + '">Per Debitur</button>' +
    '<button data-rm="kategori" class="' + (rekapMode === 'kategori' ? 'active' : '') + '">Per Kategori</button></div>' +
    '<span class="rekap-spacer"></span>' +
    '<button class="btn" id="expPdf">&#11015; Export PDF</button><button class="btn" id="expXls">&#11015; Export Excel</button></div>';
  html += '<p class="rekap-note">Diurutkan dari nominal terbesar. ' + (isAll
    ? 'Karena ini tab Semua Cabang, export dipisah per divisi: hasilnya satu file ZIP berisi satu file per divisi (' + secs.map(function(s){ return escapeHtml(s.divisi); }).join(', ') + ').'
    : 'Export mengikuti tampilan di bawah (' + modeLabel + ', divisi ' + escapeHtml(currentDivisi) + ').') + '</p>';
  if (!secs.length) html += '<div class="loading">Tidak ada data.</div>';
  secs.forEach(function(s){
    var r = buildRekapLines(s.invs, rekapMode);
    html += '<div class="ba-wrap" style="margin-bottom:18px;"><p class="ba-title">Rekap Piutang</p>' +
      '<p class="ba-sub">' + escapeHtml(rekapTitle()) + '</p>' +
      '<p class="ba-sub" style="color:var(--muted);font-size:12.5px;">Divisi: ' + escapeHtml(s.divisi) + ' &middot; ' + modeLabel + ' &middot; ' + numId(s.invs.length) + ' faktur</p>' +
      rekapTableHtml(r.lines, rekapMode) + '</div>';
  });
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('[data-rm]').forEach(function(b){
    b.addEventListener('click', function(){ rekapMode = b.getAttribute('data-rm'); renderContent(); });
  });
  document.getElementById('expPdf').addEventListener('click', function(){ exportRekap('pdf'); });
  document.getElementById('expXls').addEventListener('click', function(){ exportRekap('xlsx'); });
}

// ---------- Export ----------
function safeName(s){ return String(s).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
function downloadBlob(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function pdfReady(){ return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable); }

function makePdf(sec, mode){
  var k = mode === 'kategori', JS = window.jspdf.jsPDF;
  var doc = new JS({ unit: 'pt', format: 'a4', orientation: 'portrait' });
  var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  var ML = 36, MR = 36, TW = W - ML - MR, BOT = 44, TOP2 = 40;   // TOP2 = batas atas halaman lanjutan
  var cw = [30, 82, 0, 90, 96]; cw[2] = TW - cw[0] - cw[1] - cw[3] - cw[4];
  var r = buildRekapLines(sec.invs, mode);
  var fills = { sub: [244, 246, 251], cat: [227, 233, 251], catsub: [213, 222, 250], grand: [31, 42, 68] };
  function toBody(lines){
    return lines.map(function(L){
      return lineCells(L).map(function(c){
        var cell = { content: c.money ? numId(c.v) : String(c.v), styles: {} };
        if (c.span) cell.colSpan = c.span;
        if (c.a === 'r') cell.styles.halign = 'right';
        if (c.a === 'c') cell.styles.halign = 'center';
        if (c.b) cell.styles.fontStyle = 'bold';
        if (fills[L.t]) cell.styles.fillColor = fills[L.t];
        if (L.t === 'cat') cell.styles.textColor = [36, 58, 143];
        if (L.t === 'grand') { cell.styles.textColor = [255, 255, 255]; cell.styles.fontSize = 10; }
        return cell;
      });
    });
  }
  var common = {
    theme: 'grid', tableWidth: TW,
    styles: { font: 'helvetica', fontSize: 9, cellPadding: { top: 3.5, bottom: 3.5, left: 6, right: 6 }, lineColor: [225, 227, 232], lineWidth: 0.4, textColor: 30, overflow: 'linebreak' },
    headStyles: { fillColor: [238, 240, 244], textColor: [90, 95, 105], fontStyle: 'bold', fontSize: 8.5 },
    columnStyles: { 0: { cellWidth: cw[0], halign: 'center' }, 1: { cellWidth: cw[1] }, 2: { cellWidth: cw[2] }, 3: { cellWidth: cw[3] }, 4: { cellWidth: cw[4], halign: 'right' } },
    didParseCell: function(d){
      if (d.section === 'head' && d.column.index === 4) d.cell.styles.halign = 'right';
      if (d.section === 'head' && d.column.index === 0) d.cell.styles.halign = 'center';
    }
  };
  var scratch = new JS({ unit: 'pt', format: 'a4', orientation: 'portrait' });
  function measure(body){   // tinggi tabel sebenarnya (termasuk baris yang membungkus), diukur dulu sebelum digambar
    scratch.autoTable(Object.assign({}, common, { startY: 0, body: body, showHead: 'never', margin: { left: ML, right: MR, top: 0, bottom: 0 } }));
    return scratch.lastAutoTable.finalY;
  }
  function drawHead(y){
    doc.autoTable(Object.assign({}, common, { startY: y, head: [rekapHeads()], body: [], margin: { left: ML, right: MR, top: TOP2, bottom: BOT } }));
    return doc.lastAutoTable.finalY;
  }

  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(0, 0, 0); doc.text('Rekap Piutang', ML, 44);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90, 95, 105);
  doc.text(rekapTitle(), ML, 60);
  doc.text('Divisi: ' + sec.divisi + '   |   ' + (k ? 'Per Kategori' : 'Per Debitur') + '   |   ' + sec.invs.length + ' faktur', ML, 74);
  doc.setTextColor(0, 0, 0);

  var y = drawHead(88), pageTop = y;
  rekapBlocks(r.lines).forEach(function(blk){
    var body = toBody(blk), h = measure(body);
    if (h > H - BOT - y - 1 && y > pageTop){      // tidak muat di sisa halaman -> pindah ke halaman baru
      doc.addPage(); y = drawHead(TOP2); pageTop = y;
    }
    if (h > H - BOT - y - 1){                      // satu blok lebih tinggi dari satu halaman: terpaksa lanjut, header diulang
      doc.autoTable(Object.assign({}, common, { startY: y, head: [rekapHeads()], body: body, showHead: 'everyPage', margin: { left: ML, right: MR, top: TOP2, bottom: BOT } }));
      y = doc.lastAutoTable.finalY; pageTop = -1;
    } else {
      doc.autoTable(Object.assign({}, common, { startY: y, body: body, showHead: 'never', pageBreak: 'avoid', margin: { left: ML, right: MR, top: TOP2, bottom: BOT } }));
      y = doc.lastAutoTable.finalY;
    }
  });
  var n = doc.internal.getNumberOfPages();
  for (var p = 1; p <= n; p++){
    doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120, 120, 120);
    doc.text('Halaman ' + p + ' / ' + n, W - MR, H - 20, { align: 'right' });
  }
  return doc;
}

async function makeXlsx(sec, mode){
  var k = mode === 'kategori', nc = 5, HEAD = 5;
  var wb = new window.ExcelJS.Workbook(); wb.creator = 'Dashboard Piutang';
  var ws = wb.addWorksheet(k ? 'Rekap Per Kategori' : 'Rekap Per Debitur', {
    pageSetup: { orientation: 'portrait', paperSize: 9, scale: 85, horizontalCentered: true, printTitlesRow: HEAD + ':' + HEAD,
                 margins: { left: 0.5, right: 0.5, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 } },
    headerFooter: { oddFooter: '&RHalaman &P dari &N' },
    views: [{ state: 'frozen', ySplit: HEAD }]
  });
  [6, 16, 44, 18, 20].forEach(function(w, i){ ws.getColumn(i + 1).width = w; });
  var FONT = 'Calibri', line = { style: 'thin', color: { argb: 'FFD9DBE1' } };
  var border = { top: line, left: line, bottom: line, right: line };
  var solid = function(argb){ return { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } }; };
  ws.getCell(1, 1).value = 'Rekap Piutang'; ws.getCell(1, 1).font = { name: FONT, bold: true, size: 15 };
  ws.getCell(2, 1).value = rekapTitle(); ws.getCell(2, 1).font = { name: FONT, size: 11, color: { argb: 'FF5A5F69' } };
  ws.getCell(3, 1).value = 'Divisi: ' + sec.divisi + '   |   ' + (k ? 'Per Kategori' : 'Per Debitur') + '   |   ' + sec.invs.length + ' faktur';
  ws.getCell(3, 1).font = { name: FONT, size: 11, color: { argb: 'FF5A5F69' } };
  rekapHeads().forEach(function(t, i){
    var c = ws.getCell(HEAD, i + 1);
    c.value = t; c.font = { name: FONT, bold: true, size: 11, color: { argb: 'FF5A5F69' } }; c.border = border; c.fill = solid('FFEEF0F4');
    c.alignment = { horizontal: i === 4 ? 'right' : (i === 0 ? 'center' : 'left'), vertical: 'middle' };
  });
  var fillArgb = { sub: 'FFF4F6FB', cat: 'FFE3E9FB', catsub: 'FFD5DEFA', grand: 'FF1F2A44' };
  var r = buildRekapLines(sec.invs, mode);
  var cur = HEAD + 1, debStart = null, catStart = null, firstData = HEAD + 1;
  var PAGE_ROWS = 46, used = HEAD;   // perkiraan jumlah baris per halaman cetak (skala 85%), dipakai agar satu blok debitur tidak terpotong
  function lineWeight(L){ return (L.t === 'row' && L.first && (String(L.nama).length > 46 || String(L.cust).length > 16)) ? 2 : 1; }
  rekapBlocks(r.lines).forEach(function(blk){
  var w = 0; blk.forEach(function(L){ w += lineWeight(L); });
  if (used + w > PAGE_ROWS && w <= PAGE_ROWS - 1 && cur - 1 > HEAD){ ws.getRow(cur - 1).addPageBreak(); used = 1; }
  used += w;
  blk.forEach(function(L){
    var cells = lineCells(L), col = 1;
    cells.forEach(function(cell){
      var span = cell.span || 1;
      for (var s = 0; s < span; s++){
        var x = ws.getCell(cur, col + s);
        x.border = border;
        x.font = { name: FONT, size: L.t === 'grand' ? 12 : 11, bold: !!cell.b, color: { argb: L.t === 'grand' ? 'FFFFFFFF' : (L.t === 'cat' ? 'FF243A8F' : 'FF1C1C1A') } };
        if (fillArgb[L.t]) x.fill = solid(fillArgb[L.t]);
      }
      var c0 = ws.getCell(cur, col);
      c0.value = cell.v === '' ? null : cell.v;
      c0.alignment = { horizontal: cell.a === 'r' ? 'right' : (cell.a === 'c' ? 'center' : 'left'), vertical: 'middle', wrapText: !cell.money && span === 1 };
      if (cell.money) c0.numFmt = '#,##0';
      if (span > 1) ws.mergeCells(cur, col, cur, col + span - 1);
      col += span;
    });
    // Rumus SUBTOTAL(9,...) mengabaikan subtotal lain di dalam rentang, jadi tidak terhitung dua kali
    if (L.t === 'row'){
      if (debStart === null) debStart = cur;
    } else if (L.t === 'sub'){
      ws.getCell(cur, 5).value = { formula: 'SUBTOTAL(9,E' + debStart + ':E' + (cur - 1) + ')', result: L.amount };
      debStart = null;
    } else if (L.t === 'cat'){
      catStart = cur + 1;
    } else if (L.t === 'catsub'){
      ws.getCell(cur, 5).value = { formula: 'SUBTOTAL(9,E' + catStart + ':E' + (cur - 1) + ')', result: L.amount };
      catStart = null;
    } else if (L.t === 'grand'){
      ws.getCell(cur, 5).value = { formula: 'SUBTOTAL(9,E' + firstData + ':E' + (cur - 1) + ')', result: L.amount };
    }
    cur++;
  });
  });
  return await wb.xlsx.writeBuffer();
}

async function exportRekap(kind){
  var bP = document.getElementById('expPdf'), bX = document.getElementById('expXls');
  var oldP = bP.innerHTML, oldX = bX.innerHTML;
  try {
    var dd = currentDivisiData(), secs = dd ? rekapSections(dd) : [], mode = rekapMode;
    if (!secs.length) throw new Error('Tidak ada data untuk diexport.');
    if (kind === 'pdf' && !pdfReady()) throw new Error('Library PDF belum termuat. Pastikan internet aktif lalu muat ulang halaman.');
    if (kind === 'xlsx' && !window.ExcelJS) throw new Error('Library Excel belum termuat. Pastikan internet aktif lalu muat ulang halaman.');
    var multi = currentDivisi === 'Semua Cabang' && secs.length > 1;
    if (multi && !window.JSZip) throw new Error('Library ZIP belum termuat. Pastikan internet aktif lalu muat ulang halaman.');
    bP.disabled = bX.disabled = true;
    (kind === 'pdf' ? bP : bX).textContent = 'Menyiapkan...';
    var d = new Date(), stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    var label = mode === 'kategori' ? 'Per_Kategori' : 'Per_Debitur';
    var files = [];
    for (var i = 0; i < secs.length; i++){
      var name = 'Rekap_Piutang_' + safeName(secs[i].divisi) + '_' + label + '_' + stamp + '.' + kind;
      if (kind === 'pdf') files.push({ name: name, data: makePdf(secs[i], mode).output('blob') });
      else files.push({ name: name, data: new Blob([await makeXlsx(secs[i], mode)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }) });
    }
    if (multi){
      var zip = new window.JSZip();
      files.forEach(function(f){ zip.file(f.name, f.data); });
      downloadBlob(await zip.generateAsync({ type: 'blob' }), 'Rekap_Piutang_Semua_Cabang_' + label + '_' + (kind === 'pdf' ? 'PDF' : 'Excel') + '_' + stamp + '.zip');
    } else {
      downloadBlob(files[0].data, files[0].name);
    }
  } catch (err) {
    alert('Export gagal: ' + err.message);
  } finally {
    var p2 = document.getElementById('expPdf'), x2 = document.getElementById('expXls');
    if (p2){ p2.disabled = false; p2.innerHTML = oldP; }
    if (x2){ x2.disabled = false; x2.innerHTML = oldX; }
  }
}

function selectBucket(key){
  penBucket = (currentTab === 'penagihan' && penBucket === key) ? 'all' : key;
  currentTab = 'penagihan'; searchQuery = '';
  document.querySelectorAll('#innerTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'penagihan'));
  renderContent();
  var c = document.getElementById('innerTabs'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function wireContentHandlers() {
  var s = document.getElementById('search');
  if (s) {
    s.addEventListener('input', e => { searchQuery = e.target.value; renderContent(); });
    
  }
  document.querySelectorAll('[data-toggle]').forEach(head => {
    head.addEventListener('click', () => {
      var key = head.getAttribute('data-toggle');
      openDebtorKeys[key] = !head.parentNode.classList.contains('open');
      renderContent();
    });
  });
  var pf = { priBucket: v => { priBucket = v; }, priCab: v => { priCab = v; }, priKat: v => { priKat = v; }, priDeb: v => { priDeb = v; }, penBucket: v => { penBucket = v; }, penCab: v => { penCab = v; }, penKat: v => { penKat = v; }, penDeb: v => { penDeb = v; } };
  Object.keys(pf).forEach(id => { var el = document.getElementById(id); if (el) el.addEventListener('change', e => { pf[id](e.target.value); renderContent(); }); });
  document.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      var k = th.getAttribute('data-sort');
      if (k === 'no' || sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = (k === 'hari' || k === 'jumlah') ? -1 : 1; }
      renderContent();
    });
  });
  document.querySelectorAll('[data-toggle-cabang]').forEach(head => {
    head.addEventListener('click', () => {
      var key = head.getAttribute('data-toggle-cabang');
      openCabangKeys[key] = !head.parentNode.classList.contains('open');
      renderContent();
    });
  });
}

function currentDivisiData(){
  if (!lastData || !currentDivisi) return null;
  return lastData.divisions[currentDivisi] || null;
}
function renderContent(){
  var dd = currentDivisiData();
  if (!dd) return;
  var a = document.activeElement;
  var typing = !!(a && a.id === 'search');
  var ss = typing ? a.selectionStart : 0, se = typing ? a.selectionEnd : 0;
  if (currentTab === 'debitur') renderDebiturTab(dd.debtors);
  else if (currentTab === 'penagihan') renderPenagihanTab(dd);
  else if (currentTab === 'prioritas') renderPrioritasTab(dd);
  else if (currentTab === 'rekap') renderRekapTab(dd);
  else renderKategoriTab(dd);
  renderAgingCards(dd.debtors);
  if (typing) { var s = document.getElementById('search'); if (s) { s.focus(); s.setSelectionRange(ss, se); } }
}
function renderDivisiPanel(){
  var dd = currentDivisiData();
  if (!dd) return;
  document.getElementById('totalAmount').textContent = rupiah(dd.total);
  document.getElementById('totalCount').textContent = numId(dd.count) + ' faktur / ' + numId(dd.debtors.length) + ' debitur';
  renderAgingCards(dd.debtors);
  renderContent();
}
function renderDivisiTabs(){
  var tabsEl = document.getElementById('divisiTabs');
  var ALL_KEY = 'Semua Cabang';
  var names = Object.keys(lastData.divisions);
  if (!currentDivisi || !lastData.divisions[currentDivisi]) currentDivisi = names[0];
  if (FIXED_DIVISI && lastData.divisions[FIXED_DIVISI]) { currentDivisi = FIXED_DIVISI; tabsEl.style.display = 'none'; return; }
  var html = '';
  names.forEach(name => {
    var d = lastData.divisions[name];
    var extraClass = (name === ALL_KEY) ? ' divisi-tab-all' : '';
    html += `<button class="divisi-tab${extraClass}${name === currentDivisi ? ' active' : ''}" data-divisi="${escapeHtml(name)}">${escapeHtml(name)}<span class="badge">${rupiah(d.total)}</span></button>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.style.display = 'flex';
  tabsEl.querySelectorAll('.divisi-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentDivisi = btn.getAttribute('data-divisi');
      searchQuery = ''; openDebtorKeys = {}; openCabangKeys = {}; penCab = 'all'; penKat = 'all'; penDeb = 'all'; priCab = 'all'; priKat = 'all'; priDeb = 'all';
      tabsEl.querySelectorAll('.divisi-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderDivisiPanel();
    });
  });
}

function render(data) {
  lastData = data;
  document.getElementById('source-sub').textContent = FIXED_DIVISI ? 'Sumber: Laporan Piutang (' + numId(data.divisions[FIXED_DIVISI].count) + ' faktur)' : 'Sumber: Laporan Piutang (' + numId(data.grand_count) + ' faktur, ' + numId(Object.keys(data.divisions).length) + ' divisi)';
  var perDate = extractPerDate(data.report_title);
  var opnameTitle = document.getElementById('opname-title');
  opnameTitle.textContent = perDate || data.report_title || '';
  opnameTitle.style.display = (perDate || data.report_title) ? '' : 'none';

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('divisiPanel').style.display = 'block';

  renderDivisiTabs();
  renderDivisiPanel();
}

document.querySelectorAll('#innerTabs .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#innerTabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    searchQuery = '';
    renderContent();
  });
});

async function loadData() {
  const statusEl = document.getElementById('status');
  const errBanner = document.getElementById('error-banner');
  errBanner.style.display = 'none';
  statusEl.innerHTML = '<span class="spin"></span>Mengambil data terbaru...';

  try {
    const res = await fetch(CSV_URL + '&_ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const data = processRows(rows);
    render(data);

    const now = new Date();
    statusEl.classList.remove('err');
    statusEl.innerHTML = 'Terakhir disinkron: <b>' + now.toLocaleString('id-ID') + '</b>';
  } catch (err) {
    statusEl.classList.add('err');
    statusEl.textContent = 'Gagal memuat data.';
    errBanner.style.display = 'block';
    errBanner.textContent = 'Error: ' + err.message + '. Pastikan koneksi internet aktif, dan sheet-nya masih "Published to web" (Google Sheets: File > Share > Publish to web).';
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadData);

const autoToggle = document.getElementById('auto-toggle');
function setupAutoRefresh() {
  if (autoTimer) clearInterval(autoTimer);
  if (autoToggle.checked) autoTimer = setInterval(loadData, 60000);
}
autoToggle.addEventListener('change', setupAutoRefresh);

// Dimulai langsung: gerbang password ada di halaman induk
loadData();
setupAutoRefresh();
</scr​ipt>
</body>
</html>
</script>

function findB64(o,d){
  if(d>5||o===null||o===undefined)return null;
  if(typeof o==='string'){
    if(o.length>2000&&/^[A-Za-z0-9+\/=\s]+$/.test(o))return o;
    if(o.length>2000&&o.charAt(0)==='{'){try{return findB64(JSON.parse(o),d+1)}catch(e){}}
    return null;
  }
  if(Array.isArray(o)){for(var i=0;i<o.length;i++){var r=findB64(o[i],d+1);if(r)return r}return null}
  if(typeof o==='object'){
    var keys=['content','data','blob','base64Content'];
    for(var k=0;k<keys.length;k++){if(o[keys[k]]!==undefined){var r2=findB64(o[keys[k]],d+1);if(r2)return r2}}
    for(var key in o){if(keys.indexOf(key)<0){var r3=findB64(o[key],d+1);if(r3)return r3}}
  }
  return null;
}
function extractB64(res){
